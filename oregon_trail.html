<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Oregon Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2a1f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. Painted trail scene on top, a parchment ledger of choices below. */
:root{
  --leather:#2a1f17;
  --bar:#3a2a1e;
  --paper:#ecdfc2;
  --paper-2:#e3d3ae;
  --paper-3:#d5c197;
  --ink:#2d2118;
  --ink-2:#5c4734;
  --rust:#9a4e29;
  --rust-2:#7a3a1c;
  --ochre:#b8862f;
  --sage:#6f7250;
  --rule:#b49b70;
  --display:"Rye", "Rockwell", Georgia, serif;
  --body:"Alegreya", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--leather);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 0 1px #000,0 0 40px rgba(0,0,0,.5)}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);color:var(--paper);border-bottom:2px solid #1c140e}
.bar .brand{font-family:var(--display);font-size:1.05rem;letter-spacing:.04em;white-space:nowrap}
.bar .tools{display:flex;gap:8px}
.bar button{white-space:nowrap;font:700 .78rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:transparent;border:1px solid #7a604a;border-radius:3px;padding:7px 10px;cursor:pointer;min-height:32px}
.bar button:hover{border-color:var(--paper)}
#stage{flex:none;position:relative;width:100%;aspect-ratio:2.35/1;max-height:54vh;background:#cdb88f;overflow:hidden;border-bottom:3px solid var(--ink)}
@media (max-width:600px){#stage{aspect-ratio:1.7/1}.bar .brand{font-size:.92rem}.bar button{padding:7px 8px;font-size:.7rem}}
#stage.tall{flex:1 1 auto;aspect-ratio:auto;max-height:none;min-height:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper)}
#panel.compact{flex:none;max-height:40%;padding-block:10px 12px}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{text-wrap:balance;margin:0}
.scr-title{font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--rust-2);letter-spacing:.02em;line-height:1.15}
.title-big{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3.3rem);color:var(--rust-2);line-height:1;text-align:left}
.kicker{font:700 .74rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
p{margin:0}
.lead{font-size:1.06rem}
.muted{color:var(--ink-2)}
.small{font-size:.92rem}
.msg{font-size:1.12rem}
.quote{font-style:italic;font-size:1.08rem}
.quote-by{font:700 .8rem/1.3 var(--mono);color:var(--ink-2);letter-spacing:.04em}
.choices{display:grid;gap:7px}
@media (min-width:640px){.choices.two{grid-template-columns:1fr 1fr}}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 12px;text-align:left;font:500 1.02rem/1.25 var(--body);color:var(--ink);background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;cursor:pointer;transition:background .12s,border-color .12s}
.choice:hover{background:var(--paper-3);border-color:var(--ink-2)}
.choice:focus-visible,.bar button:focus-visible,.step button:focus-visible,.step input:focus-visible,.field input:focus-visible,.raftbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.choice .num{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;font:700 .85rem/1 var(--mono);color:var(--paper);background:var(--ink-2);border-radius:2px}
.choice .lbl{flex:1;min-width:0}
.choice .hint{flex:none;font:400 .78rem/1 var(--mono);color:var(--ink-2)}
.choice.primary{background:var(--rust);border-color:var(--rust-2);color:#f6ead2}
.choice.primary .num{background:#f0dfbd;color:var(--rust-2)}
.choice.primary .hint{color:#ecd8b6}
.choice.primary:hover{background:var(--rust-2)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;padding:10px 12px;border:3px double var(--rule);background:#e7d8b6}
@media (max-width:520px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
.status div{min-width:0}
.status dt{font:700 .68rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.status dd{margin:0;font:700 .98rem/1.25 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.status dd.bad{color:var(--rust-2)}
.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.95rem;font-variant-numeric:tabular-nums}
.ledger th{text-align:left;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--rule);padding:4px 6px}
.ledger td{padding:6px;border-bottom:1px dotted var(--rule)}
.ledger td.r,.ledger th.r{text-align:right}
.ledger tr.total td{border-bottom:none;border-top:2px solid var(--ink);font-weight:700}
.party{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 .8rem/1 var(--mono);padding:6px 8px;border-radius:2px;border:1px solid var(--rule);background:var(--paper-2)}
.chip.sick{border-color:var(--ochre);background:#ead39d}
.chip.dead{text-decoration:line-through;color:var(--ink-2);opacity:.7}
.store{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.srow b{display:block;font-weight:700}
.srow small{display:block;font:400 .78rem/1.3 var(--mono);color:var(--ink-2)}
.srow .sub{font:700 .95rem/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px}
.step button{width:38px;height:38px;font:700 1.2rem/1 var(--mono);color:var(--ink);background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;cursor:pointer}
.step button:hover{background:var(--paper-3)}
.step input{width:62px;height:38px;text-align:center;font:700 1rem/1 var(--mono);color:var(--ink);background:#f4ead4;border:1px solid var(--rule);border-radius:3px}
@media (max-width:420px){.srow{grid-template-columns:minmax(0,1fr) auto}.srow .sub{display:none}.step input{width:50px}}
.bill{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;font:700 1rem/1.3 var(--mono);padding:8px 0}
.bill .over{color:var(--rust-2)}
.note{padding:10px 12px;border:1px dashed var(--rule);background:#e9dcbd;font-size:.98rem}
.fields{display:grid;gap:8px}
@media (min-width:600px){.fields{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font:700 .7rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.field input{height:42px;padding:0 10px;font:500 1.05rem var(--body);color:var(--ink);background:#f4ead4;border:1px solid var(--rule);border-radius:3px}
.raftpad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.raftbtn{min-height:64px;font:700 1.6rem/1 var(--mono);color:var(--paper);background:var(--ink-2);border:none;border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.raftbtn.on{background:var(--rust)}
.hide-touch{display:inline}
@media (pointer:coarse){.hide-touch{display:none}}
.topten td:first-child{width:2.2em;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <span class="brand">The Oregon Trail</span>
    <span class="tools">
      <button type="button" id="btnSound" aria-pressed="true">Sound on</button>
      <button type="button" id="btnTitle">Main menu</button>
    </span>
  </header>
  <div id="stage"><canvas id="scene" role="img" aria-label="Painted view of your wagon on the Oregon Trail"></canvas></div>
  <main id="panel" aria-live="polite"><div class="inner" id="inner"></div></main>
</div>
<script>
(() => {
'use strict';

/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + n.toFixed(2);
const hash = (i, seed = 0) => { const x = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453; return x - Math.floor(x); };
const tri = x => 1 - Math.abs((x - Math.floor(x)) * 2 - 1);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t)), g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t)), bl = Math.round(lerp(pa & 255, pb & 255, t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = ts => { const d = new Date(ts); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- game data ---------------- */
const PROFESSIONS = {
  banker:    { label: 'Be a banker from Boston',     short: 'Banker',    money: 1600, mult: 1 },
  carpenter: { label: 'Be a carpenter from Ohio',    short: 'Carpenter', money: 800,  mult: 2 },
  farmer:    { label: 'Be a farmer from Illinois',   short: 'Farmer',    money: 400,  mult: 3 }
};
const PACE = {
  1: { name: 'steady',    mult: 1,    pen: 2, desc: 'About 8 hours a day, stopping often to rest. Easiest on your party.' },
  2: { name: 'strenuous', mult: 1.4,  pen: 4, desc: 'About 12 hours a day, starting at sunrise. Your party will tire.' },
  3: { name: 'grueling',  mult: 1.75, pen: 6, desc: 'About 16 hours a day, dawn to dusk. Your party will wear down fast.' }
};
const RATIONS = {
  1: { name: 'filling',    lbs: 3, pen: 0, desc: 'Meals are large and generous. 3 lbs of food per person per day.' },
  2: { name: 'meager',     lbs: 2, pen: 2, desc: 'Meals are small, but adequate. 2 lbs per person per day.' },
  3: { name: 'bare bones', lbs: 1, pen: 4, desc: 'Meals are very small; everyone stays hungry. 1 lb per person per day.' }
};
const NAMES = ['Ezra','Hannah','Josiah','Clara','Silas','Martha','Amos','Eliza','Caleb','Sarah','Jacob','Mary','Abigail','Henry','Lucy','Samuel','Ruth','Thomas','Nancy','Levi','Emma','Jedediah','Cora','Isaac','Phoebe','Elias','Harriet','Moses','Lydia','Asa'];

const REGIONS = {
  plains:    { sky: ['#c6c2a7', '#ecd7a9'], far: 'flat',    farCol: '#b39b77', hill: '#a98d61', ground: '#b9955f', ground2: '#9c784a', trail: '#c9a974', flora: 'grass', temp: 0,   wet: 1,   game: { bison: 3, deer: 2, rabbit: 3, squirrel: 2 } },
  bluffs:    { sky: ['#cbbf9e', '#efd3a0'], far: 'mesa',    farCol: '#b78f68', hill: '#a8835a', ground: '#bc9761', ground2: '#a07a49', trail: '#cdaa72', flora: 'grass', temp: -2,  wet: .8,  game: { bison: 3, pronghorn: 2, rabbit: 3, deer: 1 } },
  foothills: { sky: ['#bdbaa5', '#e8cea1'], far: 'peaks',   farCol: '#8d7f70', hill: '#9b8058', ground: '#b08e5d', ground2: '#937346', trail: '#c3a16c', flora: 'sage',  temp: -8,  wet: .8,  game: { pronghorn: 3, deer: 2, rabbit: 3, bison: 1 } },
  mountains: { sky: ['#b3b5a8', '#e2cfab'], far: 'peaks',   farCol: '#7b7165', hill: '#857150', ground: '#a48656', ground2: '#866b42', trail: '#b9996a', flora: 'pine',  temp: -18, wet: 1,   game: { deer: 3, bear: 1, squirrel: 3, rabbit: 2, elk: 1 } },
  snake:     { sky: ['#c9bc9c', '#f0d6a3'], far: 'distant', farCol: '#a88f78', hill: '#b39765', ground: '#c3a06a', ground2: '#a5834f', trail: '#d2b17b', flora: 'sage',  temp: 2,   wet: .5,  game: { rabbit: 4, pronghorn: 2, deer: 1, squirrel: 1 } },
  bluemts:   { sky: ['#b0b4a6', '#dccaa6'], far: 'peaks',   farCol: '#6e695d', hill: '#6f6a48', ground: '#9a8355', ground2: '#7c6741', trail: '#ae9566', flora: 'pine',  temp: -12, wet: 1.2, game: { deer: 3, bear: 2, squirrel: 3, elk: 1 } },
  cascades:  { sky: ['#adb4ab', '#dccdb0'], far: 'volcano', farCol: '#7b796f', hill: '#6c6b4a', ground: '#948456', ground2: '#776a43', trail: '#a99566', flora: 'pine',  temp: -6,  wet: 1.4, game: { deer: 3, bear: 2, squirrel: 3 } },
  valley:    { sky: ['#b6baa8', '#e4d3ae'], far: 'volcano', farCol: '#868373', hill: '#7f7d52', ground: '#9c9160', ground2: '#807649', trail: '#b4a271', flora: 'grass', temp: -2,  wet: 1.3, game: { deer: 3, rabbit: 3, squirrel: 2 } }
};

const LM = {
  independence: { name: 'Independence, Missouri', short: 'Independence', art: 'town', region: 'plains', lon: -94.42, lat: 39.09, next: [['kansas', 102]], store: 1,
    desc: 'Independence is the busy jumping-off town for the trail west. Each spring, outfitters, blacksmiths and wagon makers crowd the square as emigrants gather supplies for the 2,000-mile trip to the Willamette Valley.',
    quotes: [['Get your wagon rolling before the grass on the prairie is gone. Late wagons find the mountains full of snow.', 'Matt, storekeeper'], ['Oxen are slow, but they are steady, cheap, and they will eat prairie grass. Mules will not stand up to it the same way.', 'A blacksmith on the square']] },
  kansas: { name: 'Kansas River Crossing', short: 'Kansas River', art: 'river', region: 'plains', lon: -95.68, lat: 39.06, next: [['bigblue', 83]], river: { w: [620, 680], d: [2.4, 4.4], ferry: 5 },
    desc: 'The Kansas River is the first major crossing. A ferry run by a Kaw and French-Canadian family carries wagons across for a fee.',
    quotes: [['The river looks gentle, but the bottom is soft. A wagon that stops in the middle can sink to the hubs.', 'Ferryman'], ['We crossed this morning. Lost a sack of flour and most of my patience.', 'An emigrant from Kentucky']] },
  bigblue: { name: 'Big Blue River Crossing', short: 'Big Blue River', art: 'river', region: 'plains', lon: -96.65, lat: 39.75, next: [['kearney', 119]], river: { w: [200, 260], d: [2.0, 3.8] },
    desc: 'The Big Blue River is a tributary of the Kansas. There is no ferry here, so travelers ford or float across. Spring rains can make it run high and fast.',
    quotes: [['Wait a day if you must. The river drops quick when the rain quits.', 'A wagon master'], ['Keep the oxen moving once they are in the water. If they stop, they panic.', 'A teamster']] },
  kearney: { name: 'Fort Kearney', short: 'Fort Kearney', art: 'fort', region: 'bluffs', lon: -99.0, lat: 40.65, next: [['chimney', 250]], store: 1.25,
    desc: 'Fort Kearney was built in 1848 to protect travelers on the Great Platte River Road. From here the trail follows the wide, shallow Platte River west.',
    quotes: [['The Platte is a mile wide and an inch deep. Too thick to drink and too thin to plow.', 'A soldier at the fort'], ['Buffalo chips burn well enough when there is no wood, and there is no wood.', 'A woman from Indiana']] },
  chimney: { name: 'Chimney Rock', short: 'Chimney Rock', art: 'spire', region: 'bluffs', lon: -103.35, lat: 41.70, next: [['laramie', 86]],
    desc: 'Chimney Rock rises nearly 300 feet above the North Platte valley. Travelers can see its slender spire for days before they reach it, and many write about it in their diaries.',
    quotes: [['We saw it two days back and thought it close enough to walk to before supper.', 'A boy from Ohio'], ['The wind and rain are wearing it down. My grandchildren may never see it.', 'A schoolteacher']] },
  laramie: { name: 'Fort Laramie', short: 'Fort Laramie', art: 'fort', region: 'foothills', lon: -104.55, lat: 42.20, next: [['indrock', 190]], store: 1.5,
    desc: 'Fort Laramie began as a fur-trading post and is now an important stop for repairs and supplies. Beyond it the land climbs toward the Rocky Mountains.',
    quotes: [['Lighten your load here. The hills ahead are steep, and the road behind us is lined with heavy furniture.', 'A trader'], ['Grass is thinner west of here. Watch your oxen.', 'A Lakota trader']] },
  indrock: { name: 'Independence Rock', short: 'Independence Rock', art: 'dome', region: 'foothills', lon: -107.13, lat: 42.49, next: [['southpass', 102]],
    desc: 'Independence Rock is a huge granite dome beside the Sweetwater River. Travelers hope to reach it by the Fourth of July to stay ahead of mountain snows. Thousands have carved their names into its sides.',
    quotes: [['I painted my name with axle grease. It will last longer than I will.', 'A young emigrant'], ['If you are here after July, push hard. Snow comes early in the Blue Mountains.', 'A guide']] },
  southpass: { name: 'South Pass', short: 'South Pass', art: 'pass', region: 'mountains', lon: -108.88, lat: 42.35, split: true, next: [['green', 57], ['bridger', 125]],
    desc: 'South Pass is a broad, gentle valley across the Continental Divide. From here, the rivers flow toward the Pacific. The trail divides ahead.',
    quotes: [['The Sublette Cutoff saves you days, but there is no water for fifty miles.', 'A mountain man'], ['Fort Bridger is the long way round, but you can rest and trade there.', 'A wagon master']] },
  green: { name: 'Green River Crossing', short: 'Green River', art: 'river', region: 'mountains', lon: -110.0, lat: 41.95, next: [['soda', 144]], river: { w: [380, 430], d: [10, 18], ferry: 10 },
    desc: 'The Green River is deep and swift, far too deep to ford. Travelers on the Sublette Cutoff cross some fifty dry miles to reach it.',
    quotes: [['The ferrymen charge plenty, but the river has drowned better swimmers than you.', 'A trapper'], ['My oxen went two days without water. They smelled the river a mile off.', 'A farmer from Iowa']] },
  bridger: { name: 'Fort Bridger', short: 'Fort Bridger', art: 'fort', region: 'mountains', lon: -110.38, lat: 41.32, next: [['soda', 162]], store: 1.75,
    desc: 'Fort Bridger is a small trading post run by the mountain man Jim Bridger. It is out of the way, but it is a place to rest, trade and buy supplies.',
    quotes: [['Jim Bridger knows these mountains better than any map.', 'A blacksmith'], ['Prices are steep this far out. Everything had to come by wagon, same as you.', 'The post clerk']] },
  soda: { name: 'Soda Springs', short: 'Soda Springs', art: 'springs', region: 'snake', lon: -111.6, lat: 42.65, next: [['fthall', 57]],
    desc: 'Soda Springs bubbles with naturally carbonated water. Travelers stop to taste it and rest beside the Bear River before pushing on to Fort Hall.',
    quotes: [['Add a little sugar and it tastes like lemonade. Well, almost.', 'A girl from Missouri'], ['Do not let the oxen drink from Steamboat Spring. It hisses for a reason.', 'An old hand']] },
  fthall: { name: 'Fort Hall', short: 'Fort Hall', art: 'fort', region: 'snake', lon: -112.45, lat: 43.02, next: [['snake', 182]], store: 2,
    desc: 'Fort Hall is a Hudson’s Bay Company trading post on the Snake River. Some travelers turn south here for California; the Oregon Trail continues west along the Snake.',
    quotes: [['The Snake country is dry and rough. Fill every water keg you have.', 'A company clerk'], ['Shoshone guides at Three Island Crossing know the river. Trade fair with them.', 'A trapper']] },
  snake: { name: 'Snake River Crossing', short: 'Snake River', art: 'river', region: 'snake', lon: -115.43, lat: 42.95, next: [['boise', 113]], river: { w: [980, 1060], d: [5, 9], guide: true },
    desc: 'At Three Island Crossing the Snake River is wide and swift. Shoshone guides know the safest way across the islands and will help travelers for a fair trade.',
    quotes: [['Some take the south bank to avoid the crossing. It is longer and drier.', 'An emigrant'], ['Use the islands. Cross in short stretches.', 'A Shoshone guide']] },
  boise: { name: 'Fort Boise', short: 'Fort Boise', art: 'fort', region: 'snake', lon: -116.95, lat: 43.8, next: [['bluemts', 160]], store: 2.25,
    desc: 'Fort Boise is another Hudson’s Bay Company post, near where the Boise River meets the Snake. Supplies are scarce and costly this far west.',
    quotes: [['The Blue Mountains are next. Mend your wagon before you start up.', 'The post keeper'], ['There is salmon in the river when the season is right.', 'A trader']] },
  bluemts: { name: 'Blue Mountains', short: 'Blue Mountains', art: 'pines', region: 'bluemts', lon: -118.25, lat: 45.5, split: true, next: [['wallawalla', 55], ['dalles', 125]],

    quotes: [['We cut our own road through the pines for two days.', 'A carpenter'], ['Snow up here by September. Do not linger.', 'A missionary']] },

function living() { return G.party.filter(m => m.alive); }

/* ---------------- audio ---------------- */
const AU = { ctx: null, on: store.get('ot_sound', true) };
function ac() { if (!AU.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) AU.ctx = new C(); } if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); return AU.ctx; }
function tone(f, dur, type = 'square', vol = .05, when = 0, slide = 0) {

  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, q = .7, when = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}
function sfx(k) {
  if (!AU.on) return;
  try {
    if (k === 'click') tone(520, .04, 'square', .025);
    else if (k === 'shot') { noise(.28, .5, 900, .5); tone(120, .12, 'triangle', .08, 0, -60); }
    else if (k === 'hit') tone(180, .14, 'triangle', .08, 0, -90);
    else if (k === 'splash') noise(.7, .35, 600, .4);
    else if (k === 'thud') { tone(90, .25, 'sine', .2, 0, -40); noise(.2, .3, 300); }
    else if (k === 'bad') { tone(330, .18, 'square', .03); tone(262, .3, 'square', .03, .18); }
    else if (k === 'arrive') { [392, 494, 587].forEach((f, i) => tone(f, .22, 'triangle', .06, i * .13)); }
    else if (k === 'death') { [330, 294, 247, 196].forEach((f, i) => tone(f, .4, 'triangle', .06, i * .32)); }
    else if (k === 'win') { [392, 494, 587, 784, 587, 784].forEach((f, i) => tone(f, .25, 'triangle', .06, i * .15)); }
  } catch (e) {}
}

function message(lines, done, title = '') {

  const step = () => {
    if (!queue.length) { done && done(); return; }
    const m = queue.shift();
    if (/died|drowned|thief|broke|lost:|tipped|swept/i.test(m)) sfx('bad');
    show({ status: !!G && view.mode !== 'tomb', title, html: `<p class="msg">${esc(m)}</p>`, list: [{ label: 'Continue', primary: true, hint: 'Enter', fn: step }] });

}

/* ---------------- weather ---------------- */
const TEMPS = [28, 34, 47, 59, 69, 79, 87, 85, 76, 63, 47, 35];
const PRECIP = [.2, .22, .28, .3, .3, .22, .14, .12, .14, .16, .2, .2];
function rollWeather() {
  const m = month(), reg = REGIONS[regionKey()];
  const t = TEMPS[m] + reg.temp + ri(-10, 10);
  const temp = t >= 90 ? 'very hot' : t >= 80 ? 'hot' : t >= 60 ? 'warm' : t >= 45 ? 'cool' : t >= 32 ? 'cold' : 'very cold';
  let precip = null;
  if (rnd() < PRECIP[m] * reg.wet) { const heavy = rnd() < .3; precip = t <= 36 ? (heavy ? 'heavy snow' : 'snow') : (heavy ? 'heavy rains' : 'rain'); }
  return { temp, precip, t };
}
function weatherLabel(w) { return w.precip ? ({ rain: 'rainy', 'heavy rains': 'very rainy', snow: 'snowy', 'heavy snow': 'very snowy' })[w.precip] : w.temp; }

/* ---------------- daily simulation ---------------- */
function pickDisease() {
  const opts = DISEASES.map(d => {
    let w = d.w;
    if (d.name === 'exhaustion') w *= G.pace === 3 ? 4 : G.pace === 2 ? 2 : .6;
    if (d.name === 'mountain fever' && /mountains|foothills|bluemts/.test(regionKey())) w *= 2.5;
    if (d.name === 'cholera' && /plains|bluffs/.test(regionKey())) w *= 1.6;
    return [w, d];
  });
  let r = rnd() * opts.reduce((s, o) => s + o[0], 0);
  for (const [w, d] of opts) { r -= w; if (r <= 0) return d; }
  return opts[0][1];
}
function addDay() { const d = new Date(G.date); d.setUTCDate(d.getUTCDate() + 1); G.date = d.getTime(); }
function dailyUpdate(mode) {
  const out = [];
  addDay();
  let alive = living();
  const need = alive.length * RATIONS[G.rations].lbs;
  let starving = false;
  if (G.food >= need) G.food = Math.round((G.food - need) * 10) / 10; else { G.food = 0; starving = true; }
  if (starving && !G.noFood) { G.noFood = true; out.push('You have run out of food.'); }
  if (!starving) G.noFood = false;
  let p = 0;
  if (mode === 'travel' || mode === 'wait') p += PACE[G.pace].pen;
  p += starving ? 7 : RATIONS[G.rations].pen;
  const w = G.weather || { temp: 'warm' }, full = alive.length * 2;
  if (w.temp === 'very hot') p += 2; else if (w.temp === 'hot') p += 1;
  else if (w.temp === 'cold') p += G.clothing >= full ? 0 : G.clothing >= alive.length ? 1 : 3;
  else if (w.temp === 'very cold') p += G.clothing >= full ? 1 : G.clothing >= alive.length ? 3 : 5;
  if (w.precip && mode !== 'rest') p += .5;
  alive.forEach(m => { if (m.sick) p += 1; });
  G.health = clamp(G.health * (mode === 'rest' ? .8 : .9) + p, 0, 180);
  for (const m of alive) {
    if (!m.sick) continue;
    let pd = m.sick.base + Math.max(0, G.health - 30) / 2200 + (starving ? .01 : 0);
    if (mode === 'rest') pd *= .5;
    if (rnd() < pd) { m.alive = false; m.cause = m.sick.name; out.push(`${m.name} has died of ${m.sick.name}.`); continue; }
    m.sick.days -= mode === 'rest' ? 2 : 1;
    if (m.sick.days <= 0) { m.sick = null; out.push(`${m.name} is well again.`); }
  }
  alive = living();
  if (alive.length && ((G.health >= 140 && rnd() < .2) || (starving && rnd() < .05))) {
    const m = pick(alive), c = starving ? 'starvation' : 'exhaustion';
    m.alive = false; m.cause = c; out.push(`${m.name} has died of ${c}.`);
  }
  const well = living().filter(m => !m.sick);
  if (well.length && rnd() < .006 + G.health / 1300) {
    const m = pick(well), d = pickDisease();
    m.sick = { name: d.name, base: d.base, days: ri(d.days[0], d.days[1]) };
    out.push(`${m.name} has ${d.name}.`);
  }
  G.weather = rollWeather();
  return out;
}
function loseDays(text, n) {
  const out = [`${text} Lose ${plural(n, 'day')}.`];
  for (let i = 0; i < n && !isOver(); i++) out.push(...dailyUpdate('wait'));
  return out;
}
function milesToday() {
  let m = 18 * PACE[G.pace].mult;
  const ox = G.oxen; m *= ox >= 6 ? 1 : .46 + ox * .09;
  const w = G.weather || {};
  m *= ({ 'heavy snow': .35, snow: .65, 'heavy rains': .7, rain: .9 })[w.precip] || 1;
  if (/mountains|bluemts|cascades/.test(regionKey())) m *= .82;
  if (healthLabel() === 'very poor') m *= .8;
  m *= .9 + rnd() * .2;
  return Math.max(1, Math.round(m));
}

/* ---------------- random events ---------------- */
function stealSomething() {
  const opts = [];
  if (G.food > 20) opts.push(() => { const n = Math.max(10, Math.round(G.food * (.1 + rnd() * .2))); G.food -= n; return `${n} pounds of food`; });
  if (G.bullets > 10) opts.push(() => { const n = Math.min(G.bullets, ri(10, 40)); G.bullets -= n; return `${n} bullets`; });
  if (G.clothing > 0) opts.push(() => { const n = Math.min(G.clothing, ri(1, 2)); G.clothing -= n; return plural(n, 'set') + ' of clothing'; });
  if (G.oxen > 2 && rnd() < .4) opts.push(() => { G.oxen -= 1; return '1 ox'; });
  for (const k of ['wheels', 'axles', 'tongues']) if (G[k] > 0) opts.push(() => { G[k] -= 1; return 'a spare ' + PART_NAME[k]; });
  return opts.length ? `A thief comes during the night and steals ${pick(opts)()}.` : 'A thief comes during the night, but finds nothing worth taking.';
}
function wagonBreak() {
  const k = pick(['wheels', 'axles', 'tongues']), name = PART_NAME[k];
  if (G[k] > 0) { G[k] -= 1; return [`Broken ${name}. You replace it with your spare.`]; }
  const chance = G.profession === 'carpenter' ? .75 : .4;
  if (rnd() < chance) return loseDays(`Broken ${name}. You are able to repair it.`, 1);
  G.broken = k;
  return [`Broken ${name}. You are unable to repair it. You will need to trade for a spare, or keep trying to fix it.`];
}
function injury() {
  const well = living().filter(m => !m.sick); if (!well.length) return null;
  const m = pick(well), d = pick(INJURIES);
  m.sick = { name: d.name, base: d.base, days: ri(d.days[0], d.days[1]) };
  return [`${m.name} has ${d.name}.`];
}
function abandoned() {
  const r = rnd();
  if (r < .25) return ['You find an abandoned wagon, but it is empty.'];
  if (r < .5) { const n = Math.min(ri(20, 60), 2000 - G.food); G.food += n; return [`You find an abandoned wagon with ${n} pounds of food.`]; }
  if (r < .7) { const n = ri(20, 50); G.bullets += n; return [`You find an abandoned wagon with ${n} bullets.`]; }
  if (r < .85) { const n = ri(1, 2); G.clothing += n; return [`You find an abandoned wagon with ${plural(n, 'set')} of clothing.`]; }
  const k = pick(['wheels', 'axles', 'tongues']); G[k] += 1;
  if (G.broken === k) { G.broken = null; G[k] -= 1; return [`You find an abandoned wagon and salvage a ${PART_NAME[k]} to fix your own.`]; }
  return [`You find an abandoned wagon with a spare ${PART_NAME[k]}.`];
}
function wagonFire() {
  const lost = [];
  if (G.food > 0) { const n = Math.round(G.food * (.08 + rnd() * .15)); G.food -= n; lost.push(`${n} pounds of food`); }
  if (G.clothing > 0 && rnd() < .6) { G.clothing -= 1; lost.push('1 set of clothing'); }
  if (G.bullets > 0 && rnd() < .5) { const n = Math.min(G.bullets, ri(10, 30)); G.bullets -= n; lost.push(`${n} bullets`); }
  return [lost.length ? `A fire in the wagon destroys ${lost.join(', ')}.` : 'A small fire in the wagon is put out before any harm is done.'];
}
function randomEvent() {
  const reg = regionKey(), w = G.weather || {}, m = month(), alive = living();
  const list = [
    [3, () => [stealSomething()]],
    [G.oxen > 0 ? (G.profession === 'farmer' ? 1 : 2.5) : 0, () => { G.oxen -= 1; return [pick(['One of your oxen has died.', 'An ox has wandered off.', 'One of your oxen is injured and cannot go on.'])]; }],
    [G.profession === 'carpenter' ? 2 : 3, wagonBreak],
    [1.5, () => loseDays('Lose trail.', ri(1, 4))],
    [1, () => loseDays('Wrong trail.', ri(1, 3))],
    [/cool|cold/.test(w.temp) ? 1.5 : .3, () => loseDays('Heavy fog.', 1)],
    [/plains|bluffs/.test(reg) && /hot|warm/.test(w.temp) ? 1.2 : 0, () => loseDays('Severe hail storm.', 1)],
    [/rain/.test(w.precip || '') ? 2 : 0, () => loseDays('Severe thunderstorm.', 1)],
    [/snow/.test(w.precip || '') ? 3 : 0, () => loseDays('Severe blizzard.', ri(1, 3))],
    [2, () => { G.health += 15; return ['Bad water.']; }],
    [G.dry ? 6 : (/snake|bluffs/.test(reg) && m >= 6 ? 2 : .8), () => { G.health += 10; return ['Very little water.']; }],
    [(m <= 3 || m >= 9) ? 1.5 : .3, () => { if (G.oxen > 0 && rnd() < .35) { G.oxen -= 1; return ['Inadequate grass. One of your oxen has died.']; } return ['Inadequate grass for the oxen.']; }],
    [m >= 4 && m <= 8 ? 1.5 : 0, () => { const n = Math.min(ri(15, 40), 2000 - G.food); G.food += n; return [`Find wild fruit. You gather ${n} pounds.`]; }],
    [1, abandoned],
    [2.2, injury],
    [G.food < 30 * alive.length ? 3 : 0, () => { const n = Math.min(ri(30, 60), 2000 - G.food); G.food += n; return [`Members of a ${TRIBES[reg]} band show you where to find wild roots and game. You gain ${n} pounds of food.`]; }],
    [.7, wagonFire],
    [alive.length > 1 ? .6 : 0, () => { const p = pick(alive.slice(1)); return loseDays(`${p.name} is lost.`, ri(1, 3)); }]
  ].filter(e => e[0] > 0);
  let r = rnd() * list.reduce((s, e) => s + e[0], 0);
  for (const [w2, fn] of list) { r -= w2; if (r <= 0) return fn(); }
  return null;
}
function gravesBetween(a, b) {
  return store.get('ot_graves', []).filter(g => g.mile > a && g.mile <= b && g.game !== G.id)
    .map(g => `You pass a grave beside the trail. Here lies ${g.name}.${g.epitaph ? ' The marker reads: “' + g.epitaph + '”' : ''}`);
}

/* ---------------- travel loop ---------------- */
function currentU() {
  if (view.mode === 'title') return view.demoU;
  if (!G) return 0;
  return (G.miles + T.d * T.prog) * PPM + view.extra;
}
function startTravel() {
  if (G.broken) return message(`Your wagon has a broken ${PART_NAME[G.broken]}. You can't travel until it's fixed.`, stoppedMenu);
  if (G.oxen <= 0) return message('You have no oxen to pull your wagon. Trade for oxen, or buy them at a fort.', stoppedMenu);
  setStage('trail');
  T.traveling = true; T.stopReq = false;
  show({ status: true, html: partyChips(), list: [{ label: 'Size up the situation', primary: true, hint: 'Space', fn: sizeUp }] });
  beginDay();
}
function beginDay() {
  if (G.oxen <= 0 || G.broken) { T.traveling = false; return startTravel(); }
  T.d = Math.min(milesToday(), G.nextMile - G.miles); T.prog = 0;
}
function sizeUp() { if (T.traveling) { T.stopReq = true; const b = inner.querySelector('.choice'); if (b) { b.disabled = true; b.querySelector('.lbl').textContent = 'Stopping…'; } } }
function endDay() {
  const before = G.miles;
  G.miles += T.d; T.d = 0; T.prog = 0;
  const msgs = dailyUpdate('travel');
  if (isOver()) { T.traveling = false; return message(msgs, gameOver); }
  msgs.push(...gravesBetween(before, G.miles));
  if (G.miles >= G.nextMile - .01) {
    G.miles = G.nextMile; T.traveling = false; save();
    return message(msgs, () => arrive(G.next));
  }
  if (rnd() < .12) { const e = randomEvent(); if (e) msgs.push(...e); }
  save();
  if (isOver()) { T.traveling = false; return message(msgs, gameOver); }
  if (msgs.length) {
    T.traveling = false;
    const wantStop = T.stopReq;
    return message(msgs, () => wantStop ? stoppedMenu() : startTravel());
  }
  if (T.stopReq) { T.traveling = false; return stoppedMenu(); }
  updateStatus(); beginDay();
}

/* ---------------- landmarks ---------------- */
function arrive(id) {
  G.at = id; G.next = null; G.route.push(id);
  const lm = LM[id];
  G.lmDone = !(lm.river || lm.split || lm.final || lm.end);
  G.weather = rollWeather();
  view.cur = { id, u: G.miles * PPM + view.extra };
  save();
  sfx('arrive');
  if (lm.end) return finishGame();
  show({ status: true, title: esc(lm.name), html: `<p class="lead">${esc(lm.desc)}</p>`, list: [{ label: 'Continue', primary: true, hint: 'Enter', fn: () => handleLandmark(id) }] });
}
function handleLandmark(id) {
  const lm = LM[id];
  if (!G.lmDone) {
    if (lm.river) return riverScreen();
    if (lm.split) return splitScreen();
    if (lm.final) return dallesScreen();
  }
  stoppedMenu();
}
function setLeg(id, miles) { G.next = id; G.legMiles = miles; G.nextMile = G.miles + miles; G.dry = G.at === 'southpass' && id === 'green'; }
function depart() {
  if (!G.next) { const [id, mi] = LM[G.at].next[0]; setLeg(id, mi); }
  G.last = G.at; G.at = null; G.lmDone = true;
  startTravel();
}
function continueTrail() {
  if (G.at && !G.lmDone) return handleLandmark(G.at);
  if (G.broken) return message(`Your wagon has a broken ${PART_NAME[G.broken]}. You can't travel until it's fixed.`, stoppedMenu);
  if (G.oxen <= 0) return message('You have no oxen to pull your wagon. Trade for oxen, or buy them at a fort.', stoppedMenu);
  if (G.at) depart(); else startTravel();
}
function stoppedMenu() {
  setStage('trail'); T.traveling = false; save();

  const list = [
    { label: 'Continue on trail', primary: true, hint: 'Enter', fn: continueTrail },

  if (!(at && at.store)) list.push({ label: 'Hunt for food', hint: `${G.bullets} bullets`, fn: huntIntro });
  if (G.broken) list.push({ label: `Try to repair the ${PART_NAME[G.broken]}`, fn: repairTry });
  show({ status: true, title: at ? esc(at.name) : 'On the trail', html: partyChips(), list, two: true });
}
function suppliesScreen() {

}

function restScreen() {

    } })).concat([{ label: 'Never mind', fn: stoppedMenu }]) });
}
function talkScreen() {

}
function repairTry() {
  const k = G.broken, chance = G.profession === 'carpenter' ? .5 : .28;
  const msgs = dailyUpdate('wait');
  if (isOver()) return message(msgs, gameOver);
  if (rnd() < chance) { G.broken = null; msgs.unshift(`You spend the day working on it and manage to repair the ${PART_NAME[k]}.`); }
  else msgs.unshift(`You spend the day trying to repair the ${PART_NAME[k]}, but it still won't hold.`);
  message(msgs, stoppedMenu);
}
function tradeScreen() {
  const msgs = dailyUpdate('wait');
  if (isOver()) return message(msgs, gameOver);
  const have = [];
  if (G.food >= 60) have.push(['food', ri(40, Math.min(150, Math.floor(G.food * .4))), 'pounds of food']);
  if (G.clothing >= 1) have.push(['clothing', ri(1, Math.min(3, G.clothing)), 'sets of clothing']);
  if (G.bullets >= 40) have.push(['bullets', ri(20, Math.min(100, G.bullets)), 'bullets']);
  if (G.oxen >= 3) have.push(['oxen', 1, 'ox']);
  for (const k of ['wheels', 'axles', 'tongues']) if (G[k] > 0) have.push([k, 1, PART_NAME[k]]);
  const finish = (text) => message(msgs.concat(text), stoppedMenu);
  if (!have.length || rnd() < .2) return finish('No one wants to trade with you today.');
  const want = pick(have);
  const giveOpts = [['food', ri(50, 150), 'pounds of food'], ['clothing', ri(1, 3), 'sets of clothing'], ['bullets', ri(30, 90), 'bullets'], ['oxen', ri(1, 2), 'oxen'], ['wheels', 1, 'wagon wheel'], ['axles', 1, 'wagon axle'], ['tongues', 1, 'wagon tongue']].filter(g => g[0] !== want[0]);
  let give = pick(giveOpts);
  if (G.broken && rnd() < .55 && want[0] !== G.broken) give = [G.broken, 1, PART_NAME[G.broken]];
  if (G.oxen <= 1 && rnd() < .55 && want[0] !== 'oxen') give = ['oxen', ri(1, 2), 'oxen'];
  const fmt = t => `${t[1]} ${t[1] === 1 && t[2] === 'oxen' ? 'ox' : t[1] === 1 ? t[2].replace(/^sets/, 'set') : t[2]}`;
  const who = pick(['A settler', 'A trader', 'A family from Tennessee', 'A trapper', 'A Hudson’s Bay man', 'A wagon master']);
  const run = () => show({ status: true, title: 'Attempt to trade', html: `${msgs.length ? `<p class="small muted">${msgs.map(esc).join(' ')}</p>` : ''}<p class="msg">${who} would like ${fmt(want)}. In exchange, they offer ${fmt(give)}.</p><p class="small muted">You have ${Math.floor(G[want[0]])} ${({ food: 'pounds of food', clothing: 'sets of clothing', bullets: 'bullets', oxen: 'oxen', wheels: 'spare wheels', axles: 'spare axles', tongues: 'spare tongues' })[want[0]]}.</p>`,
    list: [{ label: 'Accept the trade', primary: true, fn: () => {
      G[want[0]] -= want[1]; G[give[0]] += give[1];
      if (give[0] === 'food') G.food = Math.min(2000, G.food);
      if (G.broken && G[G.broken] > 0) { G[G.broken] -= 1; const p = PART_NAME[G.broken]; G.broken = null; return message(`You trade, then fit the new ${p} to your wagon.`, stoppedMenu); }
      message('You make the trade.', stoppedMenu);
    } }, { label: 'Decline', fn: stoppedMenu }] });
  run();
}

/* ---------------- trail splits & river ---------------- */
function splitScreen() {
  const lm = LM[G.at];
  const label = id => id === 'green' ? 'Head for the Green River crossing (Sublette Cutoff)' : id === 'bridger' ? 'Head for Fort Bridger' : id === 'wallawalla' ? 'Head for Fort Walla Walla' : 'Head for The Dalles';
  show({ status: true, title: 'The trail divides here', html: `<p>${esc(lm.short)}: you may choose a route.</p><table class="ledger"><tbody>${lm.next.map(([id, mi]) => `<tr><td>${esc(LM[id].name)}</td><td class="r">${mi} miles</td></tr>`).join('')}</tbody></table>`,
    list: lm.next.map(([id, mi]) => ({ label: label(id), fn: () => { setLeg(id, mi); G.lmDone = true; stoppedMenu(); } })).concat([{ label: 'See the map', fn: () => mapScreen(splitScreen) }]) });
}
function genRiver(id) {
  const r = LM[id].river, m = month();
  let depth = lerp(r.d[0], r.d[1], rnd());
  if (m >= 2 && m <= 5) depth += 1.1; else if (m >= 8) depth -= .6;
  if (G.weather && /rain/.test(G.weather.precip || '')) depth += .5;
  return { width: ri(r.w[0], r.w[1]), depth: Math.max(1.2, Math.round(depth * 10) / 10), swift: id === 'green' || id === 'snake' || rnd() < .3 };
}
function riverScreen() {
  const lm = LM[G.at], R = lm.river;
  const rv = G.river || (G.river = genRiver(G.at));
  const list = [
    { label: 'Attempt to ford the river', fn: () => cross('ford') },
    { label: 'Caulk the wagon and float it across', fn: () => cross('float') }
  ];
  if (R.ferry) list.push({ label: `Take a ferry across`, hint: money(R.ferry), disabled: G.money < R.ferry, fn: () => cross('ferry') });
  if (R.guide) list.push({ label: 'Hire a Shoshone guide', hint: '3 sets of clothing', disabled: G.clothing < 3, fn: () => cross('guide') });
  list.push({ label: 'Wait to see if conditions improve', fn: () => {
    const msgs = dailyUpdate('rest');
    if (isOver()) return message(msgs, gameOver);
    rv.depth = Math.max(1.2, Math.round((rv.depth + (rnd() - .62) * .8) * 10) / 10);
    message(msgs.concat(`You camp by the river for a day. It is now ${rv.depth.toFixed(1)} feet deep.`), riverScreen);
  } });
  list.push({ label: 'Get more information', fn: riverInfo });
  show({ status: true, title: esc(lm.name), html: `<p class="lead">You must cross the river to continue. Here it is <b>${rv.width} feet</b> across and <b>${rv.depth.toFixed(1)} feet</b> deep in the middle${rv.swift ? ', and the current is swift' : ''}.</p><p class="small muted">Weather: ${weatherLabel(G.weather)}.</p>`, list, two: true });
}
function riverInfo() {
  show({ status: true, title: 'Crossing a river', html: `<p><b>Fording</b> means driving the wagon across a shallow stretch with the oxen still hitched. It is safest when the water is under 2½ feet; much deeper and the wagon may tip or swamp.</p>
    <p><b>Caulking</b> means sealing the wagon box with tar so it floats like a boat. It works in deep water but a strong current can roll it.</p>
    <p><b>A ferry</b> is a flatboat run by someone else. It is the safest choice, but it costs money and you may wait your turn.</p>
    <p><b>A guide</b> who knows the river can lead you across by the shallowest route.</p>`, list: [{ label: 'Return', primary: true, fn: riverScreen }] });
}
function losses(sev) {
  const lost = [];
  const take = (k, frac, label) => { if (G[k] <= 0) return; const n = Math.max(1, Math.round(G[k] * frac)); G[k] -= n; lost.push(`${n} ${label(n)}`); };
  if (rnd() < .9) take('food', sev * (.3 + rnd() * .4), () => 'pounds of food');
  if (rnd() < .6) take('clothing', sev * (.3 + rnd() * .4), n => n === 1 ? 'set of clothing' : 'sets of clothing');
  if (rnd() < .6) take('bullets', sev * (.3 + rnd() * .4), n => n === 1 ? 'bullet' : 'bullets');
  if (rnd() < .35) take('oxen', sev * .25, n => n === 1 ? 'ox' : 'oxen');
  for (const k of ['wheels', 'axles', 'tongues']) if (rnd() < .3) take(k, 1, n => PART_NAME[k] + (n > 1 ? 's' : ''));
  return lost;
}
function cross(how) {
  const rv = G.river, R = LM[G.at].river, out = [];
  let tipped = false, wet = false;
  if (how === 'ford') {
    if (rv.depth < 2.5) { /* safe */ }
    else if (rv.depth < 3) wet = rnd() < .7;
    else { const p = clamp((rv.depth - 3) * .35 + .15 + (rv.swift ? .1 : 0), 0, .95); if (rnd() < p) tipped = true; else wet = true; }
  } else if (how === 'float') {
    if (rv.depth < 1.6) { out.push('The river is too shallow to float the wagon, and it runs aground.'); wet = true; }
    else tipped = rnd() < .07 + rv.width / 6000 + (rv.swift ? .12 : 0);
  } else if (how === 'ferry') {
    G.money -= R.ferry;
    const wait = ri(0, 3);
    if (wait) { out.push(`The ferry operator says you must wait ${plural(wait, 'day')} for your turn.`); for (let i = 0; i < wait && !isOver(); i++) out.push(...dailyUpdate('rest')); }
    tipped = rnd() < .02;
  } else if (how === 'guide') {
    G.clothing -= 3;
    out.push('The guide leads your wagon across by way of the islands.');
    tipped = rnd() < .02;
  }
  if (isOver()) return message(out, gameOver);
  crossAnim(how, tipped, () => {
    sfx(tipped ? 'bad' : 'splash');
    if (tipped) {
      const l = losses(how === 'ford' ? 1 : .7);
      out.push(how === 'float' ? 'The current rolls your wagon over.' : 'Your wagon tipped over while fording the river.');
      if (l.length) out.push('You lost: ' + l.join(', ') + '.');
      const others = living().slice(1);
      if (others.length && rnd() < .3) { const m = pick(others); m.alive = false; m.cause = 'drowning'; out.push(`${m.name} drowned.`); }
      else if (rnd() < .04) { G.party[0].alive = false; G.party[0].cause = 'drowning'; out.push(`${G.party[0].name} drowned.`); }
    } else if (wet) {
      out.push('Your supplies got wet crossing the river.');
      out.push(...loseDays('You stop to dry them out.', 1));
    } else out.push(how === 'ford' ? 'You forded the river safely.' : 'You made it across safely.');
    G.river = null; G.lmDone = true; save();
    message(out, () => isOver() ? gameOver() : depart());
  });
}
function crossAnim(mode, tipped, done) {
  show({ status: true, title: 'Crossing the river…', html: `<p class="muted">${mode === 'ford' ? 'The oxen wade into the current.' : mode === 'float' ? 'The caulked wagon drifts out from the bank.' : mode === 'ferry' ? 'The ferry is poled across.' : 'Your guide leads the way.'}</p>` });
  view.cross = { t: 0, dur: 3.4, mode, tipped, start: view.extra, dist: OFF + 230, done };
  sfx('splash');
}

/* ---------------- The Dalles / Barlow ---------------- */

    list: [
      { label: 'Float down the Columbia River', primary: true, fn: raftIntro },
      { label: 'Take the Barlow Toll Road', hint: money(toll), disabled: G.money < toll, fn: () => { G.money -= toll; G.lmDone = true; setLeg('willamette', 100); message(`You pay the ${money(toll)} toll and turn south toward Mount Hood.`, depart); } },
      { label: 'See the map', fn: () => mapScreen(dallesScreen) }
    ] });

/* ---------------- store ---------------- */
function storeScreen(where, back, intro) {
  const mult = LM[where].store || 1;
  const cart = { oxen: 0, food: 0, clothing: 0, bullets: 0, wheels: 0, axles: 0, tongues: 0 };
  const maxQ = k => k === 'oxen' ? Math.floor((20 - G.oxen) / 2) : k === 'food' ? Math.floor(2000 - G.food) : k === 'clothing' ? 99 - G.clothing : k === 'bullets' ? Math.floor((2000 - G.bullets) / 20) : 3 - G[k];
  const priceOf = it => Math.round(it.price * mult * 100) / 100;
  const total = () => ITEMS.reduce((s, it) => s + cart[it.k] * priceOf(it), 0);
  const isStart = where === 'independence' && intro;
  const name = where === 'independence' ? 'Matt’s General Store' : `${LM[where].short} store`;
  const greet = isStart ? `<p class="note">Howdy, I’m Matt. Headed for Oregon? I can outfit you with a team of oxen, warm clothing, food for the trip, ammunition for hunting and spare parts for the wagon. Take at least three yoke of oxen and 200 pounds of food for each person.</p>` : mult > 1 ? `<p class="small muted">Goods cost more out here: prices are ${Math.round(mult * 100)}% of what they were in Independence.</p>` : '';
  const rows = ITEMS.map(it => `<div class="srow"><div><b>${it.name}</b><small>${money(priceOf(it))} per ${it.unit} · ${it.note}</small><small>You have ${G[it.k]}${it.k === 'food' ? ' lbs' : ''}</small></div>
    <div class="step"><button type="button" data-k="${it.k}" data-d="-1" aria-label="Fewer ${it.name}">−</button><input id="q-${it.k}" data-k="${it.k}" inputmode="numeric" pattern="[0-9]*" value="0" aria-label="${it.name} quantity in ${it.unit}"><button type="button" data-k="${it.k}" data-d="1" aria-label="More ${it.name}">+</button></div>
    <div class="sub" id="s-${it.k}">$0.00</div></div>`).join('');
  const list = [
    { label: 'Buy these supplies', primary: true, fn: () => {
      const t = total(); if (t > G.money + 1e-6) return;
      ITEMS.forEach(it => { G[it.k] += cart[it.k] * it.per; });
      G.money = Math.round((G.money - t) * 100) / 100;
      if (isStart && G.oxen <= 0) return message('Don’t forget, you’ll need oxen to pull your wagon.', () => storeScreen(where, back, intro));
      sfx('arrive'); back();
    } },
    { label: isStart ? 'Leave the store' : 'Leave without buying', fn: () => {
      if (isStart && G.oxen <= 0) return message('Don’t forget, you’ll need oxen to pull your wagon.', () => storeScreen(where, back, intro));
      back();
    } }
  ];
  if (isStart) list.splice(1, 0, { label: 'Fill my order with Matt’s recommendations', fn: () => recommend() });
  show({ status: !isStart, title: name, html: `${greet}<p class="small"><b>${fmtDate(G.date)}</b> · You have <b>${money(G.money)}</b></p><div class="store">${rows}</div><div class="bill"><span>Total bill: <span id="bill">$0.00</span></span><span id="left">Left after: ${money(G.money)}</span></div>`, list, focus: false });
  const buyBtn = inner.querySelector('.choice.primary');
  const refresh = () => {
    ITEMS.forEach(it => { const inp = $('#q-' + it.k); if (document.activeElement !== inp) inp.value = cart[it.k]; $('#s-' + it.k).textContent = money(cart[it.k] * priceOf(it)); });
    const t = total(), left = G.money - t;
    $('#bill').textContent = money(t);
    const l = $('#left'); l.textContent = left < -1e-6 ? `Short by ${money(-left)}` : `Left after: ${money(left)}`; l.classList.toggle('over', left < -1e-6);
    buyBtn.disabled = left < -1e-6 || t === 0;
  };
  const recommend = () => {
    const n = G.party.length;
    const plan = [['oxen', 3], ['food', 120 * n], ['clothing', n], ['bullets', 5], ['food', 200 * n], ['clothing', 2 * n], ['bullets', 10], ['wheels', 1], ['axles', 1], ['tongues', 1]];
    ITEMS.forEach(it => cart[it.k] = 0);
    for (const [k, target] of plan) {
      const it = ITEMS.find(i => i.k === k), p = priceOf(it);
      const want = Math.min(target, maxQ(k)) - cart[k]; if (want <= 0) continue;
      const afford = Math.floor((G.money - total() + 1e-6) / p);
      let q = Math.min(want, afford); if (k === 'food') q = Math.floor(q / 10) * 10;
      cart[k] += Math.max(0, q);
    }
    refresh();
  };
  inner.querySelectorAll('.step button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, it = ITEMS.find(i => i.k === k);
    cart[k] = clamp(cart[k] + it.step * +b.dataset.d, 0, maxQ(k)); sfx('click'); refresh();
  }));
  inner.querySelectorAll('.step input').forEach(inp => {
    inp.addEventListener('input', () => { const k = inp.dataset.k; cart[k] = clamp(parseInt(inp.value.replace(/\D/g, ''), 10) || 0, 0, maxQ(k)); refresh(); });
    inp.addEventListener('blur', refresh);
    inp.addEventListener('focus', () => inp.select());
  });
  refresh();
}

const LEARN = [

/* ---------------- hunting ---------------- */
const ANIMALS = {
  squirrel:  { lbs: 2,   speed: 150, size: 8,  col: '#7a5a3c', zig: true },
  rabbit:    { lbs: 3,   speed: 190, size: 9,  col: '#9b8467', zig: true },
  pronghorn: { lbs: 40,  speed: 175, size: 19, col: '#b98a52' },
  deer:      { lbs: 50,  speed: 135, size: 21, col: '#8a6440' },
  elk:       { lbs: 220, speed: 95,  size: 28, col: '#7d5c3c' },
  bear:      { lbs: 100, speed: 70,  size: 25, col: '#3f2e22' },
  bison:     { lbs: 350, speed: 55,  size: 33, col: '#4f3726' }
};
let hunt = null;
function huntIntro() {
  if (G.bullets <= 0) return message('You have no bullets. You can’t hunt without ammunition.', stoppedMenu);
  show({ status: true, title: 'Hunt for food', html: `<p class="lead">You have ${G.bullets} bullets and 30 seconds of daylight. ${isTouch ? 'Tap where you want to shoot.' : 'Click to shoot where you aim, or turn with the arrow keys and fire with Space.'}</p><p class="small muted">Trees and rocks stop bullets. You can carry back no more than 100 pounds of meat.</p>`,
    list: [{ label: 'Start hunting', primary: true, fn: startHunt }, { label: 'Never mind', fn: stoppedMenu }] });
}
function startHunt() {
  setStage('hunt');
  const lw = W >= H ? 820 : 520;
  hunt = { t: 30, lw, lh: lw * H / Math.max(1, W), animals: [], bullets: [], obs: [], puffs: [], texts: [], meat: 0, aim: null, ang: -Math.PI / 2, cool: 0, spawn: .6, over: false, endT: 0, region: regionKey() };
  const flora = REGIONS[hunt.region].flora;
  const n = ri(8, 11);
  for (let i = 0; i < n * 4 && hunt.obs.length < n; i++) {
    const x = 40 + rnd() * (hunt.lw - 80), y = 30 + rnd() * (hunt.lh - 60);
    if (Math.hypot(x - hunt.lw / 2, y - hunt.lh / 2) < 95) continue;
    if (hunt.obs.some(o => Math.hypot(o.x - x, o.y - y) < 70)) continue;
    const type = flora === 'pine' ? pick(['pine', 'pine', 'rock', 'bush']) : flora === 'sage' ? pick(['sage', 'sage', 'rock', 'rock']) : pick(['tree', 'bush', 'bush', 'rock']);
    const r = type === 'pine' ? 20 + rnd() * 8 : type === 'tree' ? 22 + rnd() * 8 : type === 'rock' ? 11 + rnd() * 7 : 13 + rnd() * 6;
    hunt.obs.push({ x, y, r, type, seed: rnd() });
  }
  show({ status: false, html: `<p class="small"><b>Hunting.</b> ${isTouch ? 'Tap to shoot.' : 'Click to shoot · arrows aim · Space fires · Esc stops.'}</p>`, list: [{ label: 'Stop hunting', fn: () => endHunt() }], focus: false });
}
function huntPoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * hunt.lw, y: (e.clientY - r.top) / r.height * hunt.lh };
}
function fire() {
  if (!hunt || hunt.over || hunt.cool > 0 || G.bullets <= 0) return;
  G.bullets--; hunt.cool = .38;
  const hx = hunt.lw / 2, hy = hunt.lh / 2, c = Math.cos(hunt.ang), s = Math.sin(hunt.ang);
  hunt.bullets.push({ x: hx + c * 16, y: hy + s * 16, vx: c * 950, vy: s * 950, life: 1.4 });
  hunt.flash = .06; sfx('shot');
}
function spawnAnimal() {
  const tbl = REGIONS[hunt.region].game; let r = rnd() * Object.values(tbl).reduce((a, b) => a + b, 0), type = 'rabbit';
  for (const [k, w] of Object.entries(tbl)) { r -= w; if (r <= 0) { type = k; break; } }
  const A = ANIMALS[type], left = rnd() < .5, y = 30 + rnd() * (hunt.lh - 60);
  hunt.animals.push({ type, x: left ? -40 : hunt.lw + 40, y, vx: (left ? 1 : -1) * A.speed * (.8 + rnd() * .4), vy: (rnd() - .5) * A.speed * .3, ph: rnd() * 6, dead: false, turn: .5 + rnd(), face: left ? 1 : -1 });
}
function updateHunt(dt) {
  const h = hunt; if (!h) return;
  const nlh = h.lw * (H / Math.max(1, W));
  if (Math.abs(nlh - h.lh) > 1) { const f = nlh / h.lh; h.obs.forEach(o => o.y *= f); h.animals.forEach(a => a.y *= f); h.lh = nlh; }
  if (!h.over) {
    h.t -= dt; h.cool -= dt; h.spawn -= dt; if (h.flash) h.flash = Math.max(0, h.flash - dt);
    if (h.spawn <= 0 && h.animals.filter(a => !a.dead).length < 5) { spawnAnimal(); h.spawn = 1 + rnd() * 1.4; }
    if (keys.left) h.ang -= 2.6 * dt; if (keys.right) h.ang += 2.6 * dt;
    if (keys.up) h.ang = lerp(h.ang, -Math.PI / 2, .1); if (keys.down) h.ang = lerp(h.ang, Math.PI / 2, .1);
    if (h.aim) h.ang = Math.atan2(h.aim.y - h.lh / 2, h.aim.x - h.lw / 2);
    if (h.t <= 0 || (G.bullets <= 0 && !h.bullets.length)) { h.over = true; h.endT = .9; }
  } else { h.endT -= dt; if (h.endT <= 0) return endHunt(); }
  for (const a of h.animals) {
    if (a.dead) continue;
    const A = ANIMALS[a.type];
    a.ph += dt * A.speed / 9;
    if (A.zig) { a.turn -= dt; if (a.turn <= 0) { a.turn = .4 + rnd() * .9; a.vy = (rnd() - .5) * A.speed * 1.2; if (rnd() < .2) a.vx = -a.vx; } }
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.y < 20 || a.y > h.lh - 20) a.vy = -a.vy;
    if (Math.abs(a.vx) > 1) a.face = Math.sign(a.vx);
  }
  h.animals = h.animals.filter(a => a.dead || (a.x > -80 && a.x < h.lw + 80));
  for (const b of h.bullets) {
    for (let k = 0; k < 3 && b.life > 0; k++) {
      b.x += b.vx * dt / 3; b.y += b.vy * dt / 3;
      for (const o of h.obs) if (Math.hypot(o.x - b.x, o.y - b.y) < o.r * .8) { b.life = 0; h.puffs.push({ x: b.x, y: b.y, t: .4 }); break; }
      if (b.life <= 0) break;
      for (const a of h.animals) {
        if (a.dead) continue;
        const A = ANIMALS[a.type];
        if (Math.abs(a.x - b.x) < A.size * 1.05 && Math.abs(a.y - b.y) < A.size * .7) {
          a.dead = true; b.life = 0; h.meat += A.lbs; sfx('hit');
          h.texts.push({ x: a.x, y: a.y - A.size, t: 1.2, s: `+${A.lbs} lbs` }); break;
        }
      }
    }
    b.life -= dt;
    if (b.x < -20 || b.y < -20 || b.x > h.lw + 20 || b.y > h.lh + 20) b.life = 0;
  }
  h.bullets = h.bullets.filter(b => b.life > 0);
  h.puffs.forEach(p => p.t -= dt); h.puffs = h.puffs.filter(p => p.t > 0);
  h.texts.forEach(p => { p.t -= dt; p.y -= 20 * dt; }); h.texts = h.texts.filter(p => p.t > 0);
}
function endHunt() {
  if (!hunt) return;
  const meat = hunt.meat; hunt = null;
  setStage('trail');
  const msgs = [];
  if (meat <= 0) msgs.push('You were unable to shoot any food.');
  else {
    const carry = Math.min(meat, 100), got = Math.max(0, Math.min(carry, 2000 - Math.floor(G.food)));
    G.food += got;
    msgs.push(`From the animals you shot, you got ${meat} pounds of meat.${meat > 100 ? ' However, you were only able to carry 100 pounds back to the wagon.' : ''}${got < carry ? ' Your wagon could only hold ' + got + ' more pounds.' : ''}`);
  }
  msgs.push(...dailyUpdate('wait'));
  message(msgs, () => isOver() ? gameOver() : stoppedMenu());
}

/* ---------------- Columbia River raft ---------------- */
let raft = null;
function raftIntro() {
  show({ status: true, title: 'Float down the Columbia', html: `<p class="lead">You build a raft, lash your wagon onto it, and push off into the Columbia River.</p><p>Steer around the rocks. ${isTouch ? 'Hold the arrow buttons, or drag on the river.' : 'Use the ← → keys (or A and D), the buttons, or drag with the mouse.'}</p>`,
    list: [{ label: 'Push off', primary: true, fn: startRaft }, { label: 'Go back', fn: dallesScreen }] });
}
const rcx = (wy, lw) => lw / 2 + Math.sin(wy / 260) * lw * .13 + Math.sin(wy / 90 + 1) * lw * .04;
const rhw = (wy, lw) => lw * (.28 + .06 * Math.sin(wy / 170));
function startRaft() {
  setStage('raft');
  G.lmDone = true; setLeg('willamette', 100);
  const lw = 600;
  raft = { s: 0, len: 4800, lw, x: rcx(0, lw), vx: 0, dir: 0, target: null, rocks: [], hits: 0, inv: 0, toast: '', toastT: 0, log: [], done: false, bump: 0, foam: [] };
  for (let wy = 380; wy < raft.len - 150; wy += ri(100, 170)) {
    const cx = rcx(wy, lw), hw = rhw(wy, lw), n = rnd() < .28 ? 2 : 1, xs = [];
    for (let i = 0; i < n; i++) {
      let x, tries = 0; do { x = cx + (rnd() * 2 - 1) * hw * .78; tries++; } while (xs.some(v => Math.abs(v - x) < 110) && tries < 10);
      xs.push(x); raft.rocks.push({ wy: wy + ri(-20, 20), x, r: 12 + rnd() * 10, seed: rnd() });
    }
  }
  show({ status: false, html: `<div class="raftpad"><button type="button" class="raftbtn" id="rl" aria-label="Steer left">◀</button><button type="button" class="raftbtn" id="rr" aria-label="Steer right">▶</button></div>` });
  const hold = (el, d) => {
    const on = e => { e.preventDefault(); raft && (raft.dir = d); el.classList.add('on'); };
    const off = () => { raft && raft.dir === d && (raft.dir = 0); el.classList.remove('on'); };
    el.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, off));
  };
  hold($('#rl'), -1); hold($('#rr'), 1);
}
function raftHit() {
  const r = rnd(), others = living().slice(1);
  let t;
  if (r < .12 && others.length) { const m = pick(others); m.alive = false; m.cause = 'drowning'; t = `${m.name} fell overboard and drowned.`; }
  else if (r < .45 && G.food > 0) { const n = Math.max(1, Math.round(G.food * (.1 + rnd() * .15))); G.food -= n; t = `You hit a rock and lost ${n} pounds of food.`; }
  else if (r < .65 && G.clothing > 0) { const n = Math.min(G.clothing, ri(1, 3)); G.clothing -= n; t = `You hit a rock and lost ${plural(n, 'set')} of clothing.`; }
  else if (r < .8 && G.bullets > 0) { const n = Math.min(G.bullets, ri(20, 60)); G.bullets -= n; t = `You hit a rock and lost ${n} bullets.`; }
  else if (r < .9 && G.oxen > 0) { G.oxen -= 1; t = 'You hit a rock. An ox was swept away.'; }
  else t = 'The raft strikes a rock but holds together.';
  raft.log.push(t); raft.toast = t; raft.toastT = 2.4; raft.hits++;
}
function updateRaft(dt) {
  const R = raft; if (!R || R.done) return;
  const lh = R.lw * (H / Math.max(1, W)), ry = lh * .72;
  let dir = R.dir || (keys.left ? -1 : keys.right ? 1 : 0);
  if (R.target != null && !dir) { const d = R.target - R.x; dir = Math.abs(d) > 6 ? Math.sign(d) * Math.min(1, Math.abs(d) / 40) : 0; }
  R.vx += (dir * 240 - R.vx) * Math.min(1, dt * 6);
  R.x += R.vx * dt;
  const sp = 150 + (Math.sin(R.s / 400) > .7 ? 70 : 0);
  R.s += sp * dt; R.inv -= dt; R.toastT -= dt; R.bump -= dt;
  const cx = rcx(R.s, R.lw), hw = rhw(R.s, R.lw);
  if (R.x - 17 < cx - hw) { R.x = cx - hw + 17; R.vx = Math.abs(R.vx) * .4; if (R.bump <= 0) { R.bump = .6; sfx('thud'); } }
  if (R.x + 17 > cx + hw) { R.x = cx + hw - 17; R.vx = -Math.abs(R.vx) * .4; if (R.bump <= 0) { R.bump = .6; sfx('thud'); } }
  if (R.inv <= 0) for (const k of R.rocks) {
    if (Math.abs(k.wy - R.s) < k.r + 20 && Math.abs(k.x - R.x) < k.r + 15) { R.inv = 1.5; view.shake = .3; sfx('thud'); raftHit(); break; }
  }
  if (R.s >= R.len) {
    R.done = true;
    const log = R.log.slice(); raft = null;
    const msgs = [R.hits === 0 ? 'You guide the raft through the rapids without a scratch.' : `You made it through the rapids. Your raft struck rocks ${plural(log.length, 'time')}.`];
    msgs.push(...dailyUpdate('travel'));
    setStage('trail');
    if (isOver()) return message(msgs, gameOver);
    G.miles = G.nextMile; G.last = 'dalles'; G.at = null;
    message(msgs, () => arrive('willamette'));
  }
}

function finishGame() {
  T.traveling = false; setStage('trail'); sfx('win');
  store.del('ot_save');
  const alive = living(), hl = healthLabel(), per = { good: 500, fair: 400, poor: 300, 'very poor': 200 }[hl];
  const parts = G.wheels + G.axles + G.tongues;
  const rows = [
    [`${plural(alive.length, 'person', 'people')} in ${hl} health`, alive.length * per],
    ['1 wagon', 50],
    [plural(G.oxen, 'ox', 'oxen'), G.oxen * 4],
    [plural(parts, 'spare wagon part'), parts * 2],
    [plural(G.clothing, 'set') + ' of clothing', G.clothing * 2],
    [`${G.bullets} bullets`, Math.floor(G.bullets / 50)],
    [`${Math.floor(G.food)} pounds of food`, Math.floor(G.food / 25)],
    [`${money(G.money)} cash`, Math.floor(G.money / 5)]
  ];
  const sub = rows.reduce((s, r) => s + r[1], 0), mult = PROFESSIONS[G.profession].mult, total = sub * mult;
  const entry = { name: G.party[0].name, score: total };

    ctx.beginPath(); ctx.ellipse(0, -2, 16, 8, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(16, -18); ctx.lineTo(21, -16); ctx.lineTo(15, -4); ctx.fill(); ctx.beginPath(); ctx.ellipse(20, -17, 5, 3.4, .3, 0, 7); ctx.fill();
    if (a.type === 'pronghorn') { ctx.fillStyle = '#eadfca'; ctx.beginPath(); ctx.ellipse(0, 2, 12, 3.5, 0, 0, 7); ctx.fill(); }
    if (a.type === 'deer' || a.type === 'elk') { ctx.strokeStyle = '#5a4630'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(18, -20); ctx.lineTo(16, a.type === 'elk' ? -34 : -28); ctx.moveTo(17, -26); ctx.lineTo(12, -30); if (a.type === 'elk') { ctx.moveTo(16.5, -30); ctx.lineTo(22, -35); } ctx.stroke(); }
    if (a.type === 'pronghorn') { ctx.strokeStyle = '#2d2118'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(19, -20); ctx.lineTo(18, -26); ctx.stroke(); }
  }
  ctx.restore();
}
function drawHunt() {
  const h = hunt, u = W / h.lw, reg = REGIONS[h.region];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, mix(reg.ground, '#ecd7a9', .2)); g.addColorStop(1, reg.ground2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) { const x = hash(i, 21) * W, y = hash(i, 22) * H; tuft(x, y, u * .8, mix(reg.ground2, '#5e5a2e', .35)); }
  for (const o of h.obs) { ctx.fillStyle = 'rgba(40,28,18,.2)'; ctx.beginPath(); ctx.ellipse((o.x + 4) * u, (o.y + o.r * .5) * u, o.r * u, o.r * .4 * u, 0, 0, 7); ctx.fill(); }
  for (const a of h.animals.filter(a => a.dead)) drawAnimal(a, u);
  for (const a of h.animals.filter(a => !a.dead)) drawAnimal(a, u);
  for (const o of h.obs) {
    const x = o.x * u, y = o.y * u, r = o.r * u;
    if (o.type === 'pine') pine(x, y + r * .6, r * 2.6, '#55603f');
    else if (o.type === 'tree') { ctx.fillStyle = '#5a4430'; ctx.fillRect(x - r * .12, y, r * .24, r * .7); ctx.fillStyle = '#727650'; ctx.beginPath(); ctx.arc(x, y - r * .2, r, 0, 7); ctx.fill(); ctx.fillStyle = '#82865c'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .45, r * .55, 0, 7); ctx.fill(); }
    else if (o.type === 'rock') { ctx.fillStyle = '#8c7b66'; ctx.beginPath(); ctx.ellipse(x, y, r, r * .75, 0, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,240,210,.25)'; ctx.beginPath(); ctx.ellipse(x - r * .3, y - r * .3, r * .45, r * .25, 0, 0, 7); ctx.fill(); }
    else if (o.type === 'sage') sage(x, y + r * .4, r / 7);
    else { ctx.fillStyle = '#7a7a52'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.arc(x + r * .6, y + r * .2, r * .7, 0, 7); ctx.fill(); }
  }
  ctx.strokeStyle = '#2d2118'; ctx.lineWidth = 2 * u;
  for (const b of h.bullets) { ctx.beginPath(); ctx.moveTo(b.x * u, b.y * u); ctx.lineTo((b.x - b.vx * .015) * u, (b.y - b.vy * .015) * u); ctx.stroke(); }
  for (const p of h.puffs) { ctx.fillStyle = `rgba(220,210,190,${p.t * 2})`; ctx.beginPath(); ctx.arc(p.x * u, p.y * u, (10 - p.t * 15) * u, 0, 7); ctx.fill(); }
  const hx = h.lw / 2 * u, hy = h.lh / 2 * u;
  ctx.save(); ctx.translate(hx, hy);
  ctx.fillStyle = 'rgba(40,28,18,.25)'; ctx.beginPath(); ctx.ellipse(0, 10 * u, 12 * u, 4 * u, 0, 0, 7); ctx.fill();
  ctx.rotate(h.ang); ctx.strokeStyle = '#3a2a1c'; ctx.lineWidth = 3 * u; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22 * u, 0); ctx.stroke();
  if (h.flash) { ctx.fillStyle = '#f0d08a'; ctx.beginPath(); ctx.arc(25 * u, 0, 5 * u, 0, 7); ctx.fill(); }
  ctx.rotate(-h.ang);
  ctx.fillStyle = '#6b4b30'; ctx.beginPath(); ctx.arc(0, 0, 8 * u, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a3626'; ctx.beginPath(); ctx.ellipse(0, -2 * u, 11 * u, 6 * u, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#5c4430'; ctx.beginPath(); ctx.arc(0, -3 * u, 5 * u, 0, 7); ctx.fill();
  ctx.restore();
  const ax = hx + Math.cos(h.ang) * 90 * u, ay = hy + Math.sin(h.ang) * 90 * u;
  const cx = h.aim && !isTouch ? h.aim.x * u : ax, cy = h.aim && !isTouch ? h.aim.y * u : ay;
  ctx.strokeStyle = 'rgba(45,33,24,.75)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 7); ctx.moveTo(cx - 14, cy); ctx.lineTo(cx - 4, cy); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 14, cy); ctx.moveTo(cx, cy - 14); ctx.lineTo(cx, cy - 4); ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + 14); ctx.stroke();
  ctx.font = `700 ${Math.round(clamp(13 * u, 12, 18))}px "Courier Prime", monospace`; ctx.textAlign = 'center';
  for (const t of h.texts) { ctx.fillStyle = `rgba(45,33,24,${Math.min(1, t.t)})`; ctx.fillText(t.s, t.x * u, t.y * u); }
  hud([`Time ${Math.max(0, Math.ceil(h.t))}`, `Bullets ${G.bullets}`, `Meat ${h.meat} lbs`]);
  if (h.over) banner(h.meat ? `${h.meat} pounds of meat` : 'Nothing shot');
}
function hud(items) {
  const fs = Math.round(clamp(W / 50, 12, 16)), pad = 8;
  ctx.font = `700 ${fs}px "Courier Prime", monospace`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const text = items.join('   '), tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(42,31,23,.78)'; ctx.fillRect(pad, pad, tw + 20, fs + 14);
  ctx.fillStyle = '#ecdfc2'; ctx.fillText(text, pad + 10, pad + (fs + 14) / 2); ctx.textBaseline = 'alphabetic';
}
function banner(text) {
  const fs = Math.round(clamp(W / 26, 16, 28));
  ctx.font = `${fs}px Rye, Georgia, serif`; ctx.textAlign = 'center';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(236,223,194,.92)'; ctx.fillRect(W / 2 - tw / 2 - 18, H / 2 - fs, tw + 36, fs * 1.7);
  ctx.strokeStyle = '#5c4734'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - tw / 2 - 18, H / 2 - fs, tw + 36, fs * 1.7);
  ctx.fillStyle = '#7a3a1c'; ctx.fillText(text, W / 2, H / 2 + fs * .3);
}
function drawRaft() {
  const R = raft, u = W / R.lw, lh = R.lw * (H / Math.max(1, W)), ry = lh * .72;
  ctx.fillStyle = '#6f8683'; ctx.fillRect(0, 0, W, H);
  const step = 8;
  const bank = side => {
    ctx.beginPath(); ctx.moveTo(side < 0 ? 0 : W, 0);
    for (let y = 0; y <= lh + step; y += step) { const wy = R.s + (ry - y); ctx.lineTo((rcx(wy, R.lw) + side * rhw(wy, R.lw)) * u, y * u); }
    ctx.lineTo(side < 0 ? 0 : W, H); ctx.closePath();
  };
  ctx.fillStyle = '#8a7a52'; bank(-1); ctx.fill(); bank(1); ctx.fill();
  ctx.strokeStyle = 'rgba(232,228,214,.55)'; ctx.lineWidth = 3 * u; bank(-1); ctx.stroke(); bank(1); ctx.stroke();
  ctx.strokeStyle = 'rgba(225,230,222,.35)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 26; i++) {
    const wy = Math.floor(R.s / 60) * 60 + i * 60 - 600 + hash(i + Math.floor(R.s / 60), 4) * 20, y = ry - (wy - R.s);
    if (y < -10 || y > lh + 10) continue;
    const x = rcx(wy, R.lw) + (hash(Math.floor(wy), 5) - .5) * rhw(wy, R.lw) * 1.4;
    ctx.beginPath(); ctx.moveTo(x * u, y * u); ctx.lineTo(x * u, (y + 14) * u); ctx.stroke();
  }
  for (let i = Math.floor((R.s - lh) / 50) - 2; i < (R.s + lh) / 50 + 2; i++) {
    const wy = i * 50, y = ry - (wy - R.s); if (y < -40 || y > lh + 40) continue;
    for (const side of [-1, 1]) {
      if (hash(i, side + 30) < .35) continue;
      const edge = rcx(wy, R.lw) + side * rhw(wy, R.lw), x = edge + side * (22 + hash(i, side + 40) * 60);
      if (x < -20 || x > R.lw + 20) continue;
      pine(x * u, y * u, (30 + hash(i, side + 50) * 20) * u, side < 0 ? '#55603f' : '#4f5638');
    }
  }
  for (const k of R.rocks) {
    const y = ry - (k.wy - R.s); if (y < -40 || y > lh + 40) continue;
    ctx.fillStyle = 'rgba(232,230,218,.5)'; ctx.beginPath(); ctx.ellipse(k.x * u, (y + 3) * u, (k.r + 6) * u, (k.r + 3) * u, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a4d42'; ctx.beginPath(); ctx.ellipse(k.x * u, y * u, k.r * u, k.r * .8 * u, k.seed, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,215,.22)'; ctx.beginPath(); ctx.ellipse((k.x - k.r * .3) * u, (y - k.r * .25) * u, k.r * .4 * u, k.r * .25 * u, 0, 0, 7); ctx.fill();
  }
  const blink = R.inv > 0 && Math.floor(R.inv * 10) % 2 === 0;
  if (!blink) {
    ctx.save(); ctx.translate(R.x * u, ry * u); ctx.rotate(R.vx / 1400); ctx.scale(u, u);
    ctx.fillStyle = 'rgba(225,230,222,.45)'; ctx.beginPath(); ctx.ellipse(0, 26, 20, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#7b5636'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-18 + i * 7.2, -24, 7, 48, 3) : ctx.rect(-18 + i * 7.2, -24, 7, 48); ctx.fill(); }
    ctx.strokeStyle = '#4b3322'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-18, -16); ctx.lineTo(18, -16); ctx.moveTo(-18, 16); ctx.lineTo(18, 16); ctx.stroke();
    ctx.fillStyle = '#e8dcc0'; ctx.strokeStyle = '#a8977a'; ctx.beginPath(); ctx.ellipse(0, 0, 11, 17, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,100,70,.4)'; ctx.beginPath(); for (const y of [-9, -3, 3, 9]) { ctx.moveTo(-10, y); ctx.lineTo(10, y); } ctx.stroke();
    ctx.restore();
  }
  hud([`Columbia River`, `${Math.max(0, Math.round((R.len - R.s) / R.len * 100))}% to go`, `Food ${Math.floor(G.food)}`]);
  if (R.toastT > 0) {
    const fs = Math.round(clamp(W / 48, 12, 16));
    ctx.font = `700 ${fs}px "Courier Prime", monospace`; ctx.textAlign = 'center';
    const tw = ctx.measureText(R.toast).width, y = H - fs * 2.2;
    ctx.fillStyle = `rgba(42,31,23,${Math.min(.85, R.toastT)})`; ctx.fillRect(W / 2 - tw / 2 - 12, y - fs, tw + 24, fs * 1.8);
    ctx.fillStyle = `rgba(236,223,194,${Math.min(1, R.toastT)})`; ctx.fillText(R.toast, W / 2, y + fs * .3);
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  view.time += dt;
  if (view.mode === 'title') view.demoU += dt * 55;
  if (view.mode === 'title' || T.traveling || view.cross) view.sunT += dt / 75;
  if (T.traveling && T.d > 0) { T.prog += dt * 1000 / DAY_MS * (T.stopReq ? 4 : 1); if (T.prog >= 1) { T.prog = 1; endDay(); } }
  if (hunt) updateHunt(dt);
  if (raft) updateRaft(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (view.shake > 0 && !reduceMotion) { view.shake -= dt; ctx.translate((rnd() - .5) * 8, (rnd() - .5) * 6); }
  try {
    if (view.mode === 'hunt' && hunt) drawHunt();
    else if (view.mode === 'raft' && raft) drawRaft();
    else if (view.mode === 'map' && G) drawMap();
    else drawTrailScene(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- input ---------------- */
const keys = { left: false, right: false, up: false, down: false };
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
document.addEventListener('keydown', e => {
  const typing = e.target.matches && e.target.matches('input, textarea');
  if ((hunt || raft) && KEYMAP[e.key] && !typing) { keys[KEYMAP[e.key]] = true; e.preventDefault(); if (hunt) hunt.aim = null; return; }
  if (hunt && !typing) { if (e.key === ' ') { e.preventDefault(); fire(); } if (e.key === 'Escape') endHunt(); return; }
  if (typing) return;
  if (T.traveling && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); sizeUp(); return; }
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if (/^[0-9]$/.test(e.key)) { const i = e.key === '0' ? 9 : +e.key - 1, c = choices[i]; const b = inner.querySelector(`.choice[data-i="${i}"]`); if (c && b && !b.disabled) { e.preventDefault(); sfx('click'); c.fn(); } }
  else if (e.key === 'Enter' || e.key === ' ') { const i = choices.findIndex(c => c.primary); const b = inner.querySelector(`.choice[data-i="${i}"]`); if (i >= 0 && b && !b.disabled) { e.preventDefault(); sfx('click'); choices[i].fn(); } }
});
document.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.up = keys.down = false; });
cv.addEventListener('pointerdown', e => {
  if (hunt) { e.preventDefault(); hunt.aim = huntPoint(e); hunt.ang = Math.atan2(hunt.aim.y - hunt.lh / 2, hunt.aim.x - hunt.lw / 2); fire(); }
  else if (raft) { e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId); const r = cv.getBoundingClientRect(); raft.target = (e.clientX - r.left) / r.width * raft.lw; }
  else if (T.traveling) sizeUp();
});
cv.addEventListener('pointermove', e => {
  if (hunt && e.pointerType === 'mouse') hunt.aim = huntPoint(e);
  else if (raft && raft.target != null) { const r = cv.getBoundingClientRect(); raft.target = (e.clientX - r.left) / r.width * raft.lw; }
});
const endDrag = () => { if (raft) raft.target = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
function toggleSound() {
  AU.on = !AU.on; store.set('ot_sound', AU.on);
  const b = $('#btnSound'); b.textContent = AU.on ? 'Sound on' : 'Sound off'; b.setAttribute('aria-pressed', String(AU.on));
  if (AU.on) sfx('click');
}
$('#btnSound').addEventListener('click', toggleSound);
$('#btnSound').textContent = AU.on ? 'Sound on' : 'Sound off';
$('#btnSound').setAttribute('aria-pressed', String(AU.on));
$('#btnTitle').addEventListener('click', () => { if (hunt || raft) return; if (G && !isOver() && G.party.length) save(); view.cross = null; titleScreen(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && T.traveling) T.stopReq = true; });

titleScreen();
})();
</script>
