{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Choose a new password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password <span class="hint">(at least {{ config.PASSWORD_MIN_LENGTH }} characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{ config.PASSWORD_MIN_LENGTH }}" required autofocus>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    <button type="submit">Set password</button>
  </form>
</section>
{% endblock %}
