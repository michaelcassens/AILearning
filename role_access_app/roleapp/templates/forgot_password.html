{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Forgot your password?</h1>
  <p>Enter your username or email. If the account has an email address on file, we'll send a link to choose a new password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="identifier">Username or email</label>
    <input id="identifier" name="identifier" autocomplete="username" required autofocus>
    <button type="submit">Send reset link</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</section>
{% endblock %}
