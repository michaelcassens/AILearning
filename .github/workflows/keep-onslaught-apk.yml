name: Build Keep Onslaught APK

on:
  push:
    paths:
      - keep_onslaught.html
      - keep_onslaught_icon.png
      - keep_onslaught.webmanifest
      - 'keep-onslaught-android/**'
      - .github/workflows/keep-onslaught-apk.yml
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keep-onslaught-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Copy the game into the Android project
        run: npm run sync

      - name: Build the APK
        working-directory: keep-onslaught-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk keep-onslaught.apk

      - uses: actions/upload-artifact@v4
        with:
          name: keep-onslaught-apk
          path: keep-onslaught-android/keep-onslaught.apk
