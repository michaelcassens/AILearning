/* quiz-style challenges: learn, plan, predict, bug, ai, judge */
function renderQuiz(ctx) {
  const { c, body } = ctx;
  const r = rec(c.id);
  if (c.intro) body.append(frag('<div class="intro">' + c.intro + '</div>'));
  if (c.symptom) body.append(frag('<div class="symptom"><p><strong><span aria-hidden="true">🐞</span> Bug report:</strong> ' + c.symptom + '</p></div>'));
  if (c.ai) body.append(frag('<div class="ai-box"><p class="ai-label"><span aria-hidden="true">🤖</span> Someone asked an AI assistant:</p><blockquote>' + esc(c.ai) + '</blockquote><p class="ai-label">It answered with this code:</p></div>'));
  let viewer = null;
  const total = c.questions.length;
  if (c.code) viewer = codeBlock(body, c.code, { runnable: c.runnable !== false, lockRun: c.runAfter && !r.done && (r.qDone || 0) < total });
  if (c.ways) body.append(waysBlock(c.ways, false));
  (c.codes || []).forEach((x, i) => {
    body.append(frag('<h2 class="code-title">' + esc(x.label) + '</h2>'));
    const v = codeBlock(body, x.code, { runnable: true });
    if (i === 0 && !viewer) viewer = v;
  });
  const qsec = frag('<section aria-label="Questions"><h2>' + (c.variant === 'bug' ? 'Investigate' : 'Questions') + '</h2><div class="qlist"></div></section>');
  body.append(qsec);
  const after = document.createElement('div');
  body.append(after);
  const finish = () => {
    if (c.fixed) {
      after.append(frag('<h2>The fixed version</h2>'));
      codeBlock(after, c.fixed, { runnable: true });
    }
    completeChallenge(ctx, r);
  };
  runQuestions($('.qlist', qsec), c.questions, { viewer, r, key: 'qDone', review: r.done }, () => {
    if (viewer) viewer.unlockRun();
    if (c.explain) explainBox(after, c, r, c.variant === 'bug' ? 'Explain the bug to a teammate' : 'Explain it in your own words', finish);
    else finish();
  });
}

/* build challenges: plan → write code → explain */
function renderBuild(ctx) {
  const { c, body } = ctx;
  const r = rec(c.id);
  body.append(frag('<div class="intro">' + c.intro + '</div>'));
  const planWrap = document.createElement('div');
  body.append(planWrap);
  let step = 1, wbShown = false;
  if (c.plan && c.plan.length) {
    planWrap.append(frag('<section><h2>Step 1 · Understand the problem</h2><p class="muted">Answer these before you code. Thinking it through first is the point.</p><div class="qlist"></div></section>'));
    step = 2;
    runQuestions($('.qlist', planWrap), c.plan, { r, key: 'planDone', review: r.done || (r.planDone || 0) >= c.plan.length }, showWorkbench);
  } else showWorkbench();

  function showWorkbench() {
    if (wbShown) return;
    wbShown = true;
    const edId = 'ed' + (++uid);
    const wb = frag('<section class="workbench"><h2>Step ' + step + ' · Build it</h2><div class="build-grid">' +
      '<div class="build-left">' +
        '<div class="card"><h3>Your code must…</h3><ul class="tests spec">' + c.tests.map(t => '<li>' + esc(testLabel(t)) + '</li>').join('') + '</ul></div>' +
        '<div class="card"><h3>Hints</h3><p class="muted">Each hint gives away a bit more. Try before you peek.</p><div class="hint-list" aria-live="polite"></div><button type="button" class="btn ghost hint-btn"></button></div>' +
        '<div class="card"><h3><span aria-hidden="true">🤖</span> AI assistant</h3><div class="ai-area"></div></div>' +
      '</div><div class="build-right">' +
        '<div class="editor-label" id="' + edId + '">Your code</div><div class="editor-host"></div>' +
        '<div class="runbar"><button type="button" class="btn run">▶ Run &amp; review</button><button type="button" class="btn ghost reset">Reset to starter code</button></div>' +
        '<div class="out" hidden></div><div class="coach" hidden aria-live="polite"></div>' +
      '</div></div></section>');
    body.append(wb);
    const runBtn = $('.run', wb), out = $('.out', wb), coach = $('.coach', wb);
    const ed = makeEditor($('.editor-host', wb), r.code != null ? r.code : c.starter, 'Code editor for ' + c.title, () => runBtn.focus());
    const afterWrap = document.createElement('div');
    body.append(afterWrap);

    // hints
    const hintList = $('.hint-list', wb), hintBtn = $('.hint-btn', wb);
    const drawHints = () => {
      hintList.innerHTML = c.hints.slice(0, r.hints || 0).map((h, i) => '<div class="hint-item"><strong>Hint ' + (i + 1) + ':</strong> ' + h + '</div>').join('');
      const left = c.hints.length - (r.hints || 0);
      hintBtn.textContent = left ? 'Show hint ' + ((r.hints || 0) + 1) + ' of ' + c.hints.length : 'No more hints';
      hintBtn.disabled = !left;
    };
    hintBtn.addEventListener('click', () => { r.hints = (r.hints || 0) + 1; save(); drawHints(); });
    drawHints();

    // AI assistant
    const aiArea = $('.ai-area', wb);
    const drawAI = () => {
      if (r.assisted) {
        aiArea.innerHTML = '<p class="muted">You asked: “' + esc(r.stuck || '') + '”</p><p>Here\'s the assistant\'s solution. <strong>Read it before you use it</strong>. Can you predict what each line does? To finish, you\'ll answer questions about it and explain it.</p>';
        codeBlock(aiArea, c.solution, {});
        const lb = frag('<button type="button" class="btn ghost">Load into my editor (replaces my code)</button>');
        aiArea.append(lb);
        lb.addEventListener('click', () => { ed.set(c.solution); announce('Solution loaded into the editor.'); });
        return;
      }
      if (!(r.runs > 0)) {
        aiArea.innerHTML = '<p class="locked-note"><span aria-hidden="true">🔒</span> Unlocks after your first <strong>Run</strong>. Even a wrong attempt shows you what you don\'t know yet, which is what makes the AI\'s answer meaningful.</p>';
        return;
      }
      const tid = 'ask' + (++uid);
      aiArea.innerHTML = '<p>Using AI is allowed. Good use starts with a specific question.</p><div class="field"><label for="' + tid + '">What would you tell the assistant? Describe what you tried and where you\'re stuck.</label><textarea id="' + tid + '" style="min-height:80px"></textarea></div><button type="button" class="btn purple">Ask the AI</button><div class="fb" aria-live="polite"></div><p class="muted">Assisted completions are marked ◐ in your progress. That\'s honest record-keeping, not a penalty.</p>';
      $('button', aiArea).addEventListener('click', () => {
        const v = $('textarea', aiArea).value.trim();
        if (words(v) < 6) { $('.fb', aiArea).innerHTML = '<p class="no">Be specific: what did you try, and what happened? (at least 6 words) A vague prompt gets a vague answer.</p>'; return; }
        r.assisted = true; r.stuck = v; save();
        drawAI(); ctx.refreshNav(); announce('The AI assistant answered.');
      });
    };
    drawAI();

    $('.reset', wb).addEventListener('click', e => confirmInline(e.currentTarget, 'Replace your code with the starter code?', () => ed.set(c.starter)));
    let afterShown = false;
    const showAfter = () => {
      if (afterShown) return;
      afterShown = true;
      afterWrap.append(frag('<div class="success"><h2><span aria-hidden="true">✓</span> All checks pass</h2><p>Working code is the halfway point. Now show you understand it.</p></div>'));
      if (c.ways) afterWrap.append(waysBlock(c.ways, true));
      const toExplain = () => {
        explainBox(afterWrap, c, r, 'Step ' + (step + 1) + ' · Explain your code', () => {
          if (!r.assisted && c.solution) {
            const d = frag('<details><summary>Compare: how an AI assistant might have written it</summary><p class="muted">Neither version is automatically better. What\'s different? Which would be easier for a teammate to read?</p></details>');
            afterWrap.append(d);
            codeBlock(d, c.solution, {});
          }
          completeChallenge(ctx, r);
        });
      };
      if (r.assisted && c.solutionQuestions && c.solutionQuestions.length) {
        const s = frag('<section><h2>Check your understanding of the AI\'s code</h2><p class="muted">You used the assistant\'s solution, so show you can reason about it.</p><div class="qlist"></div></section>');
        afterWrap.append(s);
        runQuestions($('.qlist', s), c.solutionQuestions, { r, key: 'solDone', review: r.done }, toExplain);
      } else toExplain();
    };
    runBtn.addEventListener('click', async () => {
      const code = ed.get();
      r.code = code; r.runs = (r.runs || 0) + 1; save();
      runBtn.disabled = true; runBtn.textContent = 'Running…';
      const res = await runCode(code, c.tests);
      runBtn.disabled = false; runBtn.textContent = '▶ Run & review';
      renderOutput(out, res, c.tests);
      ed.markLine(errorLine(res));
      renderCoach(coach, analyzeCode(code, { required: requiredNames(c), expectReturn: c.expectReturn }));
      drawAI(); ctx.refreshNav();
      const pass = !res.syntax && !res.timeout && !res.error && res.results.every(x => x && x.pass);
      announce(pass ? 'All checks pass.' : 'Run finished. Some checks did not pass. See the output.');
      if (pass) { r.passed = true; save(); showAfter(); }
    });
    if (r.passed) showAfter();
  }
}

/* open-ended capstone: student defines the problem, builds, and explains */
function renderOpen(ctx) {
  const { c, body } = ctx;
  const r = rec(c.id);
  r.open = r.open || { problem: '', aiUse: '', explain: '', testing: '' };
  const o = r.open;
  body.append(frag('<div class="intro">' + c.intro + '</div>'));
  const p = 'op' + (++uid);
  const sec = frag('<div>' +
    '<h2>1 · Define the problem</h2><div class="field"><label for="' + p + 'prob">Who is it for? What goes in, what comes out, and what are the rules? (at least 15 words)</label><textarea id="' + p + 'prob"></textarea></div>' +
    '<h2>2 · Decide how you\'ll use AI</h2><fieldset><legend>How will AI help with this program?</legend>' +
      ['None: I\'ll write it all myself', 'Explanations and hints only', 'It generated parts, and I wrote the rest', 'It generated most of it, and I reviewed and tested it'].map((t, i) => '<label><input type="radio" name="' + p + 'ai" value="' + esc(t) + '"> ' + esc(t) + '</label>').join('') + '</fieldset>' +
    '<h2>3 · Build it</h2><div class="editor-label">Your program</div><div class="editor-host"></div>' +
    '<div class="runbar"><button type="button" class="btn run">▶ Run &amp; review</button></div><div class="out" hidden></div><div class="coach" hidden></div>' +
    '<h2>4 · Explain and justify it</h2><div class="field"><label for="' + p + 'exp">Explain how your code works, part by part, as if to a reviewer (at least 25 words)</label><textarea id="' + p + 'exp"></textarea></div>' +
    '<div class="field"><label for="' + p + 'test">How did you test it? List inputs you tried, what you expected, and what happened (at least 10 words)</label><textarea id="' + p + 'test"></textarea></div>' +
    '<button type="button" class="btn purple finish">Submit capstone</button><div class="fb" aria-live="polite"></div></div>');
  body.append(sec);
  const prob = $('#' + p + 'prob', sec), exp = $('#' + p + 'exp', sec), test = $('#' + p + 'test', sec);
  prob.value = o.problem; exp.value = o.explain; test.value = o.testing;
  $$('input[type=radio]', sec).forEach(rb => { rb.checked = rb.value === o.aiUse; rb.addEventListener('change', () => { o.aiUse = rb.value; save(); }); });
  [[prob, 'problem'], [exp, 'explain'], [test, 'testing']].forEach(([el, k]) => el.addEventListener('input', () => { o[k] = el.value; save(); }));
  const runBtn = $('.run', sec);
  const ed = makeEditor($('.editor-host', sec), r.code != null ? r.code : c.starter, 'Code editor for your capstone program', () => runBtn.focus());
  runBtn.addEventListener('click', async () => {
    const code = ed.get(); r.code = code; r.runs = (r.runs || 0) + 1;
    const res = await runCode(code, []);
    renderOutput($('.out', sec), res, null);
    ed.markLine(errorLine(res));
    renderCoach($('.coach', sec), analyzeCode(code, {}));
    r.cleanRun = !res.syntax && !res.timeout && !res.error && res.logs.length > 0;
    save(); ctx.refreshNav();
  });
  $('.finish', sec).addEventListener('click', () => {
    const missing = [];
    if (words(o.problem) < 15) missing.push('Describe the problem in at least 15 words.');
    if (!o.aiUse) missing.push('Choose how you used AI.');
    if (!r.cleanRun) missing.push('Run your program so it finishes without errors and prints at least one result.');
    if (words(o.explain) < 25) missing.push('Explain your code in at least 25 words.');
    if (words(o.testing) < 10) missing.push('Describe your testing in at least 10 words.');
    if (missing.length) { $('.fb', sec).innerHTML = '<p class="no"><strong>Not yet:</strong></p><ul>' + missing.map(m => '<li>' + m + '</li>').join('') + '</ul>'; return; }
    r.explanation = o.explain; r.assisted = /generated/i.test(o.aiUse);
    $('.fb', sec).innerHTML = '';
    completeChallenge(ctx, r);
  });
  if (r.done) completeChallenge(ctx, r);
}

/* ---------- page: workshop ---------- */
const WORKSHOP_START = '// Paste any JavaScript here: your own, or code an AI wrote for you.\n// Run it, read the coach\'s description, then practice explaining it.\n\nconst prices = [4.5, 12, 7.25];\nlet total = 0;\nfor (const p of prices) {\n  total = total + p;\n}\nconsole.log("Total: " + total);\n';
function renderWorkshop() {
  const w = store.workshop || (store.workshop = { code: WORKSHOP_START, notes: '' });
  main.innerHTML = '<h1>Workshop</h1><p class="lead">A free practice space. Paste code (yours or an AI\'s), run it, and the coach will describe what it does and suggest improvements. Nothing here affects your progress.</p>' +
    '<h2>Your code</h2><div class="editor-host"></div>' +
    '<div class="runbar"><button type="button" class="btn run">▶ Run &amp; review</button><button type="button" class="btn ghost reset">Clear</button></div><div class="out" hidden></div><div class="coach" hidden></div>' +
    '<div class="field"><label for="wsNotes">Practice explaining: what does this code do, and would you trust it? Why?</label><textarea id="wsNotes"></textarea></div>' +
    '<details><summary>A checklist for reviewing code you didn\'t write</summary><ol><li>What problem is it supposed to solve? Write the inputs, outputs and rules.</li><li>Predict the output for one normal input and one edge case <em>before</em> running.</li><li>Run it. Did your prediction match? If not, who was wrong: you or the code?</li><li>Is every name it calls actually defined? Are any inputs unused?</li><li>Does it change data it shouldn\'t (mutation)?</li><li>Could you explain each line to a classmate? If not, that\'s the line to study.</li></ol></details>';
  const runBtn = $('.run');
  const ed = makeEditor($('.editor-host'), w.code, 'Workshop code editor', () => runBtn.focus());
  const notes = $('#wsNotes');
  notes.value = w.notes || '';
  notes.addEventListener('input', () => { w.notes = notes.value; save(); });
  runBtn.addEventListener('click', async () => {
    const code = ed.get(); w.code = code; save();
    const res = await runCode(code, []);
    renderOutput($('.out'), res, null);
    ed.markLine(errorLine(res));
    renderCoach($('.coach'), analyzeCode(code, {}));
  });
  $('.reset').addEventListener('click', e => confirmInline(e.currentTarget, 'Clear the workshop editor?', () => { ed.set(''); w.code = ''; save(); }));
}

/* ---------- page: profile / report ---------- */
function stats() {
  const by = {};
  Object.keys(SKILLS).forEach(k => { by[k] = { total: 0, done: 0, independent: 0, assisted: 0, answered: 0, firstTry: 0 }; });
  let hints = 0, assists = 0, runs = 0;
  LEVELS.forEach(L => L.challenges.forEach(c => {
    const s = by[c.skill]; if (!s) return;
    s.total++;
    const r = peek(c.id); if (!r) return;
    hints += r.hints || 0; runs += r.runs || 0; if (r.assisted) assists++;
    s.answered += r.answered || 0; s.firstTry += r.firstTry || 0;
    if (r.done) { s.done++; if (r.assisted) s.assisted++; else s.independent++; }
  }));
  return { by, hints, assists, runs };
}

function buildReport() {
  const st = stats();
  const lines = ['# JS Reasoning Quest: Progress Report', '', '**Student:** ' + (store.name || '(name not entered)') + '  ', '**Generated:** ' + new Date().toLocaleString(), '',
    '## Summary by skill', '', '| Skill | Complete | Independent | With AI | First-try answers |', '|---|---|---|---|---|'];
  Object.keys(SKILLS).forEach(k => { const s = st.by[k]; lines.push('| ' + SKILLS[k].label + ' | ' + s.done + ' / ' + s.total + ' | ' + s.independent + ' | ' + s.assisted + ' | ' + s.firstTry + ' / ' + s.answered + ' |'); });
  lines.push('', 'Hints used: ' + st.hints + ' · AI assists: ' + st.assists + ' · Code runs: ' + st.runs, '', '## Journal');
  LEVELS.forEach((L, li) => L.challenges.forEach(c => {
    const r = peek(c.id);
    if (!r || !(r.explanation || r.code)) return;
    lines.push('', '### Level ' + li + ' · ' + c.title + ' (' + (VARIANT[c.type === 'quiz' ? c.variant : c.type]) + (r.done ? '' : ', in progress') + (r.assisted ? ', AI-assisted' : '') + ')');
    if (r.open) {
      lines.push('', '**Problem:** ' + r.open.problem, '', '**AI use:** ' + r.open.aiUse, '', '**Testing:** ' + r.open.testing);
    }
    if (r.stuck) lines.push('', '**Question asked of the AI:** ' + r.stuck);
    if (r.explanation) lines.push('', '**Explanation:**', '', r.explanation.split('\n').map(x => '> ' + x).join('\n'));
    if (r.code && (c.type === 'build' || c.type === 'open')) lines.push('', '```js', r.code.replace(/\s+$/, ''), '```');
  }));
  return lines.join('\n') + '\n';
}

function renderProfile() {
  const st = stats();
  main.innerHTML = '<h1>My Progress</h1><p class="lead">This is a record of how you reason, not how fast you are.</p>' +
    '<div class="field"><label for="profName">Your name (for the exported report)</label><input type="text" id="profName" autocomplete="name"></div>' +
    '<div class="table-wrap" role="region" aria-label="Progress by skill" tabindex="0"><table><caption class="sr-only">Progress by skill</caption><thead><tr><th scope="col">Skill</th><th scope="col">Complete</th><th scope="col">Independent</th><th scope="col">With AI</th><th scope="col">First-try answers</th></tr></thead><tbody>' +
    Object.keys(SKILLS).map(k => { const s = st.by[k]; return '<tr><th scope="row">' + SKILLS[k].icon + ' ' + SKILLS[k].label + '</th><td>' + s.done + ' / ' + s.total + '</td><td>' + s.independent + '</td><td>' + s.assisted + '</td><td>' + s.firstTry + ' / ' + s.answered + '</td></tr>'; }).join('') +
    '</tbody></table></div><p>Hints used: <strong>' + st.hints + '</strong> · AI assists: <strong>' + st.assists + '</strong> · Code runs: <strong>' + st.runs + '</strong></p>' +
    '<p class="muted">“First-try answers” counts questions you got right before any wrong guess. Wrong guesses aren\'t failures; each one came with an explanation.</p>' +
    '<div class="btn-row">' + (window.JSRQ_NO_DOWNLOAD ? '' : '<button type="button" class="btn" id="dl">Download report (.md)</button>') + '<button type="button" class="btn' + (window.JSRQ_NO_DOWNLOAD ? '' : ' ghost') + '" id="cp">Copy report</button><button type="button" class="btn ghost" id="rs">Reset all progress</button></div><div class="fb" id="pfb" aria-live="polite"></div>' +
    '<details><summary>Show the report text</summary><label for="reportText" class="sr-only">Report text</label><textarea id="reportText" class="report-text" readonly></textarea></details>' +
    '<h2>Journal</h2><div id="journal"></div>';
  const nm = $('#profName');
  nm.value = store.name || '';
  nm.addEventListener('input', () => { store.name = nm.value; save(); });
  const entries = [];
  LEVELS.forEach((L, li) => L.challenges.forEach((c, ci) => { const r = peek(c.id); if (r && r.explanation) entries.push({ L, li, c, ci, r }); }));
  $('#journal').innerHTML = entries.length ? entries.map(e => '<div class="journal-entry"><h3><a href="#c/' + e.L.id + '/' + e.ci + '">Level ' + e.li + ' · ' + esc(e.c.title) + '</a>' + (e.r.assisted ? ' <span class="chip">◐ AI-assisted</span>' : '') + '</h3><p>' + esc(e.r.explanation).replace(/\n/g, '<br>') + '</p></div>').join('')
    : '<p class="muted">Your explanations will collect here as you complete challenges.</p>';
  $('#reportText').value = buildReport();
  if ($('#dl')) $('#dl').addEventListener('click', () => {
    const blob = new Blob([buildReport()], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'js-reasoning-quest-' + (store.name || 'report').replace(/[^\w-]+/g, '_') + '.md';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#cp').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(buildReport()); $('#pfb').innerHTML = '<p class="ok">Report copied to the clipboard.</p>'; }
    catch (e) {
      const ta = $('#reportText'); ta.closest('details').open = true; ta.focus(); ta.select();
      $('#pfb').innerHTML = '<p class="no">Couldn\'t copy automatically. The report text is selected below. Press Ctrl+C (or ⌘C) to copy it.</p>';
    }
  });
  $('#rs').addEventListener('click', e => confirmInline(e.currentTarget, 'Erase all progress, code and explanations in this browser? This can\'t be undone.', () => {
    const name = store.name; store = fresh(); store.name = name; save(); renderProfile();
  }));
}

/* ---------- router ---------- */
function route() {
  const parts = (location.hash.replace(/^#/, '') || 'home').split('/');
  const page = parts[0];
  $$('[data-nav]').forEach(a => {
    const on = a.dataset.nav === page || (a.dataset.nav === 'levels' && (page === 'c' || page === 'level'));
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  let title = 'JS Reasoning Quest';
  if (page === 'c' || page === 'level') {
    const li = LEVELS.findIndex(L => L.id === parts[1]);
    if (li < 0) { renderLevels('That level doesn\'t exist.'); }
    else if (!levelUnlocked(li)) { renderLevels('Level ' + li + ' is locked. Finish Level ' + (li - 1) + ' first.'); }
    else if (page === 'level') {
      const first = LEVELS[li].challenges.findIndex(x => !isDone(x));
      location.replace('#c/' + LEVELS[li].id + '/' + Math.max(0, first));
      return;
    } else {
      const ci = parseInt(parts[2], 10) || 0;
      const c = LEVELS[li].challenges[ci];
      if (!c) { renderLevels('That challenge doesn\'t exist.'); }
      else { renderChallenge(li, ci); title = c.title + ' · Level ' + li + ' · ' + title; }
    }
  } else if (page === 'levels') { renderLevels(); title = 'Levels · ' + title; }
  else if (page === 'workshop') { renderWorkshop(); title = 'Workshop · ' + title; }
  else if (page === 'profile') { renderProfile(); title = 'My Progress · ' + title; }
  else renderHome();
  document.title = title;
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
if (!LEVELS.length) main.innerHTML = '<h1>Levels didn\'t load</h1><p>The file <code>js/js_reasoning_quest_levels.js</code> is missing. Keep it next to this page.</p>';
else route();

// Exposed for automated checks
window.JSRQ = { analyzeCode, runCode, diagnose };
})();
</script>
