<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Space Invaders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Courier New',monospace;color:#fff;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wrap{position:relative;display:flex;flex-direction:column;align-items:center}
canvas{display:block;image-rendering:pixelated;background:#000;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px #39ff6a}
#controls{display:none;width:100%;gap:10px;padding:10px 12px 6px;justify-content:space-between}
#controls button{flex:1;height:64px;border:2px solid #39ff6a;border-radius:12px;background:#0b1a0f;color:#39ff6a;font:bold 22px 'Courier New',monospace;touch-action:none}
#controls button.pressed{background:#39ff6a;color:#000}
#controls #fireBtn{flex:1.6;border-color:#ff4fd8;color:#ff4fd8;background:#1a0b17}
#controls #fireBtn.pressed{background:#ff4fd8;color:#000}
#topbar{display:flex;width:100%;justify-content:space-between;padding:4px 6px}
#topbar a,#topbar button{color:#8a8aa8;background:none;border:1px solid #333;border-radius:6px;padding:4px 10px;font:13px 'Courier New',monospace;text-decoration:none;cursor:pointer}
#topbar a:hover,#topbar button:hover{color:#fff;border-color:#888}
#rotate{display:none;position:fixed;inset:0;background:#000;color:#39ff6a;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:24px;z-index:10}
@media (pointer:coarse){#controls{display:flex}}
@media (pointer:coarse) and (orientation:landscape) and (max-height:520px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <a href="index.html">&larr; Hub</a>
    <span>
      <button id="muteBtn" type="button" aria-pressed="false">Sound: On</button>
      <button id="pauseBtn" type="button">Pause</button>
    </span>
  </div>
  <canvas id="game" tabindex="0" role="img" aria-label="Space Invaders game. Use left and right arrow keys to move, space to fire, P to pause."></canvas>
  <div id="controls">
    <button id="leftBtn" type="button" aria-label="Move left">&#9664;</button>
    <button id="fireBtn" type="button" aria-label="Fire">FIRE</button>
    <button id="rightBtn" type="button" aria-label="Move right">&#9654;</button>
  </div>
</div>
<div id="rotate">Turn your device to portrait to play Space Invaders</div>
<script>
// ══════════════════════════════════════════════════════════
// SPACE INVADERS — Atari-style, portrait orientation
// Marching invader rack, destructible shield walls,
// mystery saucer, and waves that get harder each round.
// ══════════════════════════════════════════════════════════

// ── CONSTANTS ──────────────────────────────────────────────
const W = 224, H = 304;          // logical playfield (portrait)
const TICK = 1000 / 60;          // fixed simulation step
const COLS = 6, ROWS = 6;        // Atari 2600 rack: 6 x 6
const COL_W = 18, ROW_H = 16;
const MARGIN = 6;                // side walls the rack bounces off
const PLAYER_Y = 268, GROUND_Y = 288;
const SHIELD_Y = 236;
const DROP = 8, STEP_X = 4;

// ── SPRITES ────────────────────────────────────────────────
const SPR = {
  squid: [[
    '...##...','..####..','.######.','##.##.##','########','..#..#..','.#.##.#.','#.#..#.#'
  ],[
    '...##...','..####..','.######.','##.##.##','########','.#.##.#.','#......#','.#....#.'
  ]],
  crab: [[
    '..#.....#..','...#...#...','..#######..','.##.###.##.','###########','#.#######.#','#.#.....#.#','...##.##...'
  ],[
    '..#.....#..','#..#...#..#','#.#######.#','###.###.###','###########','.#########.','..#.....#..','.#.......#.'
  ]],
  octo: [[
    '....####....','.##########.','############','###..##..###','############','...##..##...','..##.##.##..','##........##'
  ],[
    '....####....','.##########.','############','###..##..###','############','..###..###..','.##..##..##.','..##....##..'
  ]],
  player: [
    '......#......','.....###.....','.....###.....','.###########.','#############','#############','#############','#############'
  ],
  ufo: [
    '.....######.....','...##########...','..############..','.##.##.##.##.##.','################','..###..##..###..','...#........#...'
  ],
  boom: [
    '.#..#...#..#','..#..#.#..#.','...#.....#..','##.........##','...#.....#..','..#..#.#..#.','.#..#...#..#'
  ],
  playerBoom: [[
    '.....#.......','...#....#.#..','.#..##.#.....','..#####..#...','.#########.#.','#############'
  ],[
    '#.....#....#.','....#...#....','#..#.##...#..','..##.###.#...','.#########.##','#############'
  ]]
};
const SHIELD_SHAPE = [
  '....##############....',
  '...################...',
  '..##################..',
  '.####################.',
  '######################',
  '######################',
  '######################',
  '######################',
  '######################',
  '######################',
  '######################',
  '######################',
  '#######........#######',
  '######..........######',
  '#####............#####',
  '#####............#####'
];
const ROW_TYPES = ['squid', 'squid', 'crab', 'crab', 'octo', 'octo'];
const ROW_POINTS = [30, 30, 20, 20, 10, 10];
const ROW_COLORS = ['#ff4fd8', '#ff6fa8', '#4fd8ff', '#4f9dff', '#ffd84f', '#ffa34f'];
const UFO_POINTS = [50, 100, 150, 300];

// ── CANVAS / SCALING ───────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let RES = 3;

function resize() {
  const ctrl = document.getElementById('controls');
  const top = document.getElementById('topbar');
  const ctrlH = getComputedStyle(ctrl).display === 'none' ? 0 : ctrl.offsetHeight;
  const availW = window.innerWidth - 8;
  const availH = window.innerHeight - ctrlH - top.offsetHeight - 8;
  const scale = Math.max(0.5, Math.min(availW / W, availH / H));
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  document.getElementById('wrap').style.width = cssW + 'px';
  RES = Math.min(5, Math.max(2, Math.ceil(scale * (window.devicePixelRatio || 1))));
  canvas.width = W * RES;
  canvas.height = H * RES;
}
window.addEventListener('resize', resize);

// ── STORAGE ────────────────────────────────────────────────
function loadHi() {
  try { return parseInt(localStorage.getItem('si_hiscore') || '0', 10) || 0; } catch (e) { return 0; }
}
function saveHi(v) {
  try { localStorage.setItem('si_hiscore', String(v)); } catch (e) {}
}

// ── SOUND ──────────────────────────────────────────────────
let audio = null, muted = false;
function initAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null) {
  if (!audio || muted) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t + dur);
}
function noise(dur, vol = 0.12) {
  if (!audio || muted) return;
  const len = Math.floor(audio.sampleRate * dur);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audio.createBufferSource(), g = audio.createGain();
  src.buffer = buf;
  g.gain.value = vol;
  src.connect(g).connect(audio.destination);
  src.start();
}
const MARCH_NOTES = [98, 87, 78, 73];
const sfx = {
  march: n => tone(MARCH_NOTES[n % 4], 0.09, 'square', 0.1),
  shoot: () => tone(900, 0.12, 'square', 0.05, 200),
  alienHit: () => { noise(0.15, 0.1); tone(400, 0.12, 'sawtooth', 0.05, 80); },
  playerHit: () => { noise(0.6, 0.18); tone(200, 0.6, 'sawtooth', 0.06, 40); },
  ufo: () => tone(520, 0.08, 'triangle', 0.04, 680),
  ufoHit: () => { tone(300, 0.4, 'square', 0.06, 1200); },
  extraLife: () => { tone(660, 0.1, 'square', 0.06); setTimeout(() => tone(990, 0.15, 'square', 0.06), 110); }
};

// ── GAME STATE ─────────────────────────────────────────────
let state = 'title';        // title | playing | dying | waveclear | paused | gameover
let prevState = null;
let score = 0, hiScore = loadHi(), lives = 3, wave = 1;
let extraLifeGiven = false;
let shieldsOn = true;
let aliens = [], fx = 0, fy = 0, dir = 1, animFrame = 0, marchNote = 0;
let stepTimer = 0;
let player, pBullet, aBullets, explosions, shields, ufo;
let alienFireTimer = 0, ufoTimer = 0, stateTimer = 0, frameCount = 0;
let floatTexts = [];

function newPlayer() { return { x: W / 2 - 6.5, w: 13, h: 8 }; }

function buildShields() {
  shields = [];
  if (!shieldsOn) return;
  const n = 4, sw = SHIELD_SHAPE[0].length, sh = SHIELD_SHAPE.length;
  const gap = (W - n * sw) / (n + 1);
  for (let i = 0; i < n; i++) {
    const px = new Uint8Array(sw * sh);
    for (let y = 0; y < sh; y++)
      for (let x = 0; x < sw; x++)
        px[y * sw + x] = SHIELD_SHAPE[y][x] === '#' ? 1 : 0;
    shields.push({ x: Math.round(gap + i * (sw + gap)), y: SHIELD_Y, w: sw, h: sh, px });
  }
}

function buildRack() {
  aliens = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      aliens.push({ r, c, alive: true, type: ROW_TYPES[r], w: SPR[ROW_TYPES[r]][0][0].length });
  const rackW = COLS * COL_W;
  fx = Math.round((W - rackW) / 2);
  // Each wave the rack starts lower (capped so it stays fair)
  fy = 52 + Math.min(wave - 1, 7) * 8;
  dir = 1;
  animFrame = 0;
  stepTimer = 0;
}

function alienX(a) { return fx + a.c * COL_W + Math.floor((COL_W - a.w) / 2); }
function alienY(a) { return fy + a.r * ROW_H; }

function startWave() {
  buildRack();
  buildShields();
  player = newPlayer();
  pBullet = null;
  aBullets = [];
  explosions = [];
  floatTexts = [];
  ufo = null;
  ufoTimer = 900 + Math.random() * 600;
  alienFireTimer = 90;
}

function newGame() {
  score = 0; lives = 3; wave = 1; extraLifeGiven = false;
  startWave();
  state = 'playing';
}

// ── DIFFICULTY ─────────────────────────────────────────────
function aliveCount() { let n = 0; for (const a of aliens) if (a.alive) n++; return n; }
function stepInterval() {
  // Rack speeds up as invaders die, and every wave starts faster
  const total = COLS * ROWS, alive = aliveCount();
  const maxI = Math.max(140, 420 - (wave - 1) * 40);
  const minI = 16;
  return minI + (maxI - minI) * Math.pow((alive - 1) / (total - 1), 1.3);
}
function maxAlienBullets() { return Math.min(1 + wave, 6); }
function alienBulletSpeed() { return Math.min(1.5 + (wave - 1) * 0.2, 3.4); }
function nextFireDelay() {
  const f = Math.max(0.3, 1 - (wave - 1) * 0.1);
  return (35 + Math.random() * 55) * f;
}

// ── INPUT ──────────────────────────────────────────────────
const keys = { left: false, right: false, fire: false };
let firePressed = false; // edge-trigger so holding fire doesn't auto-repeat on start screens

function handleStartAction() {
  initAudio();
  if (state === 'title' || state === 'gameover') { newGame(); return true; }
  return false;
}

window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!e.repeat && handleStartAction()) return;
    keys.fire = true;
    if (!e.repeat) firePressed = true;
  }
  if (k === 'Enter' && !e.repeat) handleStartAction();
  if ((k === 'p' || k === 'P' || k === 'Escape') && !e.repeat) togglePause();
  if ((k === 'm' || k === 'M') && !e.repeat) toggleMute();
  if ((k === 's' || k === 'S') && !e.repeat && (state === 'title' || state === 'gameover')) shieldsOn = !shieldsOn;
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.fire = false;
});

function bindHold(id, key) {
  const el = document.getElementById(id);
  const down = e => {
    e.preventDefault();
    initAudio();
    if (key === 'fire' && handleStartAction()) return;
    keys[key] = true;
    if (key === 'fire') firePressed = true;
    el.classList.add('pressed');
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  };
  const up = e => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindHold('leftBtn', 'left');
bindHold('rightBtn', 'right');
bindHold('fireBtn', 'fire');

canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  // Tapping the WALLS line on the title / game-over screen toggles walls (touch-friendly)
  const rect = canvas.getBoundingClientRect();
  const ly = (e.clientY - rect.top) * H / rect.height;
  const wallsY = state === 'title' ? 196 : 176;
  if ((state === 'title' || state === 'gameover') && ly >= wallsY - 6 && ly <= wallsY + 20) {
    initAudio();
    shieldsOn = !shieldsOn;
    return;
  }
  if (handleStartAction()) return;
  if (state === 'paused') togglePause();
});

function togglePause() {
  if (state === 'paused') { state = prevState; }
  else if (state === 'playing' || state === 'dying' || state === 'waveclear') { prevState = state; state = 'paused'; }
  document.getElementById('pauseBtn').textContent = state === 'paused' ? 'Resume' : 'Pause';
}
function toggleMute() {
  muted = !muted;
  const b = document.getElementById('muteBtn');
  b.textContent = muted ? 'Sound: Off' : 'Sound: On';
  b.setAttribute('aria-pressed', String(muted));
}
document.getElementById('pauseBtn').addEventListener('click', e => { e.currentTarget.blur(); togglePause(); });
document.getElementById('muteBtn').addEventListener('click', e => { e.currentTarget.blur(); initAudio(); toggleMute(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state !== 'paused') togglePause(); });

// ── COLLISION HELPERS ──────────────────────────────────────
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Returns true (and chips the wall) if a bullet rect touched any shield pixel
function hitShield(bx, by, bw, bh, fromAbove) {
  for (const s of shields) {
    if (!overlap(bx, by, bw, bh, s.x, s.y, s.w, s.h)) continue;
    const x0 = Math.max(0, Math.floor(bx - s.x)), x1 = Math.min(s.w - 1, Math.floor(bx + bw - 1 - s.x));
    // Scan in the bullet's direction of travel so damage starts at the leading edge
    const ys = [];
    const y0 = Math.max(0, Math.floor(by - s.y)), y1 = Math.min(s.h - 1, Math.floor(by + bh - 1 - s.y));
    for (let y = y0; y <= y1; y++) ys.push(y);
    if (!fromAbove) ys.reverse();
    for (const y of ys)
      for (let x = x0; x <= x1; x++)
        if (s.px[y * s.w + x]) { blastShield(s, x, y, fromAbove); return true; }
  }
  return false;
}
function blastShield(s, cx, cy, fromAbove) {
  const rad = 3;
  for (let dy = -rad; dy <= rad; dy++)
    for (let dx = -rad; dx <= rad; dx++) {
      const d = Math.hypot(dx, dy);
      if (d > rad + 0.3) continue;
      if (d > 1.5 && Math.random() < 0.45) continue; // ragged edge like the original
      const x = cx + dx, y = cy + dy + (fromAbove ? 1 : -1);
      if (x >= 0 && x < s.w && y >= 0 && y < s.h) s.px[y * s.w + x] = 0;
    }
}
// Invaders marching through the walls erase them
function eraseShieldRect(x, y, w, h) {
  for (const s of shields) {
    if (!overlap(x, y, w, h, s.x, s.y, s.w, s.h)) continue;
    for (let yy = Math.max(0, y - s.y); yy < Math.min(s.h, y + h - s.y); yy++)
      for (let xx = Math.max(0, x - s.x); xx < Math.min(s.w, x + w - s.x); xx++)
        s.px[yy * s.w + xx] = 0;
  }
}

// ── UPDATE ─────────────────────────────────────────────────
function addScore(n) {
  score += n;
  if (score > hiScore) { hiScore = score; saveHi(hiScore); }
  if (!extraLifeGiven && score >= 1500) {
    extraLifeGiven = true;
    lives++;
    sfx.extraLife();
    floatTexts.push({ x: W / 2, y: PLAYER_Y - 20, text: 'EXTRA LIFE!', t: 90, color: '#39ff6a' });
  }
}

function stepRack() {
  let minX = Infinity, maxX = -Infinity;
  for (const a of aliens) {
    if (!a.alive) continue;
    const x = alienX(a);
    minX = Math.min(minX, x);
    maxX = Math.max(maxX, x + a.w);
  }
  const hitWall = (dir > 0 && maxX + STEP_X > W - MARGIN) || (dir < 0 && minX - STEP_X < MARGIN);
  if (hitWall) { fy += DROP; dir = -dir; }
  else fx += dir * STEP_X;
  animFrame ^= 1;
  sfx.march(marchNote++);
}

function alienFire() {
  if (aBullets.length >= maxAlienBullets()) return;
  // Only the lowest invader in a column can shoot
  const bottoms = {};
  for (const a of aliens) if (a.alive && (!bottoms[a.c] || a.r > bottoms[a.c].r)) bottoms[a.c] = a;
  const shooters = Object.values(bottoms);
  if (!shooters.length) return;
  let shooter;
  const aimChance = Math.min(0.25 + wave * 0.07, 0.7);
  if (Math.random() < aimChance) {
    // Aimed shot from the column closest to the player
    const pcx = player.x + player.w / 2;
    shooter = shooters.reduce((best, a) =>
      Math.abs(alienX(a) + a.w / 2 - pcx) < Math.abs(alienX(best) + best.w / 2 - pcx) ? a : best);
  } else {
    shooter = shooters[Math.floor(Math.random() * shooters.length)];
  }
  aBullets.push({
    x: alienX(shooter) + Math.floor(shooter.w / 2) - 1,
    y: alienY(shooter) + 8,
    w: 3, h: 7,
    vy: alienBulletSpeed(),
    kind: Math.random() < 0.5 ? 0 : 1
  });
}

function killPlayer() {
  state = 'dying';
  stateTimer = 110;
  sfx.playerHit();
  aBullets = [];
  pBullet = null;
}

function update() {
  frameCount++;
  for (const f of floatTexts) { f.t--; f.y -= 0.25; }
  floatTexts = floatTexts.filter(f => f.t > 0);
  for (const ex of explosions) ex.t--;
  explosions = explosions.filter(ex => ex.t > 0);

  if (state === 'dying') {
    if (--stateTimer <= 0) {
      lives--;
      if (lives <= 0) { state = 'gameover'; stateTimer = 0; }
      else { player = newPlayer(); state = 'playing'; alienFireTimer = 60; }
    }
    return;
  }
  if (state === 'waveclear') {
    if (--stateTimer <= 0) { wave++; startWave(); state = 'playing'; }
    return;
  }
  if (state !== 'playing') return;

  // Player movement — the side walls stop the cannon
  const speed = 1.4;
  if (keys.left) player.x -= speed;
  if (keys.right) player.x += speed;
  player.x = Math.max(MARGIN, Math.min(W - MARGIN - player.w, player.x));

  // Player fire (one shot on screen at a time, like the original)
  if ((keys.fire || firePressed) && !pBullet) {
    pBullet = { x: Math.round(player.x + 6), y: PLAYER_Y - 4, w: 1, h: 4 };
    sfx.shoot();
  }
  firePressed = false;

  // Rack march
  stepTimer += TICK;
  const interval = stepInterval();
  if (stepTimer >= interval) { stepTimer = 0; stepRack(); }

  // Invaders crush walls and check for invasion
  for (const a of aliens) {
    if (!a.alive) continue;
    const ax = alienX(a), ay = alienY(a);
    if (ay + 8 >= SHIELD_Y) eraseShieldRect(ax, ay, a.w, 8);
    if (ay + 8 >= PLAYER_Y) { lives = 1; killPlayer(); return; }
  }

  // Player bullet
  if (pBullet) {
    pBullet.y -= 5;
    let gone = pBullet.y < 22;
    if (!gone && hitShield(pBullet.x, pBullet.y, pBullet.w, pBullet.h, false)) gone = true;
    if (!gone) {
      for (const a of aliens) {
        if (!a.alive) continue;
        const ax = alienX(a), ay = alienY(a);
        if (overlap(pBullet.x, pBullet.y, pBullet.w, pBullet.h, ax, ay, a.w, 8)) {
          a.alive = false;
          addScore(ROW_POINTS[a.r]);
          explosions.push({ x: ax + a.w / 2 - 6, y: ay, t: 16, color: ROW_COLORS[a.r] });
          sfx.alienHit();
          gone = true;
          break;
        }
      }
    }
    if (!gone && ufo && overlap(pBullet.x, pBullet.y, pBullet.w, pBullet.h, ufo.x, ufo.y, 16, 7)) {
      const pts = UFO_POINTS[Math.floor(Math.random() * UFO_POINTS.length)];
      addScore(pts);
      floatTexts.push({ x: ufo.x + 8, y: ufo.y + 6, text: String(pts), t: 60, color: '#ff3b3b' });
      sfx.ufoHit();
      ufo = null;
      gone = true;
    }
    if (!gone) {
      for (let i = 0; i < aBullets.length; i++) {
        const b = aBullets[i];
        if (overlap(pBullet.x - 1, pBullet.y, 3, pBullet.h, b.x, b.y, b.w, b.h)) {
          aBullets.splice(i, 1);
          explosions.push({ x: pBullet.x - 6, y: pBullet.y - 2, t: 8, color: '#ffffff', small: true });
          gone = true;
          break;
        }
      }
    }
    if (gone) pBullet = null;
  }

  if (aliveCount() === 0) {
    state = 'waveclear';
    stateTimer = 150;
    aBullets = [];
    pBullet = null;
    ufo = null;
    return;
  }

  // Alien fire
  if (--alienFireTimer <= 0) { alienFire(); alienFireTimer = nextFireDelay(); }
  for (const b of aBullets) b.y += b.vy;
  for (let i = aBullets.length - 1; i >= 0; i--) {
    const b = aBullets[i];
    if (b.y > GROUND_Y - b.h) {
      aBullets.splice(i, 1);
      explosions.push({ x: b.x - 4, y: GROUND_Y - 7, t: 8, color: '#39ff6a', small: true });
      continue;
    }
    if (hitShield(b.x, b.y, b.w, b.h, true)) { aBullets.splice(i, 1); continue; }
    if (overlap(b.x, b.y, b.w, b.h, player.x + 1, PLAYER_Y + 1, player.w - 2, player.h - 1)) {
      killPlayer();
      return;
    }
  }

  // Mystery saucer
  if (ufo) {
    ufo.x += ufo.vx;
    if (frameCount % 12 === 0) sfx.ufo();
    if (ufo.x < -20 || ufo.x > W + 20) ufo = null;
  } else if (--ufoTimer <= 0 && aliveCount() > 6) {
    const fromLeft = Math.random() < 0.5;
    ufo = { x: fromLeft ? -16 : W, y: 28, vx: (fromLeft ? 1 : -1) * (0.7 + Math.min(wave, 6) * 0.08) };
    ufoTimer = 1200 + Math.random() * 900;
  }
}

// ── DRAW ───────────────────────────────────────────────────
function drawSprite(rows, x, y, color) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    let start = -1;
    for (let c = 0; c <= row.length; c++) {
      const on = row[c] === '#';
      if (on && start < 0) start = c;
      if (!on && start >= 0) { ctx.fillRect(x + start, y + r, c - start, 1); start = -1; }
    }
  }
}
function text(str, x, y, color = '#fff', size = 8, align = 'center') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
}

function drawHUD() {
  text('SCORE', 8, 4, '#aaa', 7, 'left');
  text(String(score).padStart(5, '0'), 8, 12, '#fff', 8, 'left');
  text('HI-SCORE', W / 2, 4, '#aaa', 7);
  text(String(hiScore).padStart(5, '0'), W / 2, 12, '#fff', 8);
  text('WAVE', W - 8, 4, '#aaa', 7, 'right');
  text(String(wave), W - 8, 12, '#fff', 8, 'right');

  ctx.fillStyle = '#39ff6a';
  ctx.fillRect(0, GROUND_Y, W, 1);
  text(String(Math.max(lives, 0)), 8, GROUND_Y + 4, '#fff', 8, 'left');
  for (let i = 0; i < Math.min(lives - 1, 6); i++) drawSprite(SPR.player, 22 + i * 16, GROUND_Y + 4, '#39ff6a');
  if (!shieldsOn) text('NO WALLS', W - 8, GROUND_Y + 5, '#666', 7, 'right');
}

function drawPlayfield() {
  // Shields
  for (const s of shields) {
    ctx.fillStyle = '#39ff6a';
    for (let y = 0; y < s.h; y++) {
      let start = -1;
      for (let x = 0; x <= s.w; x++) {
        const on = x < s.w && s.px[y * s.w + x];
        if (on && start < 0) start = x;
        if (!on && start >= 0) { ctx.fillRect(s.x + start, s.y + y, x - start, 1); start = -1; }
      }
    }
  }
  // Invaders
  for (const a of aliens) if (a.alive) drawSprite(SPR[a.type][animFrame], alienX(a), alienY(a), ROW_COLORS[a.r]);
  // Saucer
  if (ufo) drawSprite(SPR.ufo, ufo.x, ufo.y, '#ff3b3b');
  // Explosions
  for (const ex of explosions) {
    if (ex.small) {
      ctx.fillStyle = ex.color;
      for (let i = 0; i < 6; i++) ctx.fillRect(Math.round(ex.x + 4 + Math.cos(i) * 3 * (i % 2 + 1)), Math.round(ex.y + 3 + Math.sin(i) * 3), 1, 1);
    } else drawSprite(SPR.boom, ex.x, ex.y, ex.color);
  }
  // Player
  if (state === 'dying') drawSprite(SPR.playerBoom[Math.floor(stateTimer / 6) % 2], player.x, PLAYER_Y + 2, '#39ff6a');
  else if (state !== 'gameover') drawSprite(SPR.player, player.x, PLAYER_Y, '#39ff6a');
  // Bullets
  ctx.fillStyle = '#fff';
  if (pBullet) ctx.fillRect(pBullet.x, Math.round(pBullet.y), pBullet.w, pBullet.h);
  for (const b of aBullets) {
    const y = Math.round(b.y), wig = Math.floor(frameCount / 4) % 2;
    ctx.fillStyle = '#fff';
    if (b.kind === 0) { // zig-zag
      for (let i = 0; i < b.h; i++) ctx.fillRect(b.x + ((i + wig) % 2 ? 0 : 2), y + i, 1, 1);
      ctx.fillRect(b.x + 1, y, 1, b.h);
    } else { // plunger
      ctx.fillRect(b.x + 1, y, 1, b.h);
      ctx.fillRect(b.x, y + (wig ? 1 : b.h - 2), 3, 1);
    }
  }
  for (const f of floatTexts) text(f.text, f.x, f.y, f.color, 7);
}

function drawTitle() {
  text('SPACE', W / 2, 40, '#ff4fd8', 22);
  text('INVADERS', W / 2, 64, '#4fd8ff', 22);
  text('*SCORE ADVANCE TABLE*', W / 2, 108, '#aaa', 7);
  const rows = [
    [SPR.ufo, '#ff3b3b', '= ? MYSTERY'],
    [SPR.squid[frameCount >> 5 & 1], ROW_COLORS[0], '= 30 POINTS'],
    [SPR.crab[frameCount >> 5 & 1], ROW_COLORS[2], '= 20 POINTS'],
    [SPR.octo[frameCount >> 5 & 1], ROW_COLORS[4], '= 10 POINTS']
  ];
  rows.forEach(([spr, col, label], i) => {
    const y = 124 + i * 16;
    drawSprite(spr, 66 - spr[0].length / 2, y, col);
    text(label, 84, y, '#fff', 8, 'left');
  });
  text('WALLS: ' + (shieldsOn ? 'ON' : 'OFF'), W / 2, 196, shieldsOn ? '#39ff6a' : '#888', 9);
  text(isTouch ? '(tap to toggle)' : '(press S to toggle)', W / 2, 208, '#666', 7);
  if ((frameCount >> 5) % 2 === 0) text(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 228, '#ffd84f', 9);
  text(isTouch ? 'USE BUTTONS BELOW' : '← → MOVE   SPACE FIRE', W / 2, 248, '#888', 7);
  text(isTouch ? '' : 'P PAUSE   M SOUND', W / 2, 258, '#888', 7);
}

function render() {
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') { drawTitle(); drawHUD(); return; }

  drawPlayfield();
  drawHUD();

  if (state === 'waveclear') {
    text('WAVE ' + wave + ' CLEARED!', W / 2, 120, '#39ff6a', 11);
    text('GET READY FOR WAVE ' + (wave + 1), W / 2, 140, '#fff', 8);
  } else if (state === 'playing' && frameCount < 120 && wave === 1 && score === 0) {
    text('DEFEND EARTH!', W / 2, 200, '#ffd84f', 9);
  }
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, 130, '#fff', 14);
    text(isTouch ? 'TAP TO RESUME' : 'PRESS P TO RESUME', W / 2, 152, '#aaa', 8);
  }
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, 110, '#ff3b3b', 18);
    text('SCORE ' + score, W / 2, 138, '#fff', 9);
    if (score > 0 && score >= hiScore) text('NEW HIGH SCORE!', W / 2, 152, '#ffd84f', 8);
    text('WALLS: ' + (shieldsOn ? 'ON' : 'OFF') + (isTouch ? '  (TAP)' : '  (S)'), W / 2, 176, '#888', 7);
    if ((frameCount >> 5) % 2 === 0) text(isTouch ? 'TAP TO PLAY AGAIN' : 'PRESS SPACE TO PLAY AGAIN', W / 2, 196, '#ffd84f', 8);
  }
}

// ── MAIN LOOP ──────────────────────────────────────────────
const isTouch = window.matchMedia('(pointer: coarse)').matches;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= TICK) {
    if (state === 'title' || state === 'gameover' || state === 'paused') frameCount++;
    else update();
    acc -= TICK;
  }
  render();
  requestAnimationFrame(loop);
}

resize();
startWave();
state = 'title';
canvas.focus();
requestAnimationFrame(loop);
</script>
</body>
