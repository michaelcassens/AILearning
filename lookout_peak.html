<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lookout Peak</title>
<meta name="description" content="A climbing arcade game inspired by early-80s ladder-and-girder classics. Ranger Rae scales a Montana mountain to rescue Scout the pup from Ol' Bramble the grizzly. Keyboard, gamepad or touch.">
<meta name="theme-color" content="#0f1428">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#0f1428; --panel:#1b2340; --ink:#f4efe2; --muted:#b9c0d8; --accent:#ffd23f;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--panel);font-family:var(--pixel);font-size:10px}
header a{color:var(--muted);text-decoration:none;padding:8px 4px}
header a:focus-visible,header button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header h1{font-size:12px;margin:0;color:var(--accent);letter-spacing:1px}
header .btns{display:flex;gap:6px}
header button{font-family:var(--pixel);font-size:11px;min-width:40px;height:34px;border-radius:8px;border:2px solid #3b4670;background:#26305a;color:var(--ink);cursor:pointer}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px;box-shadow:0 0 0 3px #26305a,0 10px 30px rgba(0,0,0,.6);touch-action:none}
#help{font-family:var(--pixel);font-size:9px;color:var(--muted);text-align:center;padding:4px 8px 8px;line-height:1.7}
#pad{display:none;justify-content:space-between;align-items:center;padding:6px 18px 14px;gap:12px}
body.touch #pad{display:flex}
body.touch #help{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button,.jump{font-family:var(--pixel);color:var(--ink);background:#26305a;border:2px solid #3b4670;border-radius:10px;font-size:16px;touch-action:none}
.dpad button.on,.jump.on{background:#3d4a86}
.d-up{grid-column:2;grid-row:1}.d-left{grid-column:1;grid-row:2}.d-right{grid-column:3;grid-row:2}.d-down{grid-column:2;grid-row:3}
.jump{width:96px;height:96px;border-radius:50%;background:#b8452c;border-color:#ffb38a;font-size:12px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="index.html" aria-label="Back to the AILearning home page">&larr; HOME</a>
    <h1>LOOKOUT PEAK</h1>
    <div class="btns">
      <button id="bPause" aria-label="Pause or resume">II</button>
      <button id="bMute" aria-label="Toggle sound">SND</button>
    </div>
  </header>
  <div id="stage"><canvas id="game" width="320" height="360" role="img" aria-label="Lookout Peak game screen. Use arrow keys to move and climb, space to jump."></canvas></div>
  <div id="help">ARROWS/WASD move &amp; climb &middot; SPACE/Z jump &middot; P pause &middot; M sound &middot; ENTER start</div>
  <div id="pad" aria-label="Touch controls">
    <div class="dpad">
      <button class="d-up" data-k="up" aria-label="Climb up">&#9650;</button>
      <button class="d-left" data-k="left" aria-label="Move left">&#9664;</button>
      <button class="d-right" data-k="right" aria-label="Move right">&#9654;</button>
      <button class="d-down" data-k="down" aria-label="Climb down">&#9660;</button>
    </div>
    <button class="jump" data-k="jump" aria-label="Jump">JUMP</button>
  </div>
</div>
<script>
'use strict';
/* ================================================================
   LOOKOUT PEAK
   An original climbing arcade game. Ranger Rae climbs three stages
   (Switchback Ridge, Mine Lifts, Fire Lookout) to rescue Scout the
   pup from Ol' Bramble the grizzly. Logical resolution 320x360.
   ================================================================ */
const W = 320, H = 360;
const G = 520, WALK = 58, CLIMB = 42, JUMPV = 160, FALLMAX = 34;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '8px "Press Start 2P", monospace';

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const r = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function P(x1, y1, x2, y2, o = {}) { return Object.assign({ x1, y1, x2, y2, py1: y1, py2: y2 }, o); }
function seg(x1, y1, x2, y2, a, b) { const f = x => y1 + (y2 - y1) * (x - x1) / (x2 - x1); return P(a, f(a), b, f(b)); }
function surf(p, x) { return p.x2 === p.x1 ? p.y1 : p.y1 + (p.y2 - p.y1) * (x - p.x1) / (p.x2 - p.x1); }
function prevSurf(p, x) { return p.x2 === p.x1 ? p.py1 : p.py1 + (p.py2 - p.py1) * (x - p.x1) / (p.x2 - p.x1); }
function slopeDir(p) { return p.y2 > p.y1 + 0.5 ? 1 : p.y2 < p.y1 - 0.5 ? -1 : 0; }

/* ---------- persistence ---------- */
let hiScore = 0;
try { hiScore = +localStorage.getItem('lookoutPeakHi') || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('lookoutPeakHi', hiScore); } catch (e) {} }

/* ---------- sound ---------- */
let actx = null, muted = false;
try { muted = localStorage.getItem('lookoutPeakMute') === '1'; } catch (e) {}
function tone(f, d, type = 'square', vol = 0.04, slide = 0, delay = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  step: () => tone(180, 0.03, 'triangle', 0.03),
  jump: () => tone(300, 0.18, 'square', 0.04, 400),
  land: () => tone(120, 0.05, 'triangle', 0.04),
  score: () => { tone(880, 0.06); tone(1320, 0.08, 'square', 0.04, 0, 0.06); },
  chop: () => tone(90, 0.12, 'sawtooth', 0.06, -40),
  pick: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.08, 'square', 0.04, 0, i * 0.06)),
  die: () => [600, 500, 400, 300, 200].forEach((f, i) => tone(f, 0.14, 'square', 0.05, -60, i * 0.13)),
  clear: () => [392, 494, 587, 784, 587, 784].forEach((f, i) => tone(f, 0.14, 'square', 0.04, 0, i * 0.12)),
  throw: () => tone(70, 0.2, 'sawtooth', 0.05, 30),
  lantern: () => { tone(660, 0.1, 'triangle', 0.05); tone(990, 0.15, 'triangle', 0.05, 0, 0.08); },
  boing: () => tone(220, 0.08, 'triangle', 0.03, 120),
};

/* ---------- input ---------- */
const inp = { left: false, right: false, up: false, down: false, jump: false };
let jumpPressed = false, startPressed = false;
const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'jump', KeyZ: 'jump', KeyX: 'jump' };
addEventListener('keydown', e => {
  const k = keyMap[e.code];
  if (k) { e.preventDefault(); if (k === 'jump' && !e.repeat) { jumpPressed = true; startPressed = true; } inp[k] = true; }
  if (e.code === 'Enter' && !e.repeat) startPressed = true;
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) inp[k] = false; });
addEventListener('blur', () => { for (const k in inp) inp[k] = false; if (mode === 'play') paused = true; });

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
document.querySelectorAll('#pad [data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); inp[k] = true; b.classList.add('on'); if (k === 'jump') { jumpPressed = true; startPressed = true; } };
  const off = e => { e.preventDefault(); inp[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
cv.addEventListener('pointerdown', () => { startPressed = true; });

let padPrev = {};
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = pads && [...pads].find(p => p);
  if (!gp) return;
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const cur = { left: b(14) || ax < -0.5, right: b(15) || ax > 0.5, up: b(12) || ay < -0.5, down: b(13) || ay > 0.5, jump: b(0) || b(1), start: b(9) };
  for (const k of ['left', 'right', 'up', 'down']) if (cur[k] !== padPrev[k]) inp[k] = cur[k];
  if (cur.jump && !padPrev.jump) { jumpPressed = true; startPressed = true; }
  if (cur.jump !== padPrev.jump) inp.jump = cur.jump;
  if (cur.start && !padPrev.start) { if (mode === 'play') togglePause(); else startPressed = true; }
  padPrev = cur;
}

/* ---------- UI buttons ---------- */
const bMute = document.getElementById('bMute'), bPause = document.getElementById('bPause');
function toggleMute() { muted = !muted; bMute.textContent = muted ? 'OFF' : 'SND'; try { localStorage.setItem('lookoutPeakMute', muted ? '1' : '0'); } catch (e) {} }
bMute.textContent = muted ? 'OFF' : 'SND';
bMute.onclick = () => { toggleMute(); bMute.blur(); };
bPause.onclick = () => { togglePause(); bPause.blur(); };
let paused = false;
function togglePause() { if (mode === 'play' || mode === 'intro') paused = !paused; }

/* ---------- canvas fit ---------- */
function fit() {
  const st = document.getElementById('stage');
  const aw = st.clientWidth - 12, ah = st.clientHeight - 12;
  const s = Math.max(0.5, Math.min(aw / W, ah / H));
  const sc = s >= 1 ? Math.floor(s * 2) / 2 : s;
  cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('resize', fit);

/* ================================================================
   STAGES
   Each builder returns platforms, ladders and per-stage features.
   Ladder spec: [x, upperPlatIndex, lowerPlatIndex]
   ================================================================ */
const PALETTES = {
  ridge: { sky: ['#0b1030', '#2a1f4f', '#5a3150'], mtn: '#1a1838', mtn2: '#2a2550', beam: '#9a5b2c', hi: '#d39054', dk: '#5c3416', lad: '#e0c080' },
  lifts: { sky: ['#06121a', '#0f2a33', '#1d3f3a'], mtn: '#0d1e22', mtn2: '#163038', beam: '#7c8a96', hi: '#c6d2dc', dk: '#3d464f', lad: '#e8b84a' },
  tower: { sky: ['#130b1e', '#3a1832', '#a3462e'], mtn: '#24122a', mtn2: '#3c1c33', beam: '#b0672e', hi: '#f0a868', dk: '#64361a', lad: '#9ee0ff' },
};

function buildRidge() {
  const plats = [
    P(0, 344, 320, 338),                       // 0 ground (slopes down-left)
    P(16, 292, 288, 304),                      // 1
    P(32, 254, 304, 242),                      // 2
    seg(16, 190, 288, 202, 16, 136),           // 3 left of washout
    seg(16, 190, 288, 202, 160, 288),          // 4 right of washout
    P(32, 152, 304, 140),                      // 5
    P(16, 92, 256, 96),                        // 6 Bramble's ledge
    P(120, 56, 200, 56, { goal: true }),       // 7 Scout's perch
  ];
  return {
    key: 'ridge', name: 'SWITCHBACK RIDGE', tip: 'JUMP THE LOGS. GRAB A PULASKI TO CHOP THEM!',
    plats,
    ladders: [[250, 1, 0], [100, 1, 0], [70, 2, 1], [190, 2, 1], [110, 3, 2], [270, 4, 2], [60, 5, 3], [210, 5, 4], [100, 6, 5], [236, 6, 5], [186, 7, 6, true]],
    start: { x: 80, plat: 0 }, bear: { x: 44, plat: 6 }, pup: { x: 146, plat: 7 },
    fire: { x: 12, plat: 0 }, goalPlat: 7,
    pulaskis: [[250, 2], [150, 5]],
    items: [['hat', 40, 3], ['pack', 286, 1], ['thermos', 200, 6]],
    elevators: [],
  };
}

function buildLifts() {
  const plats = [
    P(0, 344, 64, 344),        // 0 start
    P(0, 280, 60, 280),        // 1
    P(0, 210, 60, 210),        // 2
    P(0, 140, 56, 140),        // 3
    P(112, 300, 208, 300),     // 4
    P(112, 220, 208, 220),     // 5
    P(112, 140, 208, 140),     // 6
    P(112, 84, 208, 84),       // 7 Bramble's ledge
    P(260, 270, 320, 270),     // 8
    P(260, 190, 320, 190),     // 9
    P(264, 100, 320, 100, { goal: true }), // 10 Scout
  ];
  return {
    key: 'lifts', name: 'MINE LIFTS', tip: 'RIDE THE LIFTS. DODGE THE BOUNCING BOULDERS!',
    plats,
    ladders: [[30, 1, 0], [20, 2, 1], [44, 3, 2], [190, 5, 4], [130, 6, 5], [300, 9, 8], [276, 10, 9, true]],
    start: { x: 30, plat: 0 }, bear: { x: 160, plat: 7 }, pup: { x: 300, plat: 10 },
    fire: null, goalPlat: 10, pulaskis: [],
    items: [['hat', 20, 3], ['pack', 160, 4], ['thermos', 290, 8]],
    elevators: [{ x1: 72, x2: 102, dir: -1 }, { x1: 218, x2: 248, dir: 1 }],
  };
}

function buildTower() {
  const plats = [
    P(8, 344, 312, 344),       // 0
    P(24, 288, 296, 288),      // 1
    P(24, 232, 296, 232),      // 2
    P(24, 176, 296, 176),      // 3
    P(40, 120, 280, 120),      // 4 Bramble paces here
    P(136, 62, 184, 62),       // 5 Scout's crate (unreachable)
  ];
  return {
    key: 'tower', name: 'FIRE LOOKOUT', tip: 'LIGHT ALL 8 LANTERNS TO SCARE OFF OL\' BRAMBLE!',
    plats,
    ladders: [[60, 1, 0], [160, 1, 0], [260, 1, 0], [100, 2, 1], [220, 2, 1], [60, 3, 2], [160, 3, 2], [260, 3, 2], [100, 4, 3], [220, 4, 3]],
    start: { x: 30, plat: 0 }, bear: { x: 160, plat: 4 }, pup: { x: 160, plat: 5 },
    fire: null, goalPlat: -1,
    pulaskis: [[200, 1], [120, 3]],
    items: [['hat', 290, 0], ['pack', 130, 2], ['thermos', 190, 3]],
    lanterns: [[36, 1], [284, 1], [36, 2], [284, 2], [36, 3], [284, 3], [52, 4], [268, 4]],
    elevators: [],
  };
}
const STAGE_BUILDERS = [buildRidge, buildLifts, buildTower];
const ELEVATIONS = [5200, 6900, 8600];

/* ================================================================
   GAME STATE
   ================================================================ */
let mode = 'title';            // title | intro | play | dying | clear | over | win
let modeT = 0;
let score = 0, lives = 3, loop = 1, stageIdx = 0, bonus = 5000, bonusT = 0, extraGiven = false;
let S = null;                  // current stage data
let plats = [], ladders = [], hazards = [], embers = [], pops = [], particles = [];
let player = null, bear = null, nextId = 1, litCount = 0;
let bgCache = {};

function newGame() { score = 0; lives = 3; loop = 1; stageIdx = 0; extraGiven = false; loadStage(true); }

function loadStage(fresh) {
  const keepLanterns = !fresh && S && S.key === 'tower' ? S.lanterns : null;
  S = STAGE_BUILDERS[stageIdx]();
  plats = S.plats;
  ladders = S.ladders.map(([x, t, b, goal]) => ({ x, tp: plats[t], bp: plats[b], top: surf(plats[t], x), bot: surf(plats[b], x), goal: !!goal }));
  // elevators: three small platforms per column cycling between y=120 and y=346
  S.elev = [];
  for (const col of S.elevators) {
    for (let i = 0; i < 3; i++) {
      const y = 120 + i * 75.3;
      const e = P(col.x1, y, col.x2, y, { elev: true, dir: col.dir });
      plats.push(e); S.elev.push(e);
    }
  }
  if (S.lanterns) S.lanterns = (keepLanterns || S.lanterns.map(([x, pi]) => ({ x, y: surf(plats[pi], x), lit: false })));
  litCount = S.lanterns ? S.lanterns.filter(l => l.lit).length : 0;
  S.pulaskis = S.pulaskis.map(([x, pi]) => ({ x, y: surf(plats[pi], x) - 22, taken: false }));
  S.items = S.items.map(([kind, x, pi]) => ({ kind, x, y: surf(plats[pi], x), taken: false, pts: { hat: 300, pack: 500, thermos: 800 }[kind] }));
  const sp = plats[S.start.plat];
  player = { x: S.start.x, y: surf(sp, S.start.x), plat: sp, state: 'walk', face: 1, vx: 0, vy: 0, peak: 0, anim: 0, stepT: 0, ladder: null, pulaski: 0, jumped: new Set(), deadT: 0 };
  const bp = plats[S.bear.plat];
  bear = { x: S.bear.x, y: surf(bp, S.bear.x), plat: bp, t: 1.5, pose: 'idle', poseT: 0, throws: 0, dir: 1 };
  hazards = []; embers = []; pops = []; particles = [];
  bonus = 4000 + 1000 * Math.min(loop, 4); bonusT = 0;
  if (S.key === 'lifts') {               // a couple of embers patrol the middle walkways
    spawnEmber(140, plats[4], 1); spawnEmber(180, plats[5], -1);
  }
  mode = 'intro'; modeT = 2.4;
}

const diff = () => Math.min(loop - 1, 6);

function spawnEmber(x, plat, dir) {
  embers.push({ id: nextId++, x, y: surf(plat, x), plat, dir: dir || 1, state: 'walk', l: null, vy: 0, cool: 0.6, t: Math.random() * 6, spd: 24 + diff() * 4 + rnd(0, 6) });
}
function spawnLog() {
  hazards.push({ id: nextId++, type: 'log', x: bear.x + 22, y: surf(bear.plat, bear.x + 22), plat: bear.plat, state: 'roll', dir: 1, spd: 56 + diff() * 7, rot: 0, vx: 0, vy: 0, lastL: null });
}
function spawnBoulder(x, y, vx, bounce) {
  hazards.push({ id: nextId++, type: 'boulder', x, y, vx, vy: -60, bounce, rot: 0 });
}
function addPop(x, y, text, color = '#fff') { pops.push({ x, y, text: String(text), t: 1.1, color }); }
function addScore(n, x, y) {
  score += n;
  if (x !== undefined) addPop(x, y, n);
  if (!extraGiven && score >= 10000) { extraGiven = true; lives++; addPop(W / 2, 40, '1UP!', '#7fff7f'); sfx.pick(); }
  if (score > hiScore) { hiScore = score; }
}
function burst(x, y, colors, n = 10) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: rnd(-60, 60), vy: rnd(-90, -10), t: rnd(0.4, 0.8), c: colors[i % colors.length] });
}

/* ================================================================
   UPDATE
   ================================================================ */
function update(dt) {
  pollPad();
  if (mode === 'title' || mode === 'over') {
    modeT += dt;
    if (startPressed && modeT > 0.6) { startPressed = false; newGame(); }
    startPressed = false; jumpPressed = false;
    return;
  }
  if (paused) { jumpPressed = false; startPressed = false; return; }
  startPressed = false;

  if (mode === 'intro') { modeT -= dt; if (modeT <= 0) mode = 'play'; jumpPressed = false; return; }
  if (mode === 'dying') {
    modeT -= dt; player.deadT += dt;
    if (modeT <= 0) {
      lives--;
      if (lives < 0) { mode = 'over'; modeT = 0; saveHi(); }
      else loadStage(false);
    }
    return;
  }
  if (mode === 'clear') {
    modeT -= dt; updateParticles(dt);
    if (bear.flee) { bear.y -= 70 * dt; }
    if (modeT <= 0) {
      stageIdx++;
      if (stageIdx >= STAGE_BUILDERS.length) { stageIdx = 0; loop++; }
      loadStage(true);
    }
    return;
  }

  // ---- play ----
  bonusT += dt;
  if (bonusT >= 2) { bonusT -= 2; bonus = Math.max(0, bonus - 100); if (bonus === 0) { killPlayer(); return; } }

  updateElevators(dt);
  updatePlayer(dt);
  if (mode !== 'play') return;
  updateBear(dt);
  for (const h of hazards) updateHazard(h, dt);
  hazards = hazards.filter(h => !h.dead);
  for (const e of embers) updateEmber(e, dt);
  embers = embers.filter(e => !e.dead);
  updateParticles(dt);
  checkCollisions();
  jumpPressed = false;
}

function updateParticles(dt) {
  for (const p of pops) { p.t -= dt; p.y -= 14 * dt; }
  pops = pops.filter(p => p.t > 0);
  for (const p of particles) { p.t -= dt; p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.t > 0);
}

function updateElevators(dt) {
  const spd = 22 + diff() * 3;
  for (const e of S.elev) {
    e.py1 = e.y1; e.py2 = e.y2;
    let y = e.y1 + e.dir * spd * dt;
    let wrapped = false;
    if (e.dir < 0 && y < 120) { y += 226; wrapped = true; }
    if (e.dir > 0 && y > 346) { y -= 226; wrapped = true; }
    if (wrapped) {
      if (player.plat === e) { player.state = 'fall'; player.plat = null; player.vy = 0; player.vx = 0; player.peak = player.y; }
      e.py1 = e.py2 = y;
    }
    e.y1 = e.y2 = y;
  }
}

function startClimb(l, down) {
  const p = player;
  p.state = 'climb'; p.ladder = l; p.x = l.x; p.plat = null;
  p.y = down ? l.top + 1 : l.bot - 1;
}

function updatePlayer(dt) {
  const p = player;
  if (p.pulaski > 0) {
    p.pulaski -= dt;
    p.anim += dt;
    if (Math.floor(p.anim * 8) !== Math.floor((p.anim - dt) * 8)) tone(Math.floor(p.anim * 8) % 2 ? 523 : 392, 0.06, 'square', 0.025);
  }
  const mv = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);

  if (p.state === 'walk') {
    if (mv) {
      p.face = mv; p.x += mv * WALK * dt; p.anim += dt;
      p.stepT -= dt; if (p.stepT <= 0) { p.stepT = 0.16; sfx.step(); }
    }
    p.x = clamp(p.x, 4, W - 4);
    if (p.pulaski <= 0) {
      if (inp.up) { const l = ladders.find(l => Math.abs(l.x - p.x) < 5 && Math.abs(l.bot - p.y) < 4); if (l) { startClimb(l, false); return; } }
      if (inp.down) { const l = ladders.find(l => Math.abs(l.x - p.x) < 5 && Math.abs(l.top - p.y) < 4); if (l) { startClimb(l, true); return; } }
    }
    const pl = p.plat;
    if (p.x < pl.x1 || p.x > pl.x2) {
      const n = plats.find(q => q !== pl && p.x >= q.x1 && p.x <= q.x2 && Math.abs(surf(q, p.x) - p.y) <= 4);
      if (n) p.plat = n;
      else { p.state = 'fall'; p.vx = mv * WALK; p.vy = 0; p.peak = p.y; p.plat = null; return; }
    }
    p.y = surf(p.plat, p.x);
    if (jumpPressed && p.pulaski <= 0) {
      p.state = 'jump'; p.vy = -JUMPV; p.vx = mv * WALK; p.peak = p.y; p.plat = null; p.jumped = new Set(); sfx.jump();
    }
  } else if (p.state === 'climb') {
    const l = p.ladder;
    const cm = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
    if (cm) { p.y += cm * CLIMB * dt; p.anim += dt; p.stepT -= dt; if (p.stepT <= 0) { p.stepT = 0.2; sfx.step(); } }
    if (p.y <= l.top) { p.y = l.top; p.state = 'walk'; p.plat = l.tp; }
    else if (p.y >= l.bot) { p.y = l.bot; p.state = 'walk'; p.plat = l.bp; }
  } else if (p.state === 'jump' || p.state === 'fall') {
    const prevY = p.y;
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < 4 || p.x > W - 4) { p.x = clamp(p.x, 4, W - 4); p.vx = -p.vx * 0.5; }
    p.peak = Math.min(p.peak, p.y);
    if (p.vy > 0) {
      for (const q of plats) {
        if (p.x < q.x1 || p.x > q.x2) continue;
        const s = surf(q, p.x), ps = prevSurf(q, p.x);
        if (prevY <= ps + 1 && p.y >= s) {
          if (s - p.peak > FALLMAX + (q.elev ? 22 : 0)) { p.y = s; killPlayer(); return; }   // lifts sink while you're airborne
          p.y = s; p.plat = q; p.state = 'walk'; sfx.land();
          return;
        }
      }
    }
    if (p.y > H + 10) { killPlayer(); return; }
    // points for clearing hazards
    if (p.state === 'jump') {
      for (const h of [...hazards, ...embers]) {
        if (p.jumped.has(h.id)) continue;
        if (Math.abs(h.x - p.x) < 6 && h.y > p.y && h.y - p.y < 30) { p.jumped.add(h.id); addScore(100, p.x, p.y - 20); sfx.score(); }
      }
    }
  }

  // pickups
  const pb = { x: p.x - 5, y: p.y - 14, w: 10, h: 14 };
  for (const k of S.pulaskis) {
    if (!k.taken && p.state !== 'climb' && overlap(pb, { x: k.x - 5, y: k.y - 6, w: 10, h: 12 })) {
      k.taken = true; p.pulaski = 9; p.anim = 0; sfx.pick();
    }
  }
  for (const it of S.items) {
    if (!it.taken && overlap(pb, { x: it.x - 5, y: it.y - 9, w: 10, h: 9 })) { it.taken = true; addScore(it.pts, it.x, it.y - 14); sfx.pick(); }
  }
  if (S.lanterns && p.state === 'walk') {
    for (const L of S.lanterns) {
      if (!L.lit && Math.abs(L.x - p.x) < 7 && Math.abs(L.y - p.y) < 4) {
        L.lit = true; litCount++; addScore(100, L.x, L.y - 20); sfx.lantern(); burst(L.x, L.y - 10, ['#ffd23f', '#ff9a3c', '#fff3b0'], 8);
        if (litCount >= S.lanterns.length) { stageClear(); return; }
      }
    }
  }
  if (S.goalPlat >= 0 && p.state === 'walk' && p.plat === plats[S.goalPlat]) stageClear();
}

function updateBear(dt) {
  const b = bear, d = diff();
  b.poseT -= dt;
  if (b.poseT <= 0) b.pose = 'idle';
  if (S.key === 'tower') {                       // paces and stomps out embers
    b.x += b.dir * 14 * dt;
    if (b.x < 130 || b.x > 190) b.dir *= -1;
  }
  b.t -= dt;
  if (b.t <= 0.45 && b.pose === 'idle' && b.t > 0) { b.pose = 'lift'; b.poseT = 0.45; }
  if (b.t <= 0) {
    b.pose = 'throw'; b.poseT = 0.35; b.throws++; sfx.throw();
    if (S.key === 'ridge') {
      if (b.throws % 5 === 0) spawnBoulder(b.x + 20, b.y - 20, 42, 120);
      else spawnLog();
      b.t = Math.max(1.3, rnd(2.0, 3.4) - d * 0.25);
    } else if (S.key === 'lifts') {
      const right = b.throws % 3 !== 0;
      spawnBoulder(b.x + (right ? 16 : -16), b.y - 16, right ? 52 + d * 4 : -(48 + d * 4), 165);
      b.t = Math.max(1.4, rnd(2.2, 3.2) - d * 0.2);
    } else {
      if (embers.length < 3 + Math.min(d, 3)) spawnEmber(b.x + (Math.random() < 0.5 ? -18 : 18), b.plat, Math.random() < 0.5 ? -1 : 1);
      b.t = Math.max(2.5, rnd(4.5, 6) - d * 0.4);
    }
  }
}

function landOn(o, prevY) {
  for (const q of plats) {
    if (o.x < q.x1 || o.x > q.x2) continue;
    const s = surf(q, o.x), ps = prevSurf(q, o.x);
    if (prevY <= ps + 1 && o.y >= s) return q;
  }
  return null;
}

function updateHazard(o, dt) {
  if (o.type === 'boulder') {
    o.rot += o.vx * dt * 0.2;
    const prevY = o.y;
    o.vy += G * dt; o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.vy > 0) {
      const q = landOn(o, prevY);
      if (q) { o.y = surf(q, o.x); o.vy = -o.bounce; const sd = slopeDir(q); if (sd) o.vx = sd * Math.abs(o.vx); sfx.boing(); }
    }
    if (o.x < -12 || o.x > W + 12 || o.y > H + 12) o.dead = true;
    return;
  }
  // logs
  o.rot += o.dir * dt * 9;
  if (o.state === 'roll') {
    const ox = o.x;
    o.x += o.dir * o.spd * dt;
    if (o.x < o.plat.x1 || o.x > o.plat.x2) { o.state = 'fall'; o.vx = o.dir * 26; o.vy = 0; o.plat = null; return; }
    o.y = surf(o.plat, o.x);
    for (const l of ladders) {
      if (l.goal || l.tp !== o.plat || l === o.lastL) continue;
      if ((ox - l.x) * (o.x - l.x) <= 0) {
        o.lastL = l;
        const near = player.y > o.y + 10 && Math.abs(player.x - l.x) < 70;
        if (Math.random() < (near ? 0.45 : 0.2) + diff() * 0.03) { o.state = 'ladder'; o.l = l; o.x = l.x; }
        break;
      }
    }
    if (S.fire && o.plat === plats[S.fire.plat] && o.x < S.fire.x + 10) {
      o.dead = true; burst(S.fire.x, o.y - 8, ['#ff9a3c', '#ffd23f'], 6);
      if (embers.length < 1 + Math.min(diff() + 1, 4) && Math.random() < 0.6) spawnEmber(S.fire.x + 10, plats[S.fire.plat], 1);
    }
  } else if (o.state === 'ladder') {
    o.y += 55 * dt;
    if (o.y >= o.l.bot) { o.y = o.l.bot; o.plat = o.l.bp; o.state = 'roll'; o.dir = slopeDir(o.plat) || o.dir; o.lastL = o.l; }
  } else {
    const prevY = o.y;
    o.vy += G * dt; o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.vy > 0) {
      const q = landOn(o, prevY);
      if (q) { o.y = surf(q, o.x); o.plat = q; o.state = 'roll'; o.dir = slopeDir(q) || o.dir; o.lastL = null; }
    }
  }
  if (o.x < -12 || o.x > W + 12 || o.y > H + 12) o.dead = true;
}

function updateEmber(e, dt) {
  e.t += dt;
  if (e.state === 'walk') {
    const ox = e.x;
    e.x += e.dir * e.spd * dt;
    if (e.x < e.plat.x1 + 3) { e.x = e.plat.x1 + 3; e.dir = 1; }
    if (e.x > e.plat.x2 - 3) { e.x = e.plat.x2 - 3; e.dir = -1; }
    e.y = surf(e.plat, e.x);
    e.cool -= dt;
    if (e.cool <= 0) {
      for (const l of ladders) {
        if (l.goal || (ox - l.x) * (e.x - l.x) > 0) continue;
        if (l.bp === e.plat && Math.random() < (player.y < e.y - 10 ? 0.55 : 0.12)) { e.state = 'climb'; e.l = l; e.vy = -1; e.x = l.x; break; }
        if (l.tp === e.plat && Math.random() < (player.y > e.y + 10 ? 0.55 : 0.12)) { e.state = 'climb'; e.l = l; e.vy = 1; e.x = l.x; break; }
        e.cool = 0.5;
      }
    }
    if (Math.random() < dt * 0.35) e.dir = (player.x > e.x ? 1 : -1) * (Math.random() < 0.75 ? 1 : -1);
  } else {
    e.y += e.vy * e.spd * 0.75 * dt;
    if (e.vy < 0 && e.y <= e.l.top) { e.y = e.l.top; e.plat = e.l.tp; e.state = 'walk'; e.cool = 0.8; }
    else if (e.vy > 0 && e.y >= e.l.bot) { e.y = e.l.bot; e.plat = e.l.bp; e.state = 'walk'; e.cool = 0.8; }
  }
}

function hazardBox(h) { return { x: h.x - 4, y: h.y - 9, w: 8, h: 8 }; }

function checkCollisions() {
  const p = player;
  if (p.state === 'dead') return;
  const pb = { x: p.x - 4, y: p.y - 13, w: 8, h: 12 };
  // Pulaski swing
  if (p.pulaski > 0) {
    const hb = { x: p.face > 0 ? p.x - 2 : p.x - 16, y: p.y - 28, w: 18, h: 28 };
    for (const h of [...hazards, ...embers]) {
      if (h.dead) continue;
      if (overlap(hb, hazardBox(h))) {
        h.dead = true; sfx.chop();
        const pts = h.type === 'boulder' ? 800 : [300, 500, 800][Math.floor(Math.random() * 3)];
        addScore(pts, h.x, h.y - 16);
        burst(h.x, h.y - 5, h.type === 'log' ? ['#c98a4a', '#8a5226', '#e8c08a'] : h.type === 'boulder' ? ['#9aa', '#667', '#ccd'] : ['#ffd23f', '#ff6b2b'], 10);
      }
    }
    hazards = hazards.filter(h => !h.dead); embers = embers.filter(e => !e.dead);
  }
  for (const h of [...hazards, ...embers]) {
    if (overlap(pb, hazardBox(h))) { killPlayer(); return; }
  }
  const bb = { x: bear.x - 14, y: bear.y - 30, w: 28, h: 30 };
  if (overlap(pb, bb)) killPlayer();
}

function killPlayer() {
  if (mode !== 'play') return;
  mode = 'dying'; modeT = 2.2; player.state = 'dead'; player.deadT = 0; sfx.die();
}

function stageClear() {
  if (mode !== 'play') return;
  mode = 'clear'; modeT = 3.2; sfx.clear();
  addScore(bonus, player.x, player.y - 24);
  hazards = []; embers = [];
  if (S.key === 'tower') { bear.flee = true; modeT = 4; }
  burst(player.x, player.y - 10, ['#ff6b8a', '#ffd23f', '#7fffd4'], 18);
}

function makeBg(key) {
  const pal = PALETTES[key];
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, pal.sky[0]); gr.addColorStop(0.6, pal.sky[1]); gr.addColorStop(1, pal.sky[2]);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  let seed = key.length * 977;
  const sr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) { g.fillStyle = sr() < 0.2 ? '#fff' : '#9aa6d8'; g.fillRect(Math.floor(sr() * W), Math.floor(sr() * H * 0.7), 1, 1); }
  // moon
  g.fillStyle = '#f3ecc8'; g.beginPath(); g.arc(270, 46, 12, 0, 7); g.fill();
  g.fillStyle = pal.sky[0]; g.beginPath(); g.arc(276, 42, 11, 0, 7); g.fill();
  // mountain ranges
  const range = (base, amp, col, step) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += step) g.lineTo(x, base - sr() * amp);
    g.lineTo(W, H); g.closePath(); g.fill();
  };
  range(230, 90, pal.mtn2, 24);
  range(290, 70, pal.mtn, 16);
  // pine silhouettes
  g.fillStyle = pal.mtn;
  for (let i = 0; i < 18; i++) {
    const x = sr() * W, h = 14 + sr() * 18, y = 330 + sr() * 20;
    g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + h * 0.35, y); g.lineTo(x - h * 0.35, y); g.closePath(); g.fill();
  }
  if (key === 'lifts') {                       // rock walls of the shaft
    g.fillStyle = 'rgba(20,30,34,.7)';
    for (let y = 0; y < H; y += 12) for (let x = (y / 12) % 2 * 10; x < W; x += 20) g.fillRect(x, y, 18, 10);
  }
  if (key === 'tower') {                       // lookout cabin silhouette
    g.fillStyle = 'rgba(30,10,24,.65)';
    g.fillRect(70, 40, 180, 300);
    g.fillStyle = 'rgba(255,190,90,.06)';
    for (let y = 60; y < 330; y += 40) g.fillRect(80, y, 160, 4);
  }
  return c;
}

function drawPlat(q, pal) {
  const t = 5;
  ctx.fillStyle = pal.beam;
  ctx.beginPath(); ctx.moveTo(q.x1, q.y1); ctx.lineTo(q.x2, q.y2); ctx.lineTo(q.x2, q.y2 + t); ctx.lineTo(q.x1, q.y1 + t); ctx.closePath(); ctx.fill();
  for (let x = q.x1; x < q.x2; x += 2) {
    const y = Math.round(surf(q, x));
    r(x, y, 2, 1, pal.hi);
    r(x, y + t - 1, 2, 1, pal.dk);
  }
  for (let x = q.x1 + 3; x < q.x2 - 1; x += 8) { const y = surf(q, x); r(x, y + 2, 1, 1, pal.dk); r(x + 4, y + 2, 1, 1, pal.dk); }

function drawRanger(x, y, face, frame, state, pul) {
  x = Math.round(x); y = Math.round(y);
  const skin = '#f1c27d', shirt = '#3f8f4f', pants = '#36466e', boot = '#4a2b14', hat = '#ffd23f';
  if (state === 'climb') {
    const a = frame % 2;

    r(x - 4, y - 11, 8, 6, shirt); r(x - 4, y - 5, 8, 2, pants);
    r(x - 6, y - (a ? 15 : 11), 2, 4, shirt); r(x + 4, y - (a ? 11 : 15), 2, 4, shirt);
    r(x - 6, y - (a ? 16 : 12), 2, 1, skin); r(x + 4, y - (a ? 12 : 16), 2, 1, skin);
    r(x - 4, y - 3, 3, a ? 3 : 2, boot); r(x + 1, y - 3, 3, a ? 2 : 3, boot);

  r(x - 4, y - 9, 8, 4, shirt); r(x - 4, y - 5, 8, 1, '#6b4420'); r(x - 4, y - 4, 8, 1, pants);

  else if (frame % 2) { r(x - 4, y - 3, 3, 3, pants); r(x + 2, y - 3, 3, 3, pants); r(x - 5, y - 1, 3, 1, boot); r(x + 3, y - 1, 3, 1, boot); }
  else { r(x - 2, y - 3, 4, 3, pants); r(x - 2, y - 1, 4, 1, boot); }
  // arm + tool
  if (pul) {

    if (up) {
      r(x + f * 3 - 1, y - 14, 2, 5, shirt);

    }
  } else {
    r(x - f * 4 - 1, y - 9, 2, 4, shirt); r(x - f * 4 - 1, y - 5, 2, 1, skin);
  }
}

function drawBear(b) {

    if (S.key === 'ridge') { r(x - 12, y - 52, 24, 7, '#9a5b2c'); r(x - 12, y - 52, 3, 7, '#d8a46a'); }
    else if (S.key === 'lifts') { ctx.fillStyle = '#8a929a'; ctx.beginPath(); ctx.arc(x, y - 50, 6, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.arc(x, y - 50, 5, 0, 7); ctx.fill(); }
  } else if (b.pose === 'throw') {
    ctx.fillRect(x + 10, y - 22, 16, 6); ctx.fillRect(x - 22, y - 26, 10, 6);
  } else {
    const sway = Math.sin(performance.now() / 300) * 2;
    ctx.fillRect(x - 17, y - 22 + sway, 6, 14); ctx.fillRect(x + 11, y - 22 - sway, 6, 14);
  }
  r(x - 11, y - 4, 8, 4, dark); r(x + 3, y - 4, 8, 4, dark);               // feet
}

function drawPup(x, y, t, freed) {
  x = Math.round(x); y = Math.round(y);
  const c = '#e8d2a8', d = '#8a5a2a';
  const wag = Math.floor(t * 8) % 2;
  r(x - 6, y - 6, 10, 4, c); r(x - 6, y - 2, 2, 2, c); r(x + 2, y - 2, 2, 2, c);
  r(x + 3, y - 10, 5, 5, c); r(x + 3, y - 10, 2, 3, d); r(x + 7, y - 7, 2, 1, '#222'); r(x + 6, y - 9, 1, 1, '#222');
  r(x - 8, y - (wag ? 8 : 6), 2, 2, c);
  r(x - 2, y - 6, 4, 2, '#d33');                                           // bandana
  if (!freed && Math.floor(t * 1.5) % 2 === 0) {
    ctx.font = FONT; ctx.fillStyle = '#fff'; ctx.fillText('ARF!', x - 4, y - 24);
  }
}

function drawLog(o) {
  const x = Math.round(o.x), y = Math.round(o.y - 5);
  ctx.fillStyle = '#8a5226'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#d8a46a'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#8a5226'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.stroke();
  const a = o.rot; r(x + Math.cos(a) * 3.5 - 0.5, y + Math.sin(a) * 3.5 - 0.5, 1, 1, '#5c3416');
}
function drawBoulder(o) {
  const x = Math.round(o.x), y = Math.round(o.y - 5);
  ctx.fillStyle = '#7d858c'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
  r(x - 3, y - 3, 2, 2, '#b8c0c6'); r(x + 1, y + 1, 2, 1, '#4c5358'); r(x + Math.cos(o.rot) * 3, y + Math.sin(o.rot) * 3, 1, 1, '#4c5358');
}
function drawEmber(e) {
  const x = Math.round(e.x), y = Math.round(e.y);
  const fl = Math.floor(e.t * 10) % 2;
  ctx.fillStyle = '#ff5a1f';
  ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.lineTo(x + 3, y - 7); ctx.lineTo(x + (fl ? 1 : -1), y - 13); ctx.lineTo(x - 3, y - 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.lineTo(x + 3, y); ctx.lineTo(x + (fl ? 2 : 0), y - 8); ctx.lineTo(x - 2, y - 5); ctx.closePath(); ctx.fill();
  r(x - 2, y - 5, 1, 2, '#000'); r(x + 1, y - 5, 1, 2, '#000');
}
function drawFire(f) {
  const x = f.x, y = surf(plats[f.plat], f.x), t = performance.now() / 100;
  r(x - 9, y - 3, 18, 3, '#5c3416'); r(x - 7, y - 5, 14, 2, '#8a5226');
  for (let i = 0; i < 4; i++) {
    const h = 8 + Math.sin(t + i * 2) * 3 + i % 2 * 3;
    ctx.fillStyle = i % 2 ? '#ffd23f' : '#ff6b2b';
    ctx.beginPath(); ctx.moveTo(x - 7 + i * 4, y - 4); ctx.lineTo(x - 4 + i * 4, y - 4 - h); ctx.lineTo(x - 1 + i * 4, y - 4); ctx.fill();
  }
}
function drawPulaski(k, t) {
  const y = Math.round(k.y + Math.sin(t * 3) * 1.5);
  r(k.x, y - 6, 1, 12, '#9b6a3a');
  r(k.x - 4, y - 7, 9, 2, '#b8c0c8'); r(k.x + 4, y - 7, 2, 4, '#b8c0c8'); r(k.x - 5, y - 7, 2, 3, '#d33');
}
function drawItem(it) {
  const x = it.x, y = it.y;
  if (it.kind === 'hat') { r(x - 6, y - 3, 12, 2, '#6b8e23'); r(x - 4, y - 7, 8, 4, '#6b8e23'); r(x - 4, y - 5, 8, 1, '#3b2a14'); }
  if (it.kind === 'pack') { r(x - 4, y - 9, 8, 9, '#c0392b'); r(x - 3, y - 6, 6, 3, '#e57368'); r(x - 2, y - 10, 4, 1, '#3b2a14'); }
  if (it.kind === 'thermos') { r(x - 2, y - 10, 5, 10, '#3fa7d6'); r(x - 2, y - 11, 5, 2, '#ddd'); r(x - 2, y - 6, 5, 1, '#1d5f80'); }
}
function drawLantern(L, t) {
  const x = L.x, y = L.y;
  if (L.lit) {
    const g = ctx.createRadialGradient(x, y - 6, 1, x, y - 6, 16);
    g.addColorStop(0, 'rgba(255,220,120,.6)'); g.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 16, y - 22, 32, 32);
  }
  r(x - 1, y - 12, 3, 1, '#333'); r(x - 3, y - 11, 7, 1, '#444');
  r(x - 3, y - 10, 7, 8, L.lit ? (Math.floor(t * 6) % 2 ? '#ffe27a' : '#ffd23f') : '#4a5560');
  r(x - 3, y - 10, 1, 8, '#333'); r(x + 3, y - 10, 1, 8, '#333'); r(x - 3, y - 2, 7, 2, '#444');
}

function drawText(s, x, y, c = '#fff', align = 'left') {
  ctx.font = FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
  ctx.textAlign = 'left';
}
const pad6 = n => String(n).padStart(6, '0');

function drawHUD() {
  r(0, 0, W, 30, 'rgba(0,0,0,.55)');
  drawText('SCORE', 6, 4, '#ff8f7f'); drawText(pad6(score), 6, 15);
  drawText('HIGH', 112, 4, '#ff8f7f'); drawText(pad6(hiScore), 104, 15);
  r(214, 3, 100, 24, '#1b2340'); ctx.strokeStyle = '#4fd1c5'; ctx.lineWidth = 1; ctx.strokeRect(214.5, 3.5, 99, 23);
  drawText('BONUS', 222, 7, '#4fd1c5'); drawText(String(bonus).padStart(4, '0'), 266, 15, bonus <= 1000 ? '#ff6b6b' : '#fff');
  drawText('L' + loop, 222, 17, '#ffd23f');
  for (let i = 0; i < Math.min(lives, 6); i++) { r(184 + (i % 3) * 9, 6 + Math.floor(i / 3) * 10, 7, 3, '#ffd23f'); r(183 + (i % 3) * 9, 9 + Math.floor(i / 3) * 10, 9, 1, '#e0b020'); }
  if (S && S.lanterns) drawText('LANTERNS ' + litCount + '/8', 6, 350, '#ffe27a');
}

function draw(t) {
  ctx.imageSmoothingEnabled = false;
  if (mode === 'title' || mode === 'over') { drawTitle(t); return; }
  const pal = PALETTES[S.key];
  if (!bgCache[S.key]) bgCache[S.key] = makeBg(S.key);
  ctx.drawImage(bgCache[S.key], 0, 0);

  if (S.elevators.length) drawElevatorRig();
  for (const l of ladders) drawLadder(l, pal);
  for (const q of plats) drawPlat(q, pal);
  if (S.key === 'tower') {                         // Scout's crate
    const c = plats[5];
    if (mode !== 'clear') { r(c.x1 + 8, c.y1 - 22, 32, 22, 'rgba(120,80,40,.35)'); for (let x = c.x1 + 8; x <= c.x1 + 40; x += 6) r(x, c.y1 - 22, 2, 22, '#8a5a2a'); r(c.x1 + 8, c.y1 - 23, 34, 2, '#8a5a2a'); }
  }
  if (S.fire) drawFire(S.fire);
  if (S.lanterns) for (const L of S.lanterns) drawLantern(L, t);
  for (const it of S.items) if (!it.taken) drawItem(it);
  for (const k of S.pulaskis) if (!k.taken) drawPulaski(k, t);

  const pupPlat = plats[S.pup.plat];
  const freed = mode === 'clear';
  drawPup(S.pup.x, surf(pupPlat, S.pup.x), t, freed);
  if (freed) { ctx.fillStyle = '#ff6b8a'; const hx = S.pup.x - 12, hy = surf(pupPlat, S.pup.x) - 30 - Math.sin(t * 4) * 2; ctx.beginPath(); ctx.arc(hx - 2, hy, 3, 0, 7); ctx.arc(hx + 2, hy, 3, 0, 7); ctx.moveTo(hx - 5, hy + 1); ctx.lineTo(hx, hy + 7); ctx.lineTo(hx + 5, hy + 1); ctx.fill(); }
  drawBear(bear);

  for (const h of hazards) h.type === 'log' ? drawLog(h) : drawBoulder(h);
  for (const e of embers) drawEmber(e);

  // player
  const p = player;
  if (p.state === 'dead') {
    ctx.save(); ctx.translate(Math.round(p.x), Math.round(p.y - 8));
    const spin = p.deadT < 1.2 ? Math.floor(p.deadT * 10) * Math.PI / 2 : Math.PI / 2;
    ctx.rotate(spin); drawRanger(0, 8, 1, 0, 'walk', false); ctx.restore();
    if (p.deadT > 1.2) for (let i = 0; i < 3; i++) { const a = t * 4 + i * 2.1; r(p.x + Math.cos(a) * 9, p.y - 18 + Math.sin(a) * 3, 2, 2, '#ffd23f'); }
  } else {
    const blink = p.pulaski > 0 && p.pulaski < 2 && Math.floor(t * 10) % 2;
    const frame = p.pulaski > 0 ? Math.floor(p.anim * 8) : Math.floor(p.anim * 9);
    drawRanger(p.x, p.y, p.face, frame, p.state, p.pulaski > 0 && !blink);
  }

  for (const q of particles) r(q.x, q.y, 2, 2, q.c);
  for (const q of pops) drawText(q.text, q.x, q.y, q.color, 'center');
  drawHUD();

  if (mode === 'intro') {
    r(30, 130, 260, 92, 'rgba(10,14,32,.92)');
    ctx.strokeStyle = '#ffd23f'; ctx.strokeRect(30.5, 130.5, 259, 91);
    drawText('STAGE ' + loop + '-' + (stageIdx + 1), W / 2, 142, '#ffd23f', 'center');
    drawText(S.name, W / 2, 160, '#fff', 'center');
    const elev = ELEVATIONS[stageIdx] + (loop - 1) * 450;
    drawText('ELEVATION ' + elev.toLocaleString('en-US') + ' FT', W / 2, 178, '#4fd1c5', 'center');
    wrapText(S.tip, W / 2, 196, 30, '#b9c0d8');
  }
  if (mode === 'clear') {
    r(40, 150, 240, 48, 'rgba(10,14,32,.9)');
    drawText(S.key === 'tower' ? 'OL\' BRAMBLE RUNS OFF!' : 'SCOUT IS SAFE... FOR NOW!', W / 2, 160, '#7fffd4', 'center');
    drawText(S.key === 'tower' ? 'SCOUT IS HOME!' : 'BRAMBLE CLIMBS HIGHER...', W / 2, 178, '#ffd23f', 'center');
  }
  if (paused) {
    r(0, 0, W, H, 'rgba(0,0,0,.55)');
    drawText('PAUSED', W / 2, 160, '#ffd23f', 'center');
    drawText(isTouch ? 'TAP II TO RESUME' : 'PRESS P TO RESUME', W / 2, 180, '#fff', 'center');
  }
}

function wrapText(s, cx, y, maxChars, c) {
  const words = s.split(' '); let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > maxChars) { drawText(line.trim(), cx, y, c, 'center'); y += 12; line = w; }
    else line += ' ' + w;
  }
  if (line.trim()) drawText(line.trim(), cx, y, c, 'center');
}

function drawTitle(t) {
  if (!bgCache.title) bgCache.title = makeBg('tower');
  ctx.drawImage(bgCache.title, 0, 0);
  r(0, 0, W, H, 'rgba(6,8,20,.45)');
  // logo
  ctx.font = '20px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#5c3416'; ctx.fillText('LOOKOUT', W / 2 + 2, 40); ctx.fillText('PEAK', W / 2 + 2, 66);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('LOOKOUT', W / 2, 38); ctx.fillText('PEAK', W / 2, 64);
  ctx.textAlign = 'left';
  // cast
  const fake = { x: 70, y: 168, pose: Math.floor(t) % 3 === 0 ? 'lift' : 'idle' };
  const saveS = S; S = S || { key: 'ridge' };
  drawBear(fake); S = saveS;
  drawRanger(250, 168, -1, Math.floor(t * 4), 'walk', false);
  drawPup(160, 168, t, false);
  r(30, 168, 260, 4, '#9a5b2c'); r(30, 168, 260, 1, '#d39054');
  if (mode === 'over') {
    drawText('GAME OVER', W / 2, 100, '#ff6b6b', 'center');
    drawText('SCORE ' + pad6(score), W / 2, 116, '#fff', 'center');
  } else {
    wrapText("OL' BRAMBLE THE GRIZZLY NABBED SCOUT THE PUP! CLIMB THE MOUNTAIN AND BRING SCOUT HOME.", W / 2, 96, 30, '#e8e2d0');
  }
  drawText('HIGH ' + pad6(hiScore), W / 2, 186, '#ff8f7f', 'center');
  const rows = [['#c98a4a', 'LOG', 'JUMP IT  100'], ['#ff6b2b', 'EMBER', 'AVOID IT'], ['#b8c0c8', 'PULASKI', 'CHOP 300-800'], ['#ffe27a', 'LANTERN', 'LIGHT ALL 8']];
  rows.forEach(([c, a, b], i) => { drawText(a, 50, 212 + i * 14, c); drawText(b, 140, 212 + i * 14, '#b9c0d8'); });
  if (Math.floor(t * 2) % 2 === 0) drawText(isTouch ? 'TAP TO START' : 'PRESS ENTER TO START', W / 2, 290, '#fff', 'center');
  drawText('EXTRA RANGER AT 10000', W / 2, 314, '#4fd1c5', 'center');
  drawText('AN ORIGINAL ARCADE CLIMBER', W / 2, 340, '#6c7598', 'center');
}

/* ================================================================
   LOOP
   ================================================================ */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw(now / 1000);
  requestAnimationFrame(frame);
}
fit();
(document.fonts && document.fonts.load ? document.fonts.load(FONT) : Promise.resolve()).catch(() => {}).finally(() => requestAnimationFrame(frame));
</script>
</body>
</html>
