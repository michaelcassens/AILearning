<title>Horizon 95 Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EFF3F1; --surface:#FFFFFF; --surface-2:#E6ECE9; --ink:#14201B; --muted:#55665E; --line:#D3DCD8;
  --accent:#1D6A58; --accent-ink:#FFFFFF; --accent-soft:#D5EAE3; --band:#2F5E8C;
  --good:#1F6E45; --warn:#8F5B0E; --bad:#B42318; --good-soft:#DCEFE3; --warn-soft:#F6E7CC; --bad-soft:#F8DDD9;
  --c-us:#1D6A58; --c-intl:#2F5E8C; --c-bond:#8C7B22; --c-muni:#C29A3A; --c-cash:#7E8E88; --c-single:#A5462F; --c-re:#6B4D96;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#161F1C; --surface-2:#1E2925; --ink:#E4EBE8; --muted:#94A49D; --line:#2B3833;
    --accent:#52B79D; --accent-ink:#0B1411; --accent-soft:#1D3A32; --band:#7EA9D8;
    --good:#5CBF84; --warn:#E3AA4B; --bad:#F0776B; --good-soft:#193427; --warn-soft:#3A2D14; --bad-soft:#3D1D1A;
    --c-us:#52B79D; --c-intl:#7EA9D8; --c-bond:#CDBB57; --c-muni:#E7C473; --c-cash:#9AABA4; --c-single:#E0785E; --c-re:#A98BD6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1E2925; --ink:#E4EBE8; --muted:#94A49D; --line:#2B3833;
  --accent:#52B79D; --accent-ink:#0B1411; --accent-soft:#1D3A32; --band:#7EA9D8;
  --good:#5CBF84; --warn:#E3AA4B; --bad:#F0776B; --good-soft:#193427; --warn-soft:#3A2D14; --bad-soft:#3D1D1A;
  --c-us:#52B79D; --c-intl:#7EA9D8; --c-bond:#CDBB57; --c-muni:#E7C473; --c-cash:#9AABA4; --c-single:#E0785E; --c-re:#A98BD6;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
.num,td.n,input.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
small,.hint{color:var(--muted);font-size:12px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);max-width:1440px;margin-inline:auto}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 280px;min-width:0}
.brand h1{font-size:24px;font-weight:700;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.brand input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font-weight:500;color:var(--muted)}
.brand input:hover,.brand input:focus{border-color:var(--line);background:var(--surface);color:var(--ink)}
.status{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad);border-color:transparent}
.btn[data-armed]{background:var(--bad);border-color:var(--bad);color:#fff}

.banner{max-width:1440px;margin:12px auto 0;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner b{color:var(--warn)}

/* layout */
.layout{max-width:1440px;margin:16px auto 0;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(360px,440px)}
  .results{grid-column:2;grid-row:1;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 92px);overflow:auto}
  .inputs{grid-column:1;grid-row:1}
}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.panel{padding-top:18px;display:grid;gap:18px}
.sec{display:grid;gap:12px}
.lede{color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.card-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:10px 14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=number],input[type=text],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
textarea{font-family:var(--f-mono);font-size:12px;min-height:90px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input,td select{padding:4px 6px}
td.n,th.n{text-align:right;white-space:nowrap}
td.sym input{font-family:var(--f-mono);font-weight:500;text-transform:uppercase;width:92px}
.w-num{width:110px}.w-yr{width:78px}.w-pct{width:70px}
tfoot td{font-weight:600;background:var(--surface-2)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-mono);font-size:17px;font-weight:500}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;max-width:72ch}
.warnline{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-block;font-size:12px;border:1px dashed var(--warn);color:var(--warn);border-radius:999px;padding:1px 9px;cursor:pointer;background:transparent}

/* results */
.results{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px;align-content:start}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.ring .v small{display:block;font-size:11px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stale{font-size:12px;color:var(--warn)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.kpi span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
#chart{width:100%;min-height:240px}
#chart svg{display:block;width:100%;height:auto}
#chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.slider{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.slider output{font-family:var(--f-mono);text-align:right}
input[type=range]{accent-color:var(--accent);width:100%}
details summary{cursor:pointer;font-weight:600}
.cmp td,.cmp th{font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--accent)}
.bar.bg{background:var(--surface-2);width:100%}
.disclaimer{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:640px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">
    <h1>Horizon<span>95</span></h1>
    <input id="plan-name" data-path="meta.name" data-type="text" aria-label="Plan name" placeholder="Plan name">
  </div>
  <span class="status" id="save-status">Saved in this browser</span>
  <button class="btn primary" data-act="run">Run simulation</button>
</header>
<div class="banner" id="example-banner" hidden>
  <span><b>Example numbers.</b> This isn't your data. Edit any field or import your plan file from <b>Save &amp; share</b>.</span>
  <button class="btn small" data-act="tab" data-tab="share">Import plan file</button>
</div>

<main class="layout">
  <aside class="results" id="results" aria-live="polite"></aside>
  <section class="inputs">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </section>
</main>
<div id="modal-root"></div>

<script>

function normalize(raw) {
  const d = defaults();
  const s = Object.assign({}, d, raw || {});
  for (const k of ['meta', 'household', 'taxes', 'healthcare', 'vehicles', 'remodel', 'assumptions', 'whatif']) s[k] = Object.assign({}, d[k], (raw || {})[k] || {});
  s.assumptions.classes = Object.assign({}, d.assumptions.classes, ((raw || {}).assumptions || {}).classes || {});
  for (const c of CLASSES) s.assumptions.classes[c.k] = Object.assign({ mean: c.mean, sd: c.sd }, s.assumptions.classes[c.k]);
  for (const k of ['incomes', 'accounts', 'cash', 'options', 'properties', 'budget']) s[k] = Array.isArray(s[k]) ? s[k] : [];
  const withId = o => (o && typeof o === 'object' ? (o.id ? o : Object.assign(o, { id: uid() })) : { id: uid() });
  s.incomes = s.incomes.map(o => Object.assign({ name: '', amount: 0, start: '', end: '', mode: 'infl', growth: 0, taxable: true, note: '' }, withId(o)));
  s.accounts = s.accounts.map(a => {
    a = Object.assign({ name: 'Account', type: 'taxable', owner: '', contrib: 0, contribEnd: '', holdings: [] }, withId(a));
    a.holdings = (Array.isArray(a.holdings) ? a.holdings : []).map(h => Object.assign({ sym: '', cls: 'us', qty: 0, price: 0, basis: '' }, withId(h)));
    return a;
  });
  s.cash = s.cash.map(o => Object.assign({ name: '', balance: 0, rate: 0 }, withId(o)));
  s.options = s.options.map(o => Object.assign({ name: '', units: 0, strike: 0, price: 0, year: '', growth: 6, vol: 30, taxRate: 37 }, withId(o)));
  s.properties = s.properties.map(o => Object.assign({ name: '', value: 0, mortgage: 0, payment: 0, payoff: '', propTax: 0, insurance: 0, maintPct: 1, appr: 4, rent: 0, saleYear: '', sellCost: 6 }, withId(o)));
  s.budget = s.budget.map(o => Object.assign({ item: '', category: '', amount: 0, kind: 'general', start: '', end: '' }, withId(o)));
  return s;
}

/* ---------- persistence ---------- */
const LS_KEY = 'horizon95.plan.v1', LS_TAB = 'horizon95.tab';
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
let state;
try { const raw = lsGet(LS_KEY); state = raw ? normalize(JSON.parse(raw)) : exampleState(); } catch { state = exampleState(); }
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  $('#save-status').textContent = 'Saving…';
  saveTimer = setTimeout(() => { $('#save-status').textContent = lsSet(LS_KEY, JSON.stringify(state)) ? 'Saved in this browser' : 'Not saved (browser storage blocked). Export to keep changes.'; }, 400);
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}

/* ---------- field builders ---------- */
const fid = p => 'f-' + p.replace(/\./g, '-');
function inp(path, { type = 'number', ph = '', cls = '', step = 'any', label = '' } = {}) {
  const v = getPath(state, path);
  const val = blank(v) ? '' : v;
  const aria = label ? ` aria-label="${esc(label)}"` : '';
  if (type === 'text') return `<input id="${fid(path)}" type="text" class="${cls}" data-path="${path}" data-type="text" value="${esc(val)}" placeholder="${esc(ph)}"${aria}>`;
  return `<input id="${fid(path)}" type="number" step="${step}" inputmode="decimal" class="${cls}" data-path="${path}" data-type="${type}" value="${esc(val)}" placeholder="${esc(ph)}"${aria}>`;
}
function sel(path, options, label = '') {
  const v = getPath(state, path);
  return `<select id="${fid(path)}" data-path="${path}" data-type="text"${label ? ` aria-label="${esc(label)}"` : ''}>${options.map(([k, t]) => `<option value="${esc(k)}"${String(k) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
}
function chk(path, label = '') {
  return `<input id="${fid(path)}" type="checkbox" data-path="${path}" data-type="bool"${getPath(state, path) ? ' checked' : ''}${label ? ` aria-label="${esc(label)}"` : ''}>`;
}
const fld = (label, control, hint) => `<label class="fld"><span>${label}</span>${control}${hint ? `<small>${hint}</small>` : ''}</label>`;
const dd = (key, cls = '') => `<b class="${cls}" data-d="${key}"></b>`;

/* ---------- derived numbers ---------- */
function totals(s = state) {
  const t = { roth: 0, deferred: 0, taxable: 0, basis: 0, cls: new Array(CLASSES.length).fill(0), accts: [], missingBasis: 0 };
  const mb = num(s.assumptions.missingBasisPct) / 100;
  s.accounts.forEach(a => {
    let v = 0;
    a.holdings.forEach(h => {
      const hv = num(h.qty) * num(h.price); v += hv; t.cls[CI[h.cls] ?? 0] += hv;
      if (a.type === 'taxable') { if (blank(h.basis)) { t.basis += hv * mb; if (hv > 0) t.missingBasis++; } else t.basis += num(h.basis); }
    });
    t.accts.push(v); t[a.type] = (t[a.type] || 0) + v;
  });
  t.cash = s.cash.reduce((x, c) => x + num(c.balance), 0);
  t.invest = t.roth + t.deferred + t.taxable;
  t.liquid = t.invest + t.cash;
  t.reValue = s.properties.reduce((x, p) => x + num(p.value), 0);
  t.reDebt = s.properties.reduce((x, p) => x + num(p.mortgage), 0);
  t.opts = s.options.reduce((x, o) => x + num(o.units) * Math.max(0, num(o.price) - num(o.strike)), 0);
  t.nw = t.liquid + t.reValue - t.reDebt + t.opts;
  t.budget = { general: 0, healthcare: 0, all: 0 };
  s.budget.forEach(b => { const a = num(b.amount); t.budget.all += a; if (b.kind === 'healthcare') t.budget.healthcare += a; else t.budget.general += a; });
  return t;
}
function ages(s = state) {
  const h = s.household, start = num(h.startYear);
  const b1 = num(h.p1Birth), b2 = num(h.p2Birth);
  const hasP2 = b2 > 0;
  let hb = h.horizonWho === 'p1' ? b1 : h.horizonWho === 'p2' ? (b2 || b1) : Math.max(b1, b2 || 0);
  const endYear = hb + num(h.horizonAge || 95);
  return { start, b1, b2, hasP2, hb, endYear, N: Math.max(1, endYear - start + 1), ok: b1 > 1900 && start > 1900 && endYear >= start };
}
// Deterministic first-year cash flow (today's dollars, no market randomness)
function yearOne(s = state) {
  const A = ages(s), Y = A.start, a1 = Y - A.b1, a2 = Y - A.b2;
  let income = 0, ord = 0, spend = 0, housing = 0, health = 0;
  s.incomes.forEach(i => { if (inRange(Y, i.start, i.end)) { income += num(i.amount); if (i.taxable) ord += num(i.amount); } });
  s.budget.forEach(b => { if (inRange(Y, b.start, b.end)) { const a = num(b.amount); spend += a; if (b.kind === 'healthcare') health += a; } });
  const hc = s.healthcare;
  const people = A.hasP2 ? [a1, a2] : [a1];
  people.forEach(a => { const c = a < 65 ? num(hc.pre65) : num(hc.post65); spend += c; health += c; });
  s.properties.forEach(p => {
    if (!blank(p.saleYear) && Y >= num(p.saleYear)) return;
    const c = num(p.propTax) + num(p.insurance) + num(p.value) * num(p.maintPct) / 100 + ((!blank(p.payoff) && Y <= num(p.payoff)) || (blank(p.payoff) && num(p.mortgage) > 0) ? num(p.payment) : 0);
    spend += c; housing += c; income += num(p.rent); ord += num(p.rent);
  });
  s.accounts.forEach(a => { if (num(a.contrib) > 0 && (blank(a.contribEnd) || Y <= num(a.contribEnd))) spend += num(a.contrib); });
  const T = s.taxes;
  const tax = T.mode === 'fixed' ? num(T.fedFixed) + num(T.stateFixed) : ord * (num(T.fedRate) + num(T.stateRate)) / 100;
  return { income, spend, tax, gap: income - spend - tax, health, general: spend - health, housing };
}
function inRange(Y, a, b) { return (blank(a) || Y >= num(a)) && (blank(b) || Y <= num(b)); }

function derivedMap() {
  const t = totals(), A = ages(), y1 = yearOne();
  const m = {};
  state.accounts.forEach((a, i) => { m['acct-' + i] = money(t.accts[i]); a.holdings.forEach((h, j) => { m[`hv-${i}-${j}`] = money(num(h.qty) * num(h.price)); }); });
  Object.assign(m, {
    'tot-roth': money(t.roth, 1), 'tot-deferred': money(t.deferred, 1), 'tot-taxable': money(t.taxable, 1), 'tot-cash': money(t.cash, 1),
    'tot-invest': money(t.invest, 1), 'tot-re': money(t.reValue - t.reDebt, 1), 'tot-opts': money(t.opts, 1), 'tot-nw': money(t.nw, 1),
    'tot-basis': money(t.basis, 1), 'tot-gain': money(t.taxable - t.basis, 1),
    'bud-all': money(t.budget.all), 'bud-month': money(t.budget.all / 12), 'bud-general': money(t.budget.general), 'bud-health': money(t.budget.healthcare),
    'inc-total': money(state.incomes.reduce((x, i) => x + (inRange(A.start, i.start, i.end) ? num(i.amount) : 0), 0)),
    'cash-total': money(t.cash),
    'y1-income': money(y1.income), 'y1-spend': money(y1.spend), 'y1-tax': money(y1.tax),
    'y1-gap': (y1.gap >= 0 ? 'Surplus ' : 'Draw from savings ') + money(Math.abs(y1.gap)),
    'y1-general': money(y1.general), 'y1-health': money(y1.health), 'y1-housing': money(y1.housing),
    'horizon': A.ok ? `${A.start} to ${A.endYear} · ${A.N} years` : 'Add birth years on the Household tab',
  });
  state.properties.forEach((p, i) => { m['eq-' + i] = money(num(p.value) - num(p.mortgage)); });
  state.options.forEach((o, i) => { m['ov-' + i] = money(num(o.units) * Math.max(0, num(o.price) - num(o.strike))); });
  // healthcare projection at mean inflation, today's dollars
  const hcx = num(state.assumptions.hcExtra) / 100, hc = state.healthcare;
  [75, 85].forEach(age => {
    const Y = A.b1 + age, yrs = Math.max(0, Y - A.start);
    const people = A.hasP2 ? [age, Y - A.b2] : [age];
    let c = people.reduce((x, a) => x + (a < 65 ? num(hc.pre65) : num(hc.post65)), 0) + t.budget.healthcare;
    if (age >= num(hc.ltcAge) && age < num(hc.ltcAge) + num(hc.ltcYears)) c += num(hc.ltcCost);
    m['hc-' + age] = A.ok ? money(c * Math.pow(1 + hcx, yrs)) : '—';
  });
  m['html:alloc'] = allocBar(t.cls);
  return m;
}
function allocBar(cls) {
  const tot = cls.reduce((a, b) => a + b, 0) || 1;
  const bars = CLASSES.map((c, i) => cls[i] > 0 ? `<i style="width:${(cls[i] / tot * 100).toFixed(2)}%;background:var(--c-${c.k})" title="${esc(c.label)} ${pct(cls[i] / tot)}"></i>` : '').join('');
  const leg = CLASSES.map((c, i) => cls[i] > 0 ? `<span><i style="background:var(--c-${c.k})"></i>${esc(c.label)} ${pct(cls[i] / tot)}</span>` : '').join('');
  return `<div class="alloc" role="img" aria-label="Allocation across asset classes">${bars}</div><div class="legend">${leg}</div>`;
}
function refreshDerived() {
  const m = derivedMap();
  $$('[data-d]').forEach(el => { const v = m[el.dataset.d]; if (v !== undefined) el.textContent = v; });
  $$('[data-dhtml]').forEach(el => { const v = m['html:' + el.dataset.dhtml]; if (v !== undefined) el.innerHTML = v; });
  $('#example-banner').hidden = !state.meta.isExample;
  renderMissing();
}

/* ---------- input handling ---------- */
function readEl(el) {
  const t = el.dataset.type;
  if (t === 'bool') return el.checked;
  if (t === 'text') { const v = el.value; return el.tagName === 'SELECT' && /^\d+$/.test(v) && el.dataset.path === 'assumptions.trials' ? +v : v; }
  if (el.value === '') return '';
  const n = parseFloat(el.value); return isFinite(n) ? (t === 'int' ? Math.round(n) : n) : '';
}
function onFieldChange(el) {
  const path = el.dataset.path;
  setPath(state, path, readEl(el));
  if (path !== 'meta.name' && path !== 'meta.uploadMode') state.meta.isExample = false;
  if (/\.sym$/.test(path)) { // auto-classify known symbols
    const v = String(el.value).toUpperCase().trim(); const base = path.replace(/\.sym$/, '');
    if (SYMBOL_CLASS[v]) { setPath(state, base + '.cls', SYMBOL_CLASS[v]); const s = document.getElementById(fid(base + '.cls')); if (s) s.value = SYMBOL_CLASS[v]; }
  }
  scheduleSave(); markStale(); refreshDerived();
  if (/^(taxes\.mode|accounts\.\d+\.type)$/.test(path)) renderPanel();
}
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.path) return;
  if (el.type === 'checkbox' || el.tagName === 'SELECT') return;
  onFieldChange(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'budget-file') return handleBudgetFile(el);
  if (el.id === 'plan-file') return handlePlanFile(el);
  if (!el.dataset || !el.dataset.path) return;
  if (el.type === 'checkbox' || el.tagName === 'SELECT') onFieldChange(el);
});

function arm(btn) { // two-click confirm for destructive actions
  if (btn.dataset.armed) return true;
  const txt = btn.textContent;
  btn.dataset.armed = '1'; btn.textContent = 'Click again to confirm';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = txt; } }, 3000);
  return false;
}
function structural() { state.meta.isExample = false; scheduleSave(); markStale(); renderPanel(); }

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const act = btn.dataset.act, i = +btn.dataset.i;
  const y = num(state.household.startYear) || new Date().getFullYear();
  switch (act) {
    case 'tab': currentTab = btn.dataset.tab; lsSet(LS_TAB, currentTab); renderTabs(); renderPanel(); $('#tabs').scrollIntoView({ block: 'nearest' }); break;
    case 'run': runMain(); break;
    case 'del': state[btn.dataset.list].splice(i, 1); structural(); break;
    case 'add-income': state.incomes.push({ id: uid(), name: 'New income', amount: 0, start: y, end: '', mode: 'infl', growth: 0, taxable: true, note: '' }); structural(); break;
    case 'add-account': state.accounts.push({ id: uid(), name: 'New account', type: 'taxable', owner: '', contrib: 0, contribEnd: '', holdings: [] }); structural(); break;
    case 'del-account': if (arm(btn)) { state.accounts.splice(i, 1); structural(); } break;
    case 'add-holding': state.accounts[+btn.dataset.a].holdings.push({ id: uid(), sym: '', cls: 'us', qty: 0, price: 0, basis: '' }); structural(); break;
    case 'del-holding': state.accounts[+btn.dataset.a].holdings.splice(+btn.dataset.h, 1); structural(); break;
    case 'paste': pasteHoldings(+btn.dataset.a); break;
    case 'add-cash': state.cash.push({ id: uid(), name: 'New account', balance: 0, rate: 0 }); structural(); break;
    case 'add-opt': state.options.push({ id: uid(), name: 'New grant', units: 0, strike: 0, price: 0, year: y + 1, growth: 6, vol: 30, taxRate: 37 }); structural(); break;
    case 'add-prop': state.properties.push({ id: uid(), name: 'New property', value: 0, mortgage: 0, payment: 0, payoff: '', propTax: 0, insurance: 0, maintPct: 1, appr: 4, rent: 0, saleYear: '', sellCost: 6 }); structural(); break;
    case 'del-prop': if (arm(btn)) { state.properties.splice(i, 1); structural(); } break;
    case 'add-budget': state.budget.push({ id: uid(), item: 'New item', category: '', amount: 0, kind: 'general', start: '', end: '' }); structural(); break;
    case 'clear-budget': if (arm(btn)) { state.budget = []; structural(); } break;
    case 'template': saveFile('budget-template.csv', 'Item,Category,Amount,Frequency,Type\nGroceries,Food,1200,Monthly,General\nUtilities,Home,600,Monthly,Housing\nTravel,Lifestyle,12000,Annual,General\nDental,Health,200,Monthly,Healthcare\nAuto insurance,Insurance,2200,Annual,Insurance\n', '#upload-msg'); break;
    case 'export': saveFile(((state.meta.name || 'plan').replace(/[^\w\- ]+/g, '').trim() || 'plan') + '.horizon95.json', JSON.stringify(state, null, 1), '#share-msg'); break;
    case 'load-example': if (arm(btn)) { state = exampleState(); afterReplace(); } break;
    case 'blank-plan': if (arm(btn)) { state = normalize({ meta: { name: 'New plan', isExample: false } }); afterReplace(); } break;
    case 'save-shared': saveShared(btn); break;
    case 'load-shared': loadShared(btn.dataset.id); break;
    case 'del-shared': if (arm(btn)) delShared(btn.dataset.id); break;
    case 'chart': chartMode = btn.dataset.mode; drawResults(); break;
    case 'compare': compareRemodel(); break;
    case 'goto': currentTab = btn.dataset.tab; lsSet(LS_TAB, currentTab); renderTabs(); renderPanel(); break;
  }
});
function afterReplace() { scheduleSave(); renderTabs(); renderPanel(); runMain(); }

function pasteHoldings(ai) {
  const a = state.accounts[ai], ta = document.getElementById('paste-' + a.id); if (!ta) return;
  let added = 0;
  ta.value.split(/\r?\n/).forEach(line => {
    line = line.trim(); if (!line) return;
    const parts = line.includes('\t') ? line.split('\t') : line.split(/\s+/);
    const sym = (parts[0] || '').toUpperCase().replace(/[^A-Z0-9.\-]/g, '');
    const qty = num(parts[1]), price = num(parts[2]);
    if (!sym || !(qty > 0)) return;
    a.holdings.push({ id: uid(), sym, cls: SYMBOL_CLASS[sym] || 'us', qty, price, basis: parts[3] !== undefined && parts[3] !== '' ? num(parts[3]) : '' });
    added++;
  });
  structural();
  if (!added) alertIn(`#paste-${a.id}`, 'No rows were read. Each line needs a symbol, quantity and price.');
}
function alertIn(sel, msg) { const el = $(sel); if (el) { const p = document.createElement('p'); p.className = 'warnline'; p.textContent = msg; el.after(p); } }

/* ---------- files ---------- */
async function saveFile(name, text, msgSel) {
  const msg = $(msgSel);
  const show = (t, warn) => { if (msg) msg.innerHTML = `<p class="${warn ? 'warnline' : 'hint'}">${esc(t)}</p>`; };
  if (dlRef) {
    try { await dlRef.save({ filename: name, data: text }); show('Saved ' + name + '.'); return; }
    catch (err) { if (err && err.code === 'declined') { show('Download cancelled.'); return; } }
  }
  try {
    if (!window.claude) { // opened as a local file: a normal download works
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      show('Downloaded ' + name + '.'); return;
    }
  } catch { }
  // fallback: show text to copy
  $('#modal-root').innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Copy file contents"><div class="card">
    <h3>Copy ${esc(name)}</h3><p class="hint">Downloads aren’t available in this view. Copy the text below and save it in a file named <span class="mono">${esc(name)}</span>.</p>
    <textarea id="copy-area" style="min-height:260px" readonly>${esc(text)}</textarea>
    <div class="row"><button class="btn primary" id="copy-btn">Copy</button><button class="btn" id="close-modal">Close</button></div></div></div>`;
  $('#close-modal').onclick = () => { $('#modal-root').innerHTML = ''; };
  $('#copy-btn').onclick = () => { const ta = $('#copy-area'); navigator.clipboard?.writeText(ta.value).then(() => { $('#copy-btn').textContent = 'Copied'; }, () => { ta.select(); }); };
}
function handlePlanFile(el) {
  const f = el.files && el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {

  if (!state.incomes.some(i => num(i.amount) > 0)) miss.push(['income', 'Income amounts']);
  if (state.properties.length && t.reValue === 0) miss.push(['realestate', 'Property values']);
  if (t.cash === 0) miss.push(['cash', 'Bank balances']);
  if (state.accounts.some(a => a.holdings.length === 0)) miss.push(['accounts', 'Empty accounts']);
  if (t.missingBasis) miss.push(['accounts', `${t.missingBasis} missing cost bas${t.missingBasis > 1 ? 'es' : 'is'}`]);
  el.innerHTML = miss.length ? `<div class="kicker" style="margin-bottom:6px">Still blank</div><div class="row">${miss.map(([tab, l]) => `<button class="chip" data-act="goto" data-tab="${tab}">${esc(l)}</button>`).join('')}</div>` : '';
}
function drawResults() {
  const R = lastRes, el = $('#results'), t = totals(), A = ages();
  const who = state.household.horizonWho === 'p1' ? state.household.p1Name : state.household.horizonWho === 'p2' ? state.household.p2Name : 'the younger of you';
  const ageLabel = num(state.household.horizonAge) || 95;
  if (!R) {
    el.innerHTML = `<div><div class="kicker">Chance of lasting through ${ageLabel}</div><h2 style="margin-top:4px">Add birth years to run</h2>
      <p class="hint" style="margin-top:6px">The simulation needs at least Person 1's birth year and a first plan year.</p></div>
      <button class="btn primary" data-act="goto" data-tab="household">Go to Household</button><div id="missing"></div>`;
    renderMissing(); return;
  }
  const [cls, label] = status(R.success);
  const C = 2 * Math.PI * 52, off = C * (1 - R.success);
  const last = R.band.liq[R.N - 1], lastNw = R.band.nw[R.N - 1];
  const failMed = R.failAges.length ? R.failAges[Math.floor(R.failAges.length / 2)] : null;
  el.innerHTML = `
    <div class="gauge">
      <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" style="fill:none;stroke:var(--surface-2)" stroke-width="12"></circle>
        <circle cx="60" cy="60" r="52" style="fill:none;stroke:var(--${cls === 'good' ? 'good' : cls === 'warn' ? 'warn' : 'bad'})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle></svg>
        <div class="v"><div><b>${Math.round(R.success * 100)}%</b><small class="hint">of ${R.T.toLocaleString()}</small></div></div></div>
      <div style="display:grid;gap:6px">
        <div class="kicker">Chance of lasting through age ${ageLabel}</div>
        <div><span class="pill ${cls}">${label}</span></div>
        <p class="hint">In ${Math.round(R.success * 100)}% of ${R.T.toLocaleString()} simulated futures, savings covered every year through ${esc(who)} turning ${ageLabel} (${A.endYear}).${failMed !== null ? ` When money ran out, it was usually around age ${failMed}.` : ''}</p>
        <p class="stale" id="stale" ${stale ? '' : 'hidden'}>Inputs changed. Run again to update.</p>
      </div>
    </div>
    <div id="missing"></div>
    <div class="kpis">
      <div class="kpi"><span>Savings at ${ageLabel}, typical</span><b>${money(last[2], 1)}</b></div>
      <div class="kpi"><span>Savings at ${ageLabel}, worst 10%</span><b>${money(last[0], 1)}</b></div>
      <div class="kpi"><span>Savings today</span><b>${money(t.liquid, 1)}</b></div>
      <div class="kpi"><span>Net worth at ${ageLabel}, typical</span><b>${money(lastNw[2], 1)}</b></div>
    </div>
    <div style="display:grid;gap:8px">
      <div class="row"><h3>Range of outcomes</h3><span class="spacer"></span>
        <div class="seg" role="group" aria-label="Chart measure">
          <button data-act="chart" data-mode="liq" aria-pressed="${chartMode === 'liq'}">Savings</button>
          <button data-act="chart" data-mode="nw" aria-pressed="${chartMode === 'nw'}">Net worth</button></div></div>
      <div id="chart"></div>
      <p class="hint">Today's dollars. The dark band holds the middle half of outcomes, the light band 80%, and the line is the median. "Savings" means cash plus all investment accounts.</p>
    </div>
    <div class="card" style="gap:10px">
      <h3>What if…</h3>
      <div class="slider"><label for="wi-spend">Budget spending</label><input id="wi-spend" type="range" min="-30" max="30" step="5" value="${num(state.whatif.spend)}"><output id="wi-spend-o">${num(state.whatif.spend) > 0 ? '+' : ''}${num(state.whatif.spend)}%</output></div>
      <div class="slider"><label for="wi-ret">Stock returns</label><input id="wi-ret" type="range" min="-3" max="2" step="0.5" value="${num(state.whatif.ret)}"><output id="wi-ret-o">${num(state.whatif.ret) > 0 ? '+' : ''}${num(state.whatif.ret)} pts</output></div>
      <p class="hint">Budget changes scale your itemized lines. Stock changes shift the average yearly return on stocks and the concentrated position. The simulation reruns when you let go.</p>
    </div>
    <div class="card" style="gap:10px">
      <div class="row"><h3>Compare remodel funding</h3><span class="spacer"></span><button class="btn small" data-act="compare" ${num(state.remodel.cost) > 0 ? '' : 'disabled'}>Compare</button></div>
      <div id="compare">${num(state.remodel.cost) > 0 ? '<p class="hint">Runs the same futures once without the remodel and once for each way to pay.</p>' : '<p class="hint">Enter a remodel cost on the Vehicles &amp; remodel tab first.</p>'}</div>
    </div>

    <p class="disclaimer">A planning model, not financial, tax or investment advice. Returns are random draws from the assumptions you set. Taxes use simplified effective rates. Real tax brackets, Social Security taxation, IRMAA surcharges and property sale gains aren't modeled. Review the results with a fiduciary planner or CPA before acting on them.</p>`;
  renderMissing(); drawChart(); if (compareRes) drawCompare();
}
function yearTable(R) {
  const A = R.A, rows = [];
  for (let t = 0; t < R.N; t++) {
    const Y = A.start + t;
    rows.push(`<tr><td class="mono">${Y}</td><td class="mono">${Y - A.b1}${A.hasP2 ? '/' + (Y - A.b2) : ''}</td><td class="n">${money(R.med.inc[t], 1)}</td><td class="n">${money(R.med.spd[t], 1)}</td><td class="n">${money(R.med.txs[t], 1)}</td><td class="n">${money(R.band.liq[t][2], 1)}</td><td class="n">${money(R.band.liq[t][0], 1)}</td><td class="n">${money(R.band.nw[t][2], 1)}</td></tr>`);
  }
  return `<table><thead><tr><th>Year</th><th>Ages</th><th class="n">Income</th><th class="n">Spending</th><th class="n">Taxes</th><th class="n">Savings</th><th class="n">Savings (worst 10%)</th><th class="n">Net worth</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function drawChart() {
  const R = lastRes, box = $('#chart'); if (!R || !box) return;
  const B = R.band[chartMode], N = R.N;
  const W = Math.max(300, Math.round(box.clientWidth || 380)), H = 250, m = { l: 52, r: 10, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let lo = Math.min(0, ...B.map(b => b[0])), hi = niceMax(Math.max(...B.map(b => b[4])));
  const x = t => m.l + (N === 1 ? iw / 2 : t / (N - 1) * iw), y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  const area = (a, b) => { let d = ''; for (let t = 0; t < N; t++) d += (t ? 'L' : 'M') + x(t).toFixed(1) + ',' + y(B[t][a]).toFixed(1); for (let t = N - 1; t >= 0; t--) d += 'L' + x(t).toFixed(1) + ',' + y(B[t][b]).toFixed(1); return d + 'Z'; };
  let line = ''; for (let t = 0; t < N; t++) line += (t ? 'L' : 'M') + x(t).toFixed(1) + ',' + y(B[t][2]).toFixed(1);
  let grid = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, yy = y(v); grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"></line><text x="${m.l - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${money(v, 1)}</text>`; }
  const A = R.A, step = N > 30 ? 10 : 5;
  for (let t = 0; t < N; t++) { const age = A.start + t - A.hb; if (age % step === 0 || t === 0 && N < 6) grid += `<text x="${x(t).toFixed(1)}" y="${H - 8}" text-anchor="middle">${age}</text>`; }
  const endV = B[N - 1][2];
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fan chart of ${chartMode === 'liq' ? 'savings' : 'net worth'} by age, median ending at ${money(endV, 1)}">
    ${grid}
    <path d="${area(0, 4)}" style="fill:var(--accent);fill-opacity:.16"></path>
    <path d="${area(1, 3)}" style="fill:var(--accent);fill-opacity:.32"></path>
    <path d="${line}" style="fill:none;stroke:var(--accent)" stroke-width="2"></path>
    <circle cx="${x(N - 1).toFixed(1)}" cy="${y(endV).toFixed(1)}" r="3.5" style="fill:var(--accent)"></circle>
    <text x="${m.l}" y="${H - 8}" text-anchor="start" style="fill:var(--muted)">${''}</text>
  </svg><div class="hint" style="text-align:right;margin-top:-4px">Age (${esc(R.A.hb === R.A.b1 ? state.household.p1Name : state.household.p2Name)})</div>`;
}
function compareRemodel() {
  const box = $('#compare'); if (!box) return;
  box.innerHTML = '<p class="hint">Running…</p>';
  setTimeout(() => {
    const trials = Math.min(num(state.assumptions.trials) || 2000, 2000);
    const opts = [['none', 'No remodel'], ['cash', 'Cash savings'], ['taxable', 'Taxable account'], ['deferred', 'SEP IRA'], ['roth', 'Roth IRA'], ['loan', 'Loan / HELOC']];
    const s2 = JSON.parse(JSON.stringify(state)); s2.remodel.on = true;
    compareRes = opts.map(([k, l]) => { const r = simulate(s2, { trials, remodel: k, spend: state.whatif.spend, ret: state.whatif.ret }); return { k, l, p: r.success, end: r.band.liq[r.N - 1][2], nw: r.band.nw[r.N - 1][2] }; });
    drawCompare();
  }, 20);
}
function drawCompare() {

  const cur = state.remodel.on ? state.remodel.source : 'none';
  box.innerHTML = `<div class="tw"><table class="cmp"><thead><tr><th>Pay with</th><th class="n">Success</th><th style="width:30%"></th><th class="n">Savings at ${num(state.household.horizonAge) || 95}</th></tr></thead><tbody>
    ${compareRes.map(c => `<tr><td>${esc(c.l)}${c.k === cur ? ' <span class="pill idle">current</span>' : ''}</td><td class="n mono">${pct(c.p)}</td>
      <td><div class="bar bg"><div class="bar" style="width:${(c.p * 100).toFixed(1)}%"></div></div></td><td class="n mono">${money(c.end, 1)}</td></tr>`).join('')}
    </tbody></table></div><p class="hint">${compareRes[0] ? '' : ''}Every row uses the same simulated markets, so the differences come only from the remodel and how it's paid for. Savings are median values in today's dollars.</p>`;
}
let wiTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'wi-spend' || e.target.id === 'wi-ret') {
    const k = e.target.id === 'wi-spend' ? 'spend' : 'ret', v = num(e.target.value);
    state.whatif[k] = v; $('#' + e.target.id + '-o').textContent = (v > 0 ? '+' : '') + v + (k === 'spend' ? '%' : ' pts');
    scheduleSave(); clearTimeout(wiTimer); wiTimer = setTimeout(runMain, 350);
  }
});
let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawChart, 150); });

/* ---------- boot ---------- */
renderTabs(); renderPanel(); runMain(); initCaps();
})();
