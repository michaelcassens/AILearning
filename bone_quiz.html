<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="University of Montana">
<meta name="description" content="Mobile-friendly bone image quiz: find or name the bones of the human skeleton and the skull, with a definition for every bone.">
<meta name="theme-color" content="#70002E">
<title>Skeleton &amp; Skull Bone Quiz</title>
<style>
  :root {
    --maroon: #70002E;
    --ink: #222222;
    --muted: #555555;
    --page: #f6f2e9;
    --panel: #ffffff;
    --line: #d9d1bf;
    --bone: #efe4cb;
    --bone-edge: #7d6b4f;
    --bone-dark: #3b3328;
    --wrong: #c62828;
    --ok-text: #1b5e20;
    --focus: #1565c0;
    /* group highlight colors (fill a bone when it's answered correctly) */
    --g-skull: #7e57c2;
    --g-spine: #ef6c00;
    --g-thorax: #d81b60;
    --g-shoulder: #00897b;
    --g-arm: #1e88e5;
    --g-pelvis: #8d5524;
    --g-leg: #43a047;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .skip-link {
    position: absolute; left: -9999px; top: 0;
    background: #fff; color: var(--maroon); padding: 8px 12px; z-index: 100;
  }
  .skip-link:focus { left: 8px; top: 8px; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header.top {
    background: var(--maroon); color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top));
  }
  header.top h1 { font-size: 1.1rem; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 12px; font-variant-numeric: tabular-nums; font-size: .95rem; }
  .stats span b { font-weight: 700; }
  .icon-btn {
    background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 40px;
  }
  .icon-btn:hover { background: rgba(255,255,255,.28); }

  .progress { height: 6px; background: #e4d9c3; }
  .progress > div { height: 100%; width: 0; background: var(--g-leg); transition: width .3s; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---------- skeleton figure ---------- */
  .figure-wrap { position: relative; flex: 1; min-height: 0; }
  #skeleton {
    width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  #skeleton.dragging { cursor: grabbing; }
  .zoom-ctrls {
    position: absolute; right: 10px; top: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-ctrls button {
    width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid var(--bone-edge); background: #fff; color: var(--ink);
    font-size: 1.3rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .zoom-ctrls button.small { font-size: .75rem; }
  .figure-hint {
    position: absolute; left: 10px; top: 10px; margin: 0; max-width: 34%;
    font-size: .8rem; color: var(--muted); background: rgba(246,242,233,.85);
    padding: 2px 6px; border-radius: 6px; pointer-events: none; transition: opacity .4s;
  }
  .figure-hint.gone { opacity: 0; }

  /* bone drawing */
  .bone { cursor: pointer; --bf: var(--bone); filter: url(#boneShade); }
  .bone .o { stroke: var(--bone-edge); fill: var(--bone-edge); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bone path.o[stroke-width] { fill: none; }
  .bone .s { stroke: var(--bf); fill: none; stroke-linecap: round; }
  .bone .f { fill: var(--bf); stroke: none; }
  .bone .hit { fill: transparent; stroke: none; }
  .bone:hover { --bf: #fbf3e2; }
  .bone:focus { outline: none; }
  .bone:focus-visible { filter: url(#boneShade) drop-shadow(0 0 2px #000) drop-shadow(0 0 4px var(--focus)); }
  .bone.found { --bf: var(--gc); }
  .bone.found:hover { --bf: var(--gc); }
  .bone.revealed { --bf: url(#revealPat); }
  .bone.wrong { --bf: var(--wrong); animation: shake .35s; }
  .bone.target { --bf: #ffe14d; animation: glow 1s ease-in-out infinite alternate; }
  .bone.selected { --bf: var(--gc); filter: url(#boneShade) drop-shadow(0 0 3px #000); }
  .bone.pop { animation: pop .5s; transform-box: fill-box; transform-origin: center; }
  .decor { pointer-events: none; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  @keyframes glow { from { filter: url(#boneShade) drop-shadow(0 0 1px #000); } to { filter: url(#boneShade) drop-shadow(0 0 6px #b8860b) drop-shadow(0 0 2px #000); } }
  @keyframes pop { 0%,100%{filter:url(#boneShade)} 40%{filter:url(#boneShade) brightness(1.3) drop-shadow(0 0 6px #fff)} }
  @media (prefers-reduced-motion: reduce) {
    .bone.wrong, .bone.target, .bone.pop { animation: none; }
    .progress > div { transition: none; }
  }

  /* ---------- question / info panel ---------- */
  .panel {
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    max-height: 46vh; overflow-y: auto;
    box-shadow: 0 -2px 8px rgba(0,0,0,.06);
  }
  .prompt-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .prompt-name { font-size: 1.5rem; margin: 2px 0 2px; color: var(--maroon); line-height: 1.2; }
  .aka { color: var(--muted); font-size: .9rem; margin: 0 0 4px; }
  .def { margin: 4px 0 0; }
  .meta { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
  .tip { font-size: .9rem; margin: 6px 0 0; padding: 6px 10px; background: #f6f2e9; border-left: 4px solid var(--g-spine); border-radius: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); display: inline-block; flex: none; }

  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn {
    min-height: 44px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--maroon); background: #fff; color: var(--maroon); font-weight: 600;
  }
  .btn:hover { background: #f7ecef; }
  .btn.primary { background: var(--maroon); color: #fff; }
  .btn.primary:hover { background: #5a0025; }
  .btn.grow { flex: 1; }

  .feedback { min-height: 1.5em; margin: 8px 0 0; font-weight: 600; }
  .feedback.ok { color: var(--ok-text); }
  .feedback.bad { color: var(--wrong); }
  .feedback.info { color: var(--muted); }
  .answer-card { border-radius: 12px; padding: 12px 14px; margin-top: 4px; border: 2px solid; }
  .answer-card.ok { border-color: var(--ok-text); background: #eef7ee; }
  .answer-card.missed { border-color: var(--wrong); background: #fdeeee; }
  .answer-title { margin: 0; font-size: 1.35rem; font-weight: 800; }
  .answer-card.ok .answer-title { color: var(--ok-text); }
  .answer-card.missed .answer-title { color: var(--wrong); }
  .answer-sub { margin: 4px 0 0; font-weight: 600; }
  .answer-card .def { margin-top: 6px; }
  .btn.next { width: 100%; margin: 10px 0 4px; font-size: 1.1rem; min-height: 52px; }
  .q-enter { animation: qIn .35s ease-out; }
  @keyframes qIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .q-enter { animation: none; } }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; list-style: none; margin: 8px 0 0; padding: 0; font-size: .85rem; color: var(--muted); }
  .key li { display: inline-flex; align-items: center; gap: 6px; }
  .key .sw-found { background: linear-gradient(90deg, var(--g-arm) 0 33%, var(--g-leg) 33% 66%, var(--g-skull) 66%); }
  .key .sw-missed { background: repeating-linear-gradient(45deg, #c62828 0 3px, #ffe3e3 3px 6px); }
  .key .sw-target { background: #ffe14d; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .choice {
    min-height: 48px; padding: 8px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--line); background: #fff; color: var(--ink); font-weight: 600;
  }
  .choice:hover { border-color: var(--maroon); }
  .choice[aria-disabled="true"] { border-color: var(--wrong); color: var(--wrong); text-decoration: line-through; cursor: default; }
  .choice.correct { border-color: var(--ok-text); color: #fff; background: var(--ok-text); }

  .def-toggle { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .9rem; }
  .def-toggle input { width: 20px; height: 20px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 10px 0 0; padding: 0; list-style: none; }

  .glossary h2 { font-size: 1.05rem; margin: 14px 0 6px; }
  .glossary ul { list-style: none; margin: 0; padding: 0; }
  .glossary li button {
    display: flex; width: 100%; text-align: left; gap: 8px; align-items: flex-start;
    padding: 8px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; color: var(--ink);
  }
  .glossary li button:hover { background: #faf6ee; }
  .glossary li button .swatch { margin-top: 5px; }
  .glossary small { display: block; color: var(--muted); font-size: .85rem; }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(40,20,25,.55); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: #fff; border-radius: 16px; width: 100%; max-width: 520px;
    max-height: calc(100dvh - 32px); overflow-y: auto; padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .card h2 { margin: 0 0 4px; color: var(--maroon); }
  .card p.lead { margin: 0 0 14px; color: var(--muted); }
  fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px; padding: 8px 12px 12px; }
  legend { font-weight: 700; padding: 0 4px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; cursor: pointer; border-radius: 8px; }
  .opt:hover { background: #faf6ee; }
  .opt input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  .opt small { display: block; color: var(--muted); }
  .sticky-actions {
    position: sticky; bottom: -20px; background: #fff;
    margin: 0 -20px -20px; padding: 12px 20px 20px; border-top: 1px solid var(--line);
  }
  .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
  .result-grid div { background: var(--page); border-radius: 10px; padding: 10px; text-align: center; }
  .result-grid b { display: block; font-size: 1.5rem; color: var(--maroon); }
  .review { list-style: none; padding: 0; margin: 8px 0 0; }
  .review li { border-top: 1px solid var(--line); padding: 8px 0; }
  .review li strong { color: var(--maroon); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- wider screens: figure left, panel right ---------- */
  @media (min-width: 820px) {
    main { flex-direction: row; }
    .panel { width: 400px; max-height: none; border-top: 0; border-left: 1px solid var(--line); box-shadow: none; }
    .prompt-name { font-size: 1.8rem; }
  }
  @media (max-width: 819px) {
    .panel { height: 42vh; max-height: none; flex: none; padding: 10px 14px; } /* fixed so the diagram doesn't jump between questions */
    .prompt-name { font-size: 1.3rem; }
    .def { font-size: .95rem; }
    .actions { margin-top: 8px; }
  }
  @media (max-width: 420px) {
    header.top h1 { font-size: 1rem; }
    .card { padding: 16px; }
    .sticky-actions { bottom: -16px; margin: 0 -16px -16px; padding: 12px 16px 16px; }
    .opt { padding: 6px 4px; }
    .stats { gap: 8px; font-size: .85rem; }
    .stats .hide-sm { display: none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#panel">Skip to quiz question</a>
<div class="app">
  <header class="top">
    <h1 id="appTitle">Skeleton Bone Quiz</h1>
    <div class="stats" aria-label="Quiz status">
      <span><span class="sr-only">Found </span><b id="statScore">0</b>/<span id="statTotal">0</span></span>
      <span class="hide-sm" aria-label="Elapsed time">&#9201; <b id="statTime">0:00</b></span>
    </div>
    <button class="icon-btn" id="menuBtn" type="button">Menu</button>
  </header>
  <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

  <main>
    <div class="figure-wrap">
      <svg id="skeleton" viewBox="0 0 400 920" preserveAspectRatio="xMidYMid meet" role="img"
           aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Front view of the human skeleton</title>
        <desc id="svgDesc">Diagram of the human skeleton seen from the front. Each bone region can be selected; use Tab to move between regions and Enter to choose one. The Name the Bone mode can be played entirely with buttons.</desc>
        <defs>
          <!-- soft lighting so bones look rounded; works with any highlight color -->
          <filter id="boneShade" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="bump"/>
            <feDiffuseLighting in="bump" surfaceScale="2.2" diffuseConstant="1" lighting-color="#ffffff" result="diff">
              <feDistantLight azimuth="235" elevation="50"/>
            </feDiffuseLighting>
            <feSpecularLighting in="bump" surfaceScale="2.2" specularConstant=".5" specularExponent="20" lighting-color="#ffffff" result="spec">
              <feDistantLight azimuth="235" elevation="50"/>
            </feSpecularLighting>
            <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1=".75" k2=".35" result="lit"/>
            <feComposite in="spec" in2="SourceAlpha" operator="in" result="shine"/>
            <feComposite in="lit" in2="shine" operator="arithmetic" k2="1" k3=".6" result="final"/>
            <feComposite in="final" in2="SourceAlpha" operator="in"/>
          </filter>
          <pattern id="revealPat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="#ffe3e3"/>
            <rect width="3" height="6" fill="#c62828"/>
          </pattern>
        </defs>
        <g id="underlay" class="decor"></g>
        <g id="bones"></g>
        <g id="decor" class="decor"></g>
      </svg>
      <div class="zoom-ctrls">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zoomReset" class="small" aria-label="Reset zoom">Fit</button>
      </div>
      <p class="figure-hint">Pinch or scroll to zoom &middot; drag to move</p>
    </div>

    <section class="panel" id="panel" tabindex="-1" aria-label="Question">
      <div id="panelBody"></div>
    </section>
  </main>
</div>

<!-- Start menu -->
<div class="overlay" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <form class="card" id="menuForm">
    <h2 id="menuTitle">Bone Quiz</h2>
    <p class="lead">Learn the bones of the human skeleton and skull. Every label comes with a definition, and correct bones light up in color.</p>
    <fieldset>
      <legend>Diagram</legend>
      <label class="opt"><input type="radio" name="diagram" value="skeleton" checked>
        <span>Full skeleton<small>Front view &mdash; 27 major bones</small></span></label>
      <label class="opt"><input type="radio" name="diagram" value="skull">
        <span>Skull<small>Front (anterior) view &mdash; all 12 bones you can see from the front</small></span></label>
    </fieldset>
    <fieldset>
      <legend>Game mode</legend>
      <label class="opt"><input type="radio" name="mode" value="find" checked>
        <span>Find the bone<small>You get a name &mdash; tap that bone on the skeleton.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="name">
        <span>Name the bone<small>A bone glows yellow &mdash; pick its name from 4 choices.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="study">
        <span>Study<small>No score. Tap any bone (or the list) to read its definition.</small></span></label>
    </fieldset>
    <fieldset>
      <legend>Bones to include</legend>
      <div id="setOptions"></div>
    </fieldset>
    <label class="opt"><input type="checkbox" name="showDef">
      <span>Show hints with each question<small>Adds the bone&rsquo;s nickname and definition to each question. Either way, you see the full definition after you answer.</small></span></label>
    <div class="actions sticky-actions">
      <button type="submit" class="btn primary grow">Start</button>
      <button type="button" class="btn" id="menuClose" hidden>Resume</button>
    </div>
  </form>
</div>

<!-- Results -->
<div class="overlay" id="results" role="dialog" aria-modal="true" aria-labelledby="resultsTitle" hidden>
  <div class="card">
    <h2 id="resultsTitle">Quiz complete!</h2>
    <p class="lead" id="resultsLead"></p>
    <div class="result-grid" id="resultsGrid"></div>
    <div id="reviewWrap"></div>
    <div class="actions">
      <button type="button" class="btn primary grow" id="retryMissed">Practice missed bones</button>
      <button type="button" class="btn grow" id="playAgain">Play again</button>
      <button type="button" class="btn grow" id="toMenu">Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Bone data. Drawing is a front (anterior) view in a 400 x 920 box.
  // Shapes: ['s', path, width] stroked bone, ['f', path] filled shape,
  //         ['e', cx, cy, rx, ry] ellipse,
  //         ['hit', cx, cy, rx, ry] invisible extra tap area for small bones.
  // Paths use absolute "x,y" pairs so paired bones can be mirrored across x = 200.
  // ---------------------------------------------------------------------------
  const SKELETON_GROUPS = {
    skull:    { label: 'Skull',               color: 'var(--g-skull)' },
    spine:    { label: 'Vertebral column',    color: 'var(--g-spine)' },
    thorax:   { label: 'Thorax (chest)',      color: 'var(--g-thorax)' },
    shoulder: { label: 'Shoulder girdle',     color: 'var(--g-shoulder)' },
    arm:      { label: 'Arm & hand',          color: 'var(--g-arm)' },
    pelvis:   { label: 'Pelvic girdle',       color: 'var(--g-pelvis)' },
    leg:      { label: 'Leg & foot',          color: 'var(--g-leg)' }
  };

  const fx = n => +n.toFixed(1);

  // Smooth long-bone outline from (x1,y1) to (x2,y2): rounded, knobby ends
  // (half-widths a at the top, b at the bottom) joined by a slimmer shaft (s).
  // notch = small dip between the two condyles at the lower end.
  const longBone = (x1, y1, x2, y2, a, s, b, notch = false) => {
    const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    const P = (v, u) => `${fx(x1 + ux * u - uy * v)},${fx(y1 + uy * u + ux * v)}`;
    const t1 = Math.max(a * 0.6 + 0.5, Math.min(L * 0.3, a * 2.1));
    const t2 = Math.max(b * 0.6 + 0.5, Math.min(L * 0.3, b * 2.1));
    const m1 = t1 + (L - t1 - t2) * 0.35, m2 = L - t2 - (L - t1 - t2) * 0.35;
    const side = k => [
      `C${P(k * a, (a * 0.6 + t1) / 2)} ${P(k * s * 1.1, t1 * 0.85)} ${P(k * s, t1)}`,
      `C${P(k * s * 0.9, m1)} ${P(k * s * 0.9, m2)} ${P(k * s, L - t2)}`,
      `C${P(k * s * 1.1, L - t2 * 0.85)} ${P(k * b, (L - b * 0.6 + L - t2) / 2)} ${P(k * b, L - b * 0.6)}`
    ];
    const [r1, r2, r3] = side(1);
    const bottom = notch
      ? `C${P(b, L + b * 0.5)} ${P(b * 0.3, L + b * 0.5)} ${P(0, L + b * 0.12)} C${P(-b * 0.3, L + b * 0.5)} ${P(-b, L + b * 0.5)} ${P(-b, L - b * 0.6)}`
      : `C${P(b, L + b * 0.4)} ${P(-b, L + b * 0.4)} ${P(-b, L - b * 0.6)}`;
    return [
      `M${P(-a, a * 0.6)}`, `C${P(-a, -a * 0.4)} ${P(a, -a * 0.4)} ${P(a, a * 0.6)}`,
      r1, r2, r3, bottom,
      // back up the other side
      `C${P(-b, (L - b * 0.6 + L - t2) / 2)} ${P(-s * 1.1, L - t2 * 0.85)} ${P(-s, L - t2)}`,
      `C${P(-s * 0.9, m2)} ${P(-s * 0.9, m1)} ${P(-s, t1)}`,
      `C${P(-s * 1.1, t1 * 0.85)} ${P(-a, (a * 0.6 + t1) / 2)} ${P(-a, a * 0.6)} Z`
    ].join(' ');
  };

  // A vertebra seen from the front: rounded body with a small process on each side.
  // cx = center, y = top, bw = body half-width, h = height, pw = half-width across the processes.
  const vertebra = (cx, y, bw, h, pw) => {
    const Q = (dx, dy) => `${fx(cx + dx)},${fx(y + dy)}`;
    return `M${Q(-bw + 1.5, 0)} L${Q(bw - 1.5, 0)} Q${Q(bw, 0)} ${Q(bw, h * 0.2)} ` +
      `C${Q(pw - 1, h * 0.05)} ${Q(pw, h * 0.25)} ${Q(pw, h * 0.35)} C${Q(pw, h * 0.55)} ${Q(bw + 1, h * 0.5)} ${Q(bw, h * 0.6)} ` +

    { id: 'vomer', name: 'Vomer', aka: 'Lower nasal septum', group: 'facial', region: 'facial', count: '1',
      color: '#c0ca33',
      def: 'A thin, flat bone that forms the lower and back part of the nasal septum, the wall that divides the nasal cavity into left and right sides.',
      tip: '“Vomer” is Latin for plowshare — it is shaped like the blade of a plow.',
      shapes: [['f', 'M196,259 C198,257 202,257 204,259 L206,293 C204,297 196,297 194,293 Z']] },
    { id: 'concha', name: 'Inferior nasal concha', aka: 'Lower turbinate', group: 'facial', region: 'facial', paired: true, count: '2',
      color: '#546e7a',
      def: 'Two curled, scroll-shaped bones on the side walls of the nasal cavity. They swirl, warm and moisten the air you breathe in. Unlike the upper and middle conchae (part of the ethmoid), each one is a separate bone.',
      tip: 'Concha means “shell” — they look like curled seashells.',
      shapes: [['f', 'M207,262 C216,258 226,264 226,276 C222,282 213,282 207,278 C205,272 205,266 207,262 Z']] },
    { id: 'lacrimal', name: 'Lacrimal bone', aka: 'Tear-duct bone', group: 'facial', region: 'facial', paired: true, count: '2',
      color: '#9ccc65',
      def: 'The smallest and most fragile bones of the face, in the inner (medial) wall of each eye socket. A groove in each holds the tear sac, which drains tears down into the nose.',
      tip: '“Lacrima” is Latin for tear.',
      shapes: [['f', 'M224,214 C230,218 236,220 240,220 C240,228 236,234 230,237 C226,232 224,224 224,214 Z']] }
  ];

  // Non-interactive details for each diagram.
  const DARK = { fill: '#3b3328', opacity: '.88' };
  // A row of teeth along a gentle arch: outer teeth sit a little higher and are shorter.
  const teethRow = (layer, x0, n, step, w, top, h, bend = 0) => {
    for (let i = 0; i < n; i++) {
      const k = ((i - (n - 1) / 2) / ((n - 1) / 2)) ** 2;
      layer.append(el('rect', { x: x0 + i * step, y: top - bend * k, width: w, height: h - 2 * k, rx: w * 0.35,
        fill: '#fbf8f0', stroke: '#8a7a5e', 'stroke-width': .5 }));
    }
  };
  function skeletonDetails(under, decor) {
    const orbit = 'M171,79 C171,70 192,68 195,76 C197,84 196,94 187,96 C178,98 171,93 171,86 Z';
    [orbit, mirrorPath(orbit), 'M200,91 C196,95 193,104 194,110 C196,113 204,113 206,110 C207,104 204,95 200,91 Z']
      .forEach(d => decor.append(el('path', { d, ...DARK })));
    [[175, 471], [225, 471]].forEach(([cx, cy]) => decor.append(el('ellipse', { cx, cy, rx: 8, ry: 6, ...DARK })));
    [410, 421, 432].forEach(y => [194.5, 205.5].forEach(cx =>
      decor.append(el('circle', { cx, cy: y, r: 1.7, fill: '#3b3328', opacity: '.55' }))));
    teethRow(decor, 182.5, 8, 4.5, 4, 119.5, 7);
    teethRow(decor, 182.5, 8, 4.5, 4, 129, 6);
  }
  function skullDetails(under, decor) {
    // dark backdrop shows through the eye sockets, nasal cavity and gaps
    under.append(el('path', { d: 'M200,22 C262,22 318,52 338,108 C348,140 348,200 344,250 L334,284 L326,350 L200,368 L74,350 L66,284 L56,250 C52,200 52,140 62,108 C82,52 138,22 200,22 Z', fill: '#4a3d2f' }));
    // optic canal, superior orbital fissure, supraorbital, infraorbital and mental foramina
    const fissure = 'M262,194 C272,186 286,186 294,194 C284,197 272,198 262,194 Z';
    [fissure, mirrorPath(fissure)].forEach(d => decor.append(el('path', { d, ...DARK })));
    [[254, 188, 3.5], [248, 151, 2.4], [250, 262, 3.5], [246, 392, 3.5]].forEach(([cx, cy, r]) =>
      [cx, 400 - cx].forEach(x => decor.append(el('circle', { cx: x, cy, r, ...DARK }))));
    teethRow(decor, 132.4, 16, 8.5, 7.6, 347, 15, 3);
    teethRow(decor, 136.4, 16, 8, 7.2, 363, 14, 3);
  }

  const DIAGRAMS = {
    skeleton: {
      title: 'Skeleton Bone Quiz', box: { w: 400, h: 920 }, legend: true,
      svgTitle: 'Front view of the human skeleton',
      svgDesc: 'Diagram of the human skeleton seen from the front.',
      groups: SKELETON_GROUPS, bones: SKELETON_BONES, details: skeletonDetails,
      sets: [
        { key: 'all', label: 'Whole skeleton', note: n => `All ${n} labels` },
        { key: 'axial', label: 'Skull & trunk', note: n => `Axial skeleton — ${n} labels`, filter: b => b.region === 'axial' },
        { key: 'upper', label: 'Shoulders, arms & hands', note: n => `${n} labels`, filter: b => b.region === 'upper' },
        { key: 'lower', label: 'Hips, legs & feet', note: n => `${n} labels`, filter: b => b.region === 'lower' },
        { key: 'quick', label: 'Quick 10', note: () => '10 random bones', random: 10 }
      ]
    },
    skull: {
      title: 'Skull Bone Quiz', box: { w: 400, h: 440 }, legend: false,
      svgTitle: 'Front (anterior) view of the human skull',
      svgDesc: 'Diagram of the human skull seen from the front, showing the 12 bones visible from that side.',
      groups: SKULL_GROUPS, bones: SKULL_BONES, details: skullDetails,
      sets: [
        { key: 'all', label: 'All skull bones', note: n => `All ${n} bones visible from the front (the occipital bone is at the back)` },
        { key: 'cranial', label: 'Cranial bones', note: n => `The braincase — ${n} bones`, filter: b => b.region === 'cranial' },
        { key: 'facial', label: 'Facial bones', note: n => `${n} bones`, filter: b => b.region === 'facial' }
      ]
    }
  };

  // The active diagram; loadDiagram() fills these in.
  let D, DKEY, GROUPS, BONES, BY_ID, SETS, GLOSSARY_ORDER;

  // ---------------------------------------------------------------------------
  // Render the active diagram
  // ---------------------------------------------------------------------------
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('skeleton');
  const bonesLayer = document.getElementById('bones');
  const decorLayer = document.getElementById('decor');
  const underLayer = document.getElementById('underlay');
  let boneEls = {};

  const mirrorPath = d => d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (_, x, y) => `${+(400 - x).toFixed(1)},${y}`);
  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  // pass 'o' draws the dark outline, pass 'b' the bone fill on top of it.
  function drawShape(g, s, mirror, pass) {
    const mx = x => mirror ? 400 - x : x;
    const [type] = s;
    const cls = pass === 'o' ? 'o' : 'f';
    if (type === 's') {
      const d = mirror ? mirrorPath(s[1]) : s[1];
      g.append(el('path', pass === 'o' ? { d, class: 'o', 'stroke-width': s[2] + 1.8 } : { d, class: 's', 'stroke-width': s[2] }));
    } else if (type === 'f') {
      g.append(el('path', { d: mirror ? mirrorPath(s[1]) : s[1], class: cls }));
    } else if (type === 'e') {
      g.append(el('ellipse', { cx: mx(s[1]), cy: s[2], rx: s[3], ry: s[4], class: cls }));
    } else if (type === 'hit' && pass === 'b') {
      g.append(el('ellipse', { cx: mx(s[1]), cy: s[2], rx: s[3], ry: s[4], class: 'hit' }));
    }
  }

  function renderDiagram() {
    raised = null; // any bone brought to the front belongs to the old drawing
    bonesLayer.replaceChildren(); decorLayer.replaceChildren(); underLayer.replaceChildren();
    boneEls = {};
    BONES.forEach((b, i) => {
      const g = el('g', { class: 'bone', 'data-bone': b.id, tabindex: '0', role: 'button', 'aria-label': `Bone region ${i + 1}` });
      g.style.setProperty('--gc', boneColor(b));
      const shapes = b.paired ? [...b.shapes.map(s => [s, false]), ...b.shapes.map(s => [s, true])] : b.shapes.map(s => [s, false]);
      if (b.separate) {
        // small separate bones (vertebrae, wrist, ankle) keep their own outlines
        shapes.forEach(([s, m]) => { drawShape(g, s, m, 'o'); drawShape(g, s, m, 'b'); });
      } else {
        shapes.forEach(([s, m]) => drawShape(g, s, m, 'o'));
        shapes.forEach(([s, m]) => drawShape(g, s, m, 'b'));
      }
      bonesLayer.append(g);
      boneEls[b.id] = g;
    });
    D.details(underLayer, decorLayer);
  }
  const boneColor = b => b.color || GROUPS[b.group].color;

  // ---------------------------------------------------------------------------
  // Pan & zoom (touch, mouse, wheel, buttons)
  // ---------------------------------------------------------------------------
  let BASE = { x: 0, y: 0, w: 400, h: 920 };
  let vb = { ...BASE };
  const applyVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);

  function clientToSvg(cx, cy) {
    const pt = svg.createSVGPoint();
    pt.x = cx; pt.y = cy;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function zoomAt(factor, p) {
    const w = Math.min(BASE.w, Math.max(BASE.w / 8, vb.w / factor));
    const k = w / vb.w;
    vb.x = p.x - (p.x - vb.x) * k;
    vb.y = p.y - (p.y - vb.y) * k;
    vb.w = w; vb.h = w * BASE.h / BASE.w;
    clampVB(); applyVB();
  }
  function clampVB() {
    const padX = vb.w * 0.5, padY = vb.h * 0.5;
    vb.x = Math.min(BASE.w - vb.w + padX, Math.max(-padX, vb.x));
    vb.y = Math.min(BASE.h - vb.h + padY, Math.max(-padY, vb.y));
    if (vb.w >= BASE.w) { vb.x = 0; vb.y = 0; }
  }
  const centerPt = () => ({ x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  document.getElementById('zoomIn').onclick = () => zoomAt(1.5, centerPt());
  document.getElementById('zoomOut').onclick = () => zoomAt(1 / 1.5, centerPt());
  document.getElementById('zoomReset').onclick = () => { vb = { ...BASE }; applyVB(); };

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, clientToSvg(e.clientX, e.clientY));
  }, { passive: false });

  const pointers = new Map();
  let tapStart = null, moved = false, pinchDist = 0;

  svg.addEventListener('pointerdown', e => {
    document.querySelector('.figure-hint').classList.add('gone');
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    svg.setPointerCapture(e.pointerId);
    if (pointers.size === 1) {
      tapStart = { x: e.clientX, y: e.clientY, target: e.target };
      moved = false;
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      moved = true;
    }
  });
  svg.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (pointers.size === 1) {
      if (!moved && Math.hypot(cur.x - tapStart.x, cur.y - tapStart.y) > 8) { moved = true; svg.classList.add('dragging'); }
      if (moved) {
        const rect = svg.getBoundingClientRect();
        const scale = Math.max(vb.w / rect.width, vb.h / rect.height);
        vb.x -= (cur.x - prev.x) * scale;
        vb.y -= (cur.y - prev.y) * scale;
        clampVB(); applyVB();
      }
    }
    pointers.set(e.pointerId, cur);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) zoomAt(d / pinchDist, clientToSvg((a.x + b.x) / 2, (a.y + b.y) / 2));
      pinchDist = d;
    }
  });
  const endPointer = e => {
    if (!pointers.has(e.pointerId)) return;
    const wasSingle = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (e.type === 'pointerup' && wasSingle && !moved && tapStart) {
      const g = tapStart.target.closest && tapStart.target.closest('.bone');
      if (g) onBoneChosen(g.dataset.bone);
    }
    if (pointers.size === 0) { tapStart = null; svg.classList.remove('dragging'); }
  };
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  bonesLayer.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('bone')) {
      e.preventDefault();
      onBoneChosen(e.target.dataset.bone);
    }
  });

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const panelBody = $('panelBody');
  const S = {
    mode: 'find', setKey: 'all', showDef: true, ids: [], queue: [], current: null,
    attempts: 0, results: {}, skips: 0, clicks: 0, goodClicks: 0,
    start: 0, elapsed: 0, timer: null, running: false, lastFeedback: null
  };

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function resetBoneClasses() {
    Object.values(boneEls).forEach(g => g.classList.remove('found', 'revealed', 'wrong', 'target', 'selected', 'pop'));
    restoreRaised();
  }

  // In "name" mode, bring the glowing bone to the front so bones hidden
  // behind others (scapula, thoracic vertebrae) are visible.
  let raised = null;
  function raise(id) {
    restoreRaised();
    const g = boneEls[id];
    raised = { g, next: g.nextSibling };
    bonesLayer.append(g);
  }
  function restoreRaised() {
    if (!raised) return;
    bonesLayer.insertBefore(raised.g, raised.next);
    raised = null;
  }

  function startGame(mode, setKey, showDef, idsOverride) {
    S.mode = mode; S.setKey = setKey; S.showDef = showDef;
    S.ids = idsOverride ? [...idsOverride]
      : [...SETS[setKey]];
    S.queue = shuffle([...S.ids]);
    S.results = {}; S.skips = 0; S.clicks = 0; S.goodClicks = 0; S.attempts = 0;
    S.lastFeedback = null; S.current = null;
    resetBoneClasses();
    clearInterval(S.timer);
    S.elapsed = 0; S.start = Date.now(); S.running = mode !== 'study';
    if (S.running) S.timer = setInterval(tick, 500);
    tick();
    $('statTotal').textContent = S.ids.length;
    // Dim bones outside the chosen set so it's clear which ones count.
    Object.entries(boneEls).forEach(([id, g]) => {
      g.style.opacity = (mode === 'study' || S.ids.includes(id)) ? '' : '.35';
    });
    if (mode === 'study') renderStudy(null);
    else nextQuestion();
    updateStats();
  }

  function tick() {
    if (S.running) S.elapsed = Date.now() - S.start;
    $('statTime').textContent = fmtTime(S.elapsed);
  }

  function updateStats() {
    const done = Object.values(S.results).filter(r => r === 'correct').length;
    $('statScore').textContent = S.mode === 'study' ? '–' : done;
    const finished = Object.keys(S.results).length;
    $('progressBar').style.width = S.ids.length ? `${(finished / S.ids.length) * 100}%` : '0';
  }

  function nextQuestion() {
    restoreRaised();
    Object.values(boneEls).forEach(g => g.classList.remove('target'));
    S.current = S.queue.length ? S.queue[0] : null;
    S.attempts = 0;
    if (!S.current) return finish();
    if (S.mode === 'name') {
      boneEls[S.current].classList.add('target');
      raise(S.current);
      S.choices = shuffle([S.current, ...shuffle(S.ids.filter(id => id !== S.current)).slice(0, 3)]);
      if (S.choices.length < 4) {
        const extra = shuffle(SETS.all.filter(id => !S.choices.includes(id)));
        S.choices = shuffle([...S.choices, ...extra.slice(0, 4 - S.choices.length)]);
      }
      S.wrongChoices = [];
    }
    renderQuestion();
  }

  // ---------------------------------------------------------------------------
  // Panel rendering
  // ---------------------------------------------------------------------------
  function boneInfoHTML(b, { heading = 'h2', showTip = true } = {}) {
    const grp = GROUPS[b.group];
    const count = DKEY === 'skull' ? `How many in the skull: ${esc(b.count)}` : `How many in the body: ${esc(b.count)}`;
    return `
      <${heading} class="prompt-name">${esc(b.name)}</${heading}>
      <p class="aka">${esc(b.aka)}</p>
      <p class="def">${esc(b.def)}</p>
      <p class="meta"><span class="chip"><span class="swatch" style="background:${boneColor(b)}"></span>${esc(grp.label)}</span>
        &middot; ${count}</p>
      ${showTip && b.tip ? `<p class="tip"><strong>Memory tip:</strong> ${esc(b.tip)}</p>` : ''}`;
  }

  function feedbackHTML() {
    const f = S.lastFeedback;
    return `<p class="feedback ${f ? f.kind : ''}" id="feedback" role="status" aria-live="polite">${f ? f.html : ''}</p>`;
  }

  function renderQuestion() {
    const b = BY_ID[S.current];
    const qNum = Object.keys(S.results).length + 1;
    let html = '';
    const actions = `<div class="actions">
        <button type="button" class="btn grow" id="skipBtn">Skip &#8631;</button>
        <button type="button" class="btn grow" id="revealBtn">Show me</button>
      </div>
      <ul class="key" aria-label="What the colors on the diagram mean">
        <li><span class="swatch sw-found"></span>Solid color = you found it</li>
        <li><span class="swatch sw-missed"></span>Red stripes = missed (shown to you)</li>
        ${S.mode === 'name' ? '<li><span class="swatch sw-target"></span>Yellow glow = bone to name</li>' : ''}
      </ul>`;
    if (S.mode === 'find') {
      html += `<div class="q-enter"><p class="prompt-label">Question ${qNum} of ${S.ids.length} &middot; Find this bone</p>`;
      html += `<h2 class="prompt-name">${esc(b.name)}</h2></div>`;
      if (S.showDef) html += `<p class="aka">${esc(b.aka)}</p>`;
      html += feedbackHTML() + actions;
      if (S.showDef) html += `<p class="def">${esc(b.def)}</p>`;
    } else {
      // hide the answer word (and its plural/other endings) inside the clue
      const stem = b.name.split(' ')[0].replace(/s$/, '');
      const clue = b.def.replace(new RegExp(`\\b${stem}\\w*`, 'gi'), '____');
      html += `<p class="prompt-label q-enter">Question ${qNum} of ${S.ids.length} &middot; Name the glowing bone</p>`;
      html += `<div class="choices" role="group" aria-label="Answer choices">${S.choices.map(id =>
        `<button type="button" class="choice" data-choice="${id}" ${S.wrongChoices.includes(id) ? 'aria-disabled="true"' : ''}>${esc(BY_ID[id].name)}</button>`
      ).join('')}</div>`;
      html += feedbackHTML() + actions;
      if (S.showDef) html += `<p class="def"><strong>Clue:</strong> ${esc(clue)}</p>`;
    }
    panelBody.innerHTML = html;
    $('panel').scrollTop = 0;
    $('skipBtn').onclick = skip;
    $('revealBtn').onclick = () => reveal(false);
    panelBody.querySelectorAll('[data-choice]').forEach(btn => btn.onclick = () => onChoice(btn.dataset.choice, btn));
  }

  function setFeedback(kind, html) {
    S.lastFeedback = { kind, html };
    const f = $('feedback');
    if (f) { f.className = `feedback ${kind}`; f.innerHTML = html; }
  }

  // ---------------------------------------------------------------------------
  // Answering
  // ---------------------------------------------------------------------------
  function onBoneChosen(id) {
    if (S.mode === 'study') return renderStudy(id);
    if (!S.current) return;
    const b = BY_ID[id];
    if (S.mode === 'name') {
      // tapping on the figure in name mode just tells you what's already known
      if (S.results[id]) setFeedback('info', `That one is the ${esc(b.name)}.`);
      return;
    }
    if (S.results[id]) {
      setFeedback('info', `Already done: ${esc(b.name)}. Keep looking for the ${esc(BY_ID[S.current].name)}.`);
      return;
    }
    S.clicks++;
    if (id === S.current) {
      S.goodClicks++;
      markCorrect(id);
    } else {
      S.attempts++;
      flashWrong(id);
      if (S.attempts >= 3) {
        reveal(true);
      } else {
        setFeedback('bad', `&#10007; Not quite. Try again (${3 - S.attempts} ${3 - S.attempts === 1 ? 'try' : 'tries'} left), or skip it.`);
      }
    }
  }

  function onChoice(id, btn) {
    if (!S.current || btn.getAttribute('aria-disabled') === 'true') return;
    S.clicks++;
    if (id === S.current) {
      S.goodClicks++;
      markCorrect(id);
    } else {
      S.attempts++;
      S.wrongChoices.push(id);
      btn.setAttribute('aria-disabled', 'true');
      if (S.attempts >= 2) reveal(true);
      else setFeedback('bad', `&#10007; Not the ${esc(BY_ID[id].name)}. One more try, or skip it.`);
    }
  }

  function flashWrong(id) {
    const g = boneEls[id];
    g.classList.remove('wrong'); void g.getBBox(); g.classList.add('wrong');
    setTimeout(() => g.classList.remove('wrong'), 650);
  }

  function markCorrect(id) {
    const b = BY_ID[id];
    S.results[id] = 'correct';
    const g = boneEls[id];
    g.classList.remove('target');
    g.classList.add('found', 'pop');
    setTimeout(() => g.classList.remove('pop'), 600);
    S.queue.shift();
    updateStats();
    showAnswer(id, 'correct');
  }

  function reveal(auto) {
    const id = S.current;
    if (!id) return;
    const b = BY_ID[id];
    S.results[id] = 'revealed';
    boneEls[id].classList.remove('target');
    boneEls[id].classList.add('revealed');
    S.queue.shift();
    updateStats();
    showAnswer(id, auto ? 'out' : 'shown');
  }

  // After an answer: say whether it was right, explain the bone, and wait
  // for "Next question" so it's obvious when a new question starts.
  // "Thigh bone" -> "thigh bone", but leave "T1–T12" and "C1–C7 (neck)" alone
  const akaInline = aka => /^[A-Z][a-z]/.test(aka) ? aka[0].toLowerCase() + aka.slice(1) : aka;

  function showAnswer(id, outcome) {
    const b = BY_ID[id];
    const ok = outcome === 'correct';
    S.current = null;
    S.lastFeedback = null;
    if (S.running) { S.elapsed = Date.now() - S.start; S.running = false; } // pause the clock while reading
    const title = ok ? '&#10003; That’s correct!' : outcome === 'out' ? '&#10007; Not quite' : 'Here’s the answer';
    const sub = ok
      ? `${S.attempts ? 'You found' : 'First try! You found'} the <strong>${esc(b.name)}</strong> — ${esc(akaInline(b.aka))}.`
      : `This is the <strong>${esc(b.name)}</strong> — ${esc(akaInline(b.aka))}. It’s shown in red stripes and added to your review list.`;
    const last = S.queue.length === 0;
    panelBody.innerHTML = `
      <div class="answer-card ${ok ? 'ok' : 'missed'} q-enter" role="status" aria-live="polite">
        <p class="answer-title">${title}</p>
        <p class="answer-sub">${sub}</p>
        <button type="button" class="btn primary next" id="nextBtn">${last ? 'See my results' : 'Next question'} &rarr;</button>
        <p class="def">${esc(b.def)}</p>
        ${b.tip ? `<p class="tip"><strong>Memory tip:</strong> ${esc(b.tip)}</p>` : ''}
      </div>`;
    $('panel').scrollTop = 0;
    $('nextBtn').onclick = () => {
      S.running = true; S.start = Date.now() - S.elapsed;
      nextQuestion();
    };
    $('nextBtn').focus({ preventScroll: true });
  }

  function skip() {
    if (!S.current) return;
    S.skips++;
    const id = S.queue.shift();
    S.queue.push(id);
    S.lastFeedback = S.queue.length > 1
      ? { kind: 'info', html: `Skipped ${esc(BY_ID[id].name)} — it will come back at the end.` }
      : { kind: 'info', html: 'That’s the last one! Give it a try or tap “Show me.”' };
    nextQuestion();
  }

  // ---------------------------------------------------------------------------
  // Finish / results
  // ---------------------------------------------------------------------------
  function finish() {
    S.running = false;
    clearInterval(S.timer);
    tick();
    restoreRaised();
    const total = S.ids.length;
    const correct = S.ids.filter(id => S.results[id] === 'correct').length;
    const revealed = S.ids.filter(id => S.results[id] === 'revealed');
    const pct = total ? Math.round((correct / total) * 100) : 0;
    const acc = S.clicks ? Math.round((S.goodClicks / S.clicks) * 100) : 100;

    let best = null;
    const key = `boneQuizBest:${DKEY}:${S.mode}:${S.setKey}`;
    try {
      best = JSON.parse(localStorage.getItem(key) || 'null');
      if (S.setKey !== 'review' && (!best || pct > best.pct || (pct === best.pct && S.elapsed < best.time))) {
        localStorage.setItem(key, JSON.stringify({ pct, time: S.elapsed }));
        best = null; // new record
      }
    } catch (_) { /* storage unavailable — fine */ }

    $('resultsTitle').textContent = pct === 100 ? 'Perfect score!' : pct >= 80 ? 'Great job!' : 'Quiz complete!';
    $('resultsLead').textContent = best
      ? `Your best on this quiz: ${best.pct}% in ${fmtTime(best.time)}.`
      : (S.setKey === 'review' ? 'Review round finished.' : 'New personal best for this quiz!');
    $('resultsGrid').innerHTML = `
      <div><b>${pct}%</b>Score (${correct}/${total})</div>
      <div><b>${fmtTime(S.elapsed)}</b>Time</div>
      <div><b>${acc}%</b>Accuracy</div>
      <div><b>${S.skips}</b>Skips</div>`;
    $('reviewWrap').innerHTML = revealed.length
      ? `<h3>Bones you missed (${revealed.length}) — red stripes on the diagram</h3><ul class="review">${revealed.map(id => {
          const b = BY_ID[id];
          return `<li><strong>${esc(b.name)}</strong> (${esc(b.aka)}) — ${esc(b.def)}</li>`;
        }).join('')}</ul>`
      : '<p>You found every bone without needing a reveal. &#127881;</p>';
    $('retryMissed').hidden = revealed.length === 0;
    S.missed = revealed;
    showOverlay('results');
  }

  // ---------------------------------------------------------------------------
  // Study mode
  // ---------------------------------------------------------------------------
  function renderStudy(id) {
    Object.values(boneEls).forEach(g => g.classList.remove('selected'));
    restoreRaised();
    let html = '';
    if (id) {
      boneEls[id].classList.add('selected');
      raise(id);
      html += `<p class="prompt-label">Study mode</p>${boneInfoHTML(BY_ID[id])}`;
    } else {
      html += `<p class="prompt-label">Study mode</p>
        <h2 class="prompt-name">Tap any bone</h2>
        <p class="def">Tap a bone on the diagram, or choose one from the list below, to see its name, definition and a memory tip. ${D.legend ? 'Colors show which part of the skeleton each bone belongs to.' : 'Each bone has its own color.'}</p>`;
    }
    if (D.legend) html += `<ul class="legend" aria-label="Color key">${GLOSSARY_ORDER.map(k =>
      `<li class="chip"><span class="swatch" style="background:${GROUPS[k].color}"></span>${esc(GROUPS[k].label)}</li>`).join('')}</ul>`;
    html += `<div class="glossary">${GLOSSARY_ORDER.map(k => `
      <h2>${esc(GROUPS[k].label)}</h2>
      <ul>${BONES.filter(b => b.group === k).map(b => `
        <li><button type="button" data-study="${b.id}" ${b.id === id ? 'aria-current="true"' : ''}>
          <span class="swatch" style="background:${boneColor(b)}"></span>
          <span><strong>${esc(b.name)}</strong><small>${esc(b.aka)}</small></span>
        </button></li>`).join('')}</ul>`).join('')}</div>`;
    panelBody.innerHTML = html;
    panelBody.querySelectorAll('[data-study]').forEach(btn => btn.onclick = () => {
      renderStudy(btn.dataset.study);
      $('panel').scrollTop = 0;
    });
  }

  // ---------------------------------------------------------------------------
  // Overlays (menu & results)
  // ---------------------------------------------------------------------------
  let lastFocus = null;
  function showOverlay(name) {
    lastFocus = document.activeElement;
    ['menu', 'results'].forEach(n => { $(n).hidden = n !== name; });
    const first = $(name).querySelector('input:checked, button:not([hidden])');
    if (first) first.focus();
  }
  function hideOverlays() {
    $('menu').hidden = true; $('results').hidden = true;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('menu').hidden && !$('menuClose').hidden) hideOverlays();
    // keep Tab inside an open dialog
    if (e.key === 'Tab') {
      const open = ['menu', 'results'].map($).find(o => !o.hidden);
      if (!open) return;
      const items = [...open.querySelectorAll('button:not([hidden]), input')].filter(n => n.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function loadDiagram(key) {
    DKEY = key; D = DIAGRAMS[key];
    GROUPS = D.groups; BONES = D.bones; GLOSSARY_ORDER = Object.keys(GROUPS);
    BY_ID = Object.fromEntries(BONES.map(b => [b.id, b]));
    SETS = {};
    D.sets.forEach(o => {
      const ids = BONES.filter(o.filter || (() => true)).map(b => b.id);
      Object.defineProperty(SETS, o.key, { enumerable: true, get: () => o.random ? shuffle([...ids]).slice(0, o.random) : ids });
    });
    BASE = { x: 0, y: 0, w: D.box.w, h: D.box.h };
    vb = { ...BASE }; applyVB();
    renderDiagram();
    $('appTitle').textContent = D.title;
    $('svgTitle').textContent = D.svgTitle;
    $('svgDesc').textContent = `${D.svgDesc} Each bone region can be selected; use Tab to move between regions and Enter to choose one. The Name the Bone mode can be played entirely with buttons.`;
    $('setOptions').innerHTML = D.sets.map((o, i) => `
      <label class="opt"><input type="radio" name="set" value="${o.key}" ${i ? '' : 'checked'}>
        <span>${esc(o.label)}<small>${esc(o.note(BONES.filter(o.filter || (() => true)).length))}</small></span></label>`).join('');
    S.current = null; S.running = false; clearInterval(S.timer);
    S.elapsed = 0; tick();
    $('statScore').textContent = '0'; $('statTotal').textContent = '0'; $('progressBar').style.width = '0';
    panelBody.innerHTML = '<p class="def">Choose a mode to begin.</p>';
  }

  document.querySelectorAll('input[name="diagram"]').forEach(r => r.addEventListener('change', () => {
    loadDiagram(r.value);
    $('menuClose').hidden = true; // a game on the other diagram can't be resumed
  }));

  $('menuForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    hideOverlays();
    startGame(fd.get('mode'), fd.get('set'), fd.get('showDef') === 'on');
    $('menuClose').hidden = false;
  });
  $('menuBtn').onclick = () => {
    if (S.running) { S.running = false; S.elapsed = Date.now() - S.start; }
    showOverlay('menu');
  };
  $('menuClose').onclick = () => {
    if (S.mode !== 'study' && S.current) { S.running = true; S.start = Date.now() - S.elapsed; }
    hideOverlays();
  };
  $('playAgain').onclick = () => { hideOverlays(); startGame(S.mode, S.setKey === 'review' ? 'all' : S.setKey, S.showDef); };
  $('retryMissed').onclick = () => { hideOverlays(); startGame(S.mode, 'review', S.showDef, S.missed); };
  $('toMenu').onclick = () => showOverlay('menu');

  // Initial screen: diagram visible behind the menu. bone_quiz.html#skull opens the skull.
  const startKey = location.hash.slice(1) in DIAGRAMS ? location.hash.slice(1) : 'skeleton';
  document.querySelector(`input[name="diagram"][value="${startKey}"]`).checked = true;
  loadDiagram(startKey);
  showOverlay('menu');
})();
</script>
</body>
</html>
