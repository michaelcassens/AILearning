<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Tempest Tribute</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Tempest Tribute: a vector tube shooter"></canvas>
<script>
'use strict';
// ══════════════════════════════════════════════════════════
// TEMPEST TRIBUTE: a tribute to Atari's 1981 vector arcade game
// Spin around the rim of a 3D tube and blast whatever climbs up.
// The arcade spinner knob becomes an on-screen dial on phones,
// or you can just touch the part of the tube you want to aim at.
// ══════════════════════════════════════════════════════════

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let touchUI = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const L = {}; // layout

// ── LAYOUT ─────────────────────────────────────────────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  layout();
}
function layout() {
  let fx = 0, fy = 0, fw = W, fh = H;
  L.dial = L.fire = L.zap = null;
  if (touchUI) {
    if (H >= W) {
      // Portrait: playfield on top, spinner dial and buttons underneath
      const ch = Math.max(150, Math.min(H * 0.3, 260));
      fh = H - ch;
      const cy = H - ch / 2;
      const dr = Math.min(ch * 0.4, W * 0.22);
      L.dial = { x: 12 + dr + 6, y: cy, r: dr };
      const fr = Math.min(dr * 0.62, ch * 0.27), zr = fr * 0.58;
      L.fire = { x: W - 12 - fr - 6, y: cy + ch * 0.12, r: fr };
      L.zap = { x: L.fire.x - fr * 0.9, y: L.fire.y - fr - zr - 10, r: zr };
    } else {
      // Landscape: dial on the left, buttons on the right, tube in the middle
      const sw = Math.max(120, Math.min(W * 0.22, 240));
      fx = sw; fw = W - 2 * sw;
      const dr = Math.min(sw * 0.42, H * 0.3);
      L.dial = { x: sw / 2, y: H * 0.6, r: dr };
      const fr = Math.min(sw * 0.3, H * 0.17), zr = fr * 0.6;
      L.fire = { x: W - sw / 2, y: H * 0.66, r: fr };
      L.zap = { x: W - sw / 2, y: L.fire.y - fr - zr - 18, r: zr };
    }
  }
  L.fx = fx; L.fy = fy; L.fw = fw; L.fh = fh;
  L.hud = Math.max(34, Math.min(fh * 0.08, 52));
  L.ox = fx + fw / 2;
  L.oy = fy + L.hud + (fh - L.hud) / 2;
  L.R = Math.min(fw, fh - L.hud) * 0.41;
  L.pause = { x: W - 26, y: 24, r: 18 };
}

// ── WEB SHAPES ─────────────────────────────────────────────
// Each web is a list of rim points; lanes sit between neighbouring points.
// Closed webs go clockwise on screen so that spinning right = clockwise.
function pathPts(verts, counts, closed) {
  const out = [];
  const ne = closed ? verts.length : verts.length - 1;
  for (let k = 0; k < ne; k++) {
    const a = verts[k], b = verts[(k + 1) % verts.length], c = counts[k];
    for (let j = 0; j < c; j++) {
      const t = j / c;
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  if (!closed) out.push(verts[verts.length - 1].slice());
  return out;
}
function mkShape(name, pts, closed) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const s = 2 / Math.max(x1 - x0, y1 - y0), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let p = pts.map(q => [(q[0] - cx) * s, (q[1] - cy) * s]);
  let vp = [0, 0];
  if (!closed) {
    // Open webs are viewed like a trench: rim near the bottom, far end up top
    let my = -1e9; for (const q of p) my = Math.max(my, q[1]);
    const dy = 0.9 - my; p = p.map(q => [q[0], q[1] + dy]);
    vp = [0, -0.95];
  }
  return { name, pts: p, closed, n: closed ? p.length : p.length - 1, vp, far: closed ? 0.16 : 0.22 };
}
const SHAPES = [];
(function buildShapes() {
  const ring = (rx, ry, alt) => {
    const o = [];
    for (let i = 0; i < 16; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 16, r = alt && i % 2 ? alt : 1;
      o.push([Math.cos(a) * rx * r, Math.sin(a) * ry * r]);
    }
    return o;
  };
  SHAPES.push(mkShape('CIRCLE', ring(1, 1), true));
  SHAPES.push(mkShape('SQUARE', pathPts([[-1, -1], [1, -1], [1, 1], [-1, 1]], [4, 4, 4, 4], true), true));
  SHAPES.push(mkShape('PLUS', [[-.5, -1.5], [0, -1.5], [.5, -1.5], [.5, -.5], [1.5, -.5], [1.5, 0], [1.5, .5], [.5, .5], [.5, 1.5], [0, 1.5], [-.5, 1.5], [-.5, .5], [-1.5, .5], [-1.5, 0], [-1.5, -.5], [-.5, -.5]], true));
  SHAPES.push(mkShape('BOWTIE', pathPts([[-1.6, -1], [0, -.35], [1.6, -1], [1.6, 1], [0, .35], [-1.6, 1]], [3, 3, 2, 3, 3, 2], true), true));
  SHAPES.push(mkShape('V', pathPts([[-1.6, -.9], [0, .9], [1.6, -.9]], [8, 8], false), false));
  SHAPES.push(mkShape('STAR', ring(1, 1, 0.55), true));
  const sv = [[-1.6, -.9]]; let x = -1.6, y = -.9;
  for (let s = 0; s < 4; s++) { x += .8; sv.push([x, y]); y += .45; sv.push([x, y]); }
  SHAPES.push(mkShape('STEPS', pathPts(sv, [2, 2, 2, 2, 2, 2, 2, 2], false), false));
  const u = []; for (let i = 0; i <= 16; i++) { const a = Math.PI - i * Math.PI / 16; u.push([Math.cos(a), Math.sin(a) * 1.1]); }
  SHAPES.push(mkShape('U', u, false));
  SHAPES.push(mkShape('TRIANGLE', pathPts([[0, -1.1], [1.15, .9], [-1.15, .9]], [5, 6, 5], true), true));
  SHAPES.push(mkShape('LINE', pathPts([[-1.6, 0], [1.6, 0]], [16], false), false));
  const ht = [];
  for (let i = 0; i < 16; i++) {
    const t = i * Math.PI * 2 / 16;
    ht.push([16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
  }
  SHAPES.push(mkShape('HEART', ht, true));
  SHAPES.push(mkShape('W', pathPts([[-1.6, -.8], [-.8, .8], [0, -.3], [.8, .8], [1.6, -.8]], [4, 4, 4, 4], false), false));
  SHAPES.push(mkShape('OVAL', ring(1.5, 0.9), true));
})();
const WEB_COLORS = ['#2a4bff', '#ff2a2a', '#ffe02a', '#22e0ff', '#30ff60'];
function levelColor(n) { return WEB_COLORS[Math.floor((n - 1) / SHAPES.length) % WEB_COLORS.length]; }
function shapeFor(n) { return SHAPES[(n - 1) % SHAPES.length]; }

// ── PROJECTION ─────────────────────────────────────────────
// z = 0 is the rim (near you), z = 1 is the far end of the tube.
let S = SHAPES[0], DEP = 1 / S.far - 1, camZ = 0;
function useShape(s) { S = s; DEP = 1 / S.far - 1; }
function kz(z) { return 1 / (1 + (z - camZ) * DEP); }
function P(nx, ny, z) {
  const k = kz(z), vx = S.vp[0], vy = S.vp[1];
  return [L.ox + (vx + (nx - vx) * k) * L.R, L.oy + (vy + (ny - vy) * k) * L.R];
}
function vpScreen() { return [L.ox + S.vp[0] * L.R, L.oy + S.vp[1] * L.R]; }
function edgePt(i, z) {
  const np = S.pts.length;
  const p = S.pts[S.closed ? ((i % np) + np) % np : i];
  return P(p[0], p[1], z);
}
function laneEdges(l, z) { return [edgePt(l, z), edgePt(l + 1, z)]; }
function laneMid(l, z) { const [a, b] = laneEdges(l, z); return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
function wrapLane(l) { return S.closed ? ((l % S.n) + S.n) % S.n : Math.max(0, Math.min(S.n - 1, l)); }
function laneDiff(a, b) {
  let d = b - a;
  if (S.closed) { d = ((d % S.n) + S.n) % S.n; if (d > S.n / 2) d -= S.n; }
  return d;
}
// Screen-space frame of a lane at depth z: edges A/B, middle M, across-lane unit u,
// width w, and p = unit perpendicular pointing "into" the tube.
function laneFrame(l, z) {
  const [A, B] = laneEdges(l, z);
  const M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  const dx = B[0] - A[0], dy = B[1] - A[1], w = Math.hypot(dx, dy) || 1;
  const u = [dx / w, dy / w];
  let p = [-u[1], u[0]];
  const v = vpScreen();
  if (p[0] * (v[0] - M[0]) + p[1] * (v[1] - M[1]) < 0) p = [-p[0], -p[1]];
  return { A, B, M, u, w, p };
}
const add = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s];
const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const rand = (a, b) => a + Math.random() * (b - a);
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ── AUDIO (synthesized, no files) ──────────────────────────
let AC = null, soundOn = true, noiseBuf = null;
try { soundOn = localStorage.getItem('tempest_sound') !== 'off'; } catch (e) {}
function unlockAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(f0, f1, dur, type = 'square', vol = 0.08, delay = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15, freq = 1200) {
  if (!AC || !soundOn) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf;
  f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination);
  s.start(t); s.stop(t + dur);
}
const sfx = {
  fire: () => tone(900, 220, 0.07, 'square', 0.03),
  boom: () => noise(0.35, 0.18, 2400),
  spike: () => tone(1400, 900, 0.03, 'square', 0.02),
  zap: () => { noise(0.8, 0.25, 5000); tone(200, 2000, 0.6, 'sawtooth', 0.05); },
  die: () => { noise(1.2, 0.3, 1500); tone(400, 40, 1.0, 'sawtooth', 0.08); },
  grab: () => tone(300, 90, 0.9, 'square', 0.05),
  warp: () => tone(80, 1600, 2.2, 'sawtooth', 0.04),
  life: () => [0, 0.1, 0.2].forEach((d, i) => tone(600 + i * 200, 600 + i * 200, 0.09, 'square', 0.05, d)),
  click: () => tone(600, 600, 0.04, 'square', 0.03),
  nope: () => tone(150, 100, 0.12, 'square', 0.04)
};

// ── GAME STATE ─────────────────────────────────────────────
const START_LEVELS = [1, 3, 5, 7, 9, 11, 13, 15, 17];
const G = { state: 'title', level: 1, sel: 0, score: 0, hi: 0, lives: 3, nextLife: 20000, stT: 0, paused: false, msg: '', msgT: 0, wasWarp: false };
try { G.hi = +localStorage.getItem('tempest_hi') || 0; } catch (e) {}
let player = { pos: 0.5, z: 0, alive: true, grabbed: null, exploded: false };
let enemies = [], shots = [], eshots = [], parts = [], spikes = [];
let queue = 0, spawnT = 0, zapUses = 0, flash = 0, warpV = 0;
let spin = 0, aim = null, dialAngle = 0, fireCD = 0, keyHold = 0;
const keys = { left: false, right: false, fire: false };
const ptrs = new Map();
let uiButtons = [];

function saveHi() {
  if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('tempest_hi', G.hi); } catch (e) {} }
}
function showMsg(t, d = 1.6) { G.msg = t; G.msgT = d; }
function addScore(n) {
  G.score += n;
  if (G.score >= G.nextLife) { G.lives++; G.nextLife += 20000; sfx.life(); showMsg('BONUS LIFE', 1.4); }
}
function pLane() { return Math.floor(player.pos); }

function diff() {
  const n = G.level;
  return {
    spd: Math.min(0.42, 0.11 + n * 0.012),          // climb speed (tube depths per second)
    flipEvery: Math.max(0.6, 2.2 - n * 0.08),       // how often flippers flip while climbing
    rimFlip: Math.max(0.16, 0.5 - n * 0.02),         // flip speed once on the rim
    shotRate: Math.min(0.5, 0.05 + n * 0.03),        // enemy shots per second each
    spawnEvery: Math.max(0.35, 1.5 - n * 0.07),
    maxOnBoard: Math.min(14, 5 + Math.floor(n / 2))
  };
}
function pickType() {
  const n = G.level, opts = [['flipper', 10]];
  if (n >= 2) opts.push(['tanker', 3 + n * 0.3]);
  if (n >= 3) opts.push(['spiker', 3]);
  if (n >= 5) opts.push(['fuseball', 2 + n * 0.15]);
  if (n >= 7) opts.push(['pulsar', 2 + n * 0.15]);
  let tot = 0; for (const o of opts) tot += o[1];
  let r = Math.random() * tot;
  for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }
  return 'flipper';
}
function mkEnemy(type, lane, z) {
  const D = diff();
  let carry = 'flipper';
  if (type === 'tanker' && G.level >= 9) carry = ['flipper', 'flipper', 'pulsar', 'fuseball'][Math.floor(Math.random() * 4)];
  return { type, lane, z, flip: null, ft: rand(0.4, D.flipEvery), rimT: 0, grab: 0, phase: 'up', tz: rand(0.25, 0.6), pulse: 0, ph: Math.random() * 6, dead: false, carry };
}
function startFlip(e, to) { if (to !== e.lane) e.flip = { from: e.lane, to, p: 0 }; }
function enemyLane(e) { return e.flip ? (e.flip.p < 0.5 ? e.flip.from : e.flip.to) : e.lane; }

function toTitle() {
  G.state = 'title'; G.paused = false; ptrs.clear(); aim = null;
  G.level = START_LEVELS[G.sel]; useShape(shapeFor(G.level)); camZ = 0;
}
function startGame() {
  unlockAudio();
  G.score = 0; G.lives = 3; G.nextLife = 20000; G.paused = false; parts = [];
  setupLevel(START_LEVELS[G.sel]);
}
function setupLevel(n) {
  G.level = n;
  useShape(shapeFor(n));
  spikes = new Array(S.n).fill(0);
  enemies = []; shots = []; eshots = [];
  queue = Math.min(8 + n * 2, 40);
  spawnT = 1.0; zapUses = 0; warpV = 0;
  player = { pos: Math.floor(S.n / 2) + 0.5, z: 0, alive: true, grabbed: null, exploded: false };
  camZ = -2.5; G.state = 'arrive'; G.stT = 0;
  showMsg('LEVEL ' + n + '\n' + (n === START_LEVELS[G.sel] ? 'GOOD LUCK' : 'SUPERZAPPER RECHARGE'), 2);
}

// ── UPDATE ─────────────────────────────────────────────────
function update(dt) {
  if (G.paused) return;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (flash > 0) flash -= dt;
  if (G.msgT > 0) G.msgT -= dt;
  G.stT += dt;
  switch (G.state) {
    case 'title':
      if (Math.abs(spin) >= 1) { changeSel(Math.sign(spin)); spin = 0; }
      break;
    case 'arrive': {
      const p = Math.min(1, G.stT / 1.1);
      camZ = -2.5 * (1 - p) * (1 - p);
      movePlayer(dt); firing(dt); updShots(dt);
      if (p >= 1) { camZ = 0; G.state = 'play'; }
      break;
    }
    case 'play':
      movePlayer(dt); firing(dt); updShots(dt);
      if (G.state === 'play') updEnemies(dt);
      if (G.state === 'play') updEShots(dt);
      if (G.state === 'play') spawn(dt);
      if (G.state === 'play' && queue === 0 && enemies.length === 0) startWarp();
      break;
    case 'warp':
      movePlayer(dt); firing(dt); updShots(dt); updWarp(dt);
      break;
    case 'dying':
      updDying(dt);
      break;
  }
}

function movePlayer(dt) {
  if (!player.alive) { spin = 0; return; }
  let d = spin; spin = 0;
  const kd = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (kd) { aim = null; keyHold += dt; if (keyHold > 0.18) d += kd * 12 * dt; }
  if (aim !== null) {
    const target = aim + 0.5;
    let df = target - player.pos;
    if (S.closed) { df = ((df % S.n) + S.n) % S.n; if (df > S.n / 2) df -= S.n; }
    const st = 24 * dt;
    d += Math.abs(df) <= st ? df : Math.sign(df) * st;
  }
  player.pos += d;
  if (S.closed) player.pos = ((player.pos % S.n) + S.n) % S.n;
  else player.pos = Math.max(0, Math.min(S.n - 0.001, player.pos));
}
function stepLane(d) {
  if (!player.alive) return;
  let p = Math.floor(player.pos) + d + 0.5;
  if (S.closed) p = ((p % S.n) + S.n) % S.n; else p = Math.max(0.5, Math.min(S.n - 0.5, p));
  player.pos = p;
}

function isFiring() {
  if (keys.fire) return true;
  for (const p of ptrs.values()) if (p.role === 'fire' || p.role === 'aim') return true;
  return false;
}
function firing(dt) {
  fireCD -= dt;
  if (player.alive && isFiring() && fireCD <= 0 && shots.length < 8) {
    shots.push({ lane: pLane(), z: player.z });
    fireCD = 0.085;
    sfx.fire();
  }
}

function updShots(dt) {
  for (const s of shots) {
    const z0 = s.z;
    s.z += 2.4 * dt;
    for (const e of enemies) {
      if (e.dead || enemyLane(e) !== s.lane) continue;
      if (e.z >= z0 - 0.03 && e.z <= s.z + 0.03) { hitEnemy(e, false); s.dead = true; break; }
    }
    if (s.dead) continue;
    for (const b of eshots) {
      if (!b.dead && b.lane === s.lane && b.z >= z0 - 0.04 && b.z <= s.z + 0.04) { b.dead = true; s.dead = true; addScore(10); break; }
    }
    if (s.dead) continue;
    const sp = spikes[s.lane];
    if (sp > 0 && s.z >= 1 - sp) {
      spikes[s.lane] = sp - 0.07 < 0.03 ? 0 : sp - 0.07;
      s.dead = true; addScore(1); sfx.spike();
      const m = laneMid(s.lane, Math.max(1 - sp, camZ + 0.01));
      burst(m[0], m[1], '#6f6', 4, 60);
      continue;
    }
    if (s.z > 1) s.dead = true;
  }
  shots = shots.filter(s => !s.dead);
  enemies = enemies.filter(e => !e.dead);
  eshots = eshots.filter(b => !b.dead);
}

const POINTS = { flipper: 150, tanker: 100, spiker: 50, fuseball: 250, pulsar: 200 };
const ECOL = { flipper: '#ff3030', tanker: '#c040ff', spiker: '#30ff50', fuseball: '#ffffff', pulsar: '#30ffff' };
function enemyScreenPos(e) {
  const z = Math.max(e.z, camZ + 0.01);
  if (e.flip) return lerp2(laneMid(e.flip.from, z), laneMid(e.flip.to, z), e.flip.p);
  return laneMid(e.lane, z);
}
function hitEnemy(e, byZap) {
  if (e.dead) return;
  e.dead = true;
  addScore(e.type === 'fuseball' && e.z < 0.1 ? 750 : POINTS[e.type]);
  const m = enemyScreenPos(e);
  burst(m[0], m[1], ECOL[e.type], 14, 160);
  sfx.boom();
  if (e.type === 'tanker' && !byZap) splitTanker(e);
}
function splitTanker(e) {
  for (const d of [-1, 1]) {
    let to = e.lane + d;
    if (!S.closed && (to < 0 || to >= S.n)) to = e.lane - d;
    to = wrapLane(to);
    const f = mkEnemy(e.carry, e.lane, Math.max(0, e.z));

    eshots.push({ lane: enemyLane(e), z: e.z, r: 0 });
}

function updEnemies(dt) {
  const D = diff(), pl = pLane();

    }
    switch (e.type) {

          e.z = Math.max(0, e.z - D.spd * dt);
          if (!e.flip && (e.ft -= dt) <= 0) {
            e.ft = rand(D.flipEvery * 0.5, D.flipEvery * 1.5);
            const d = Math.random() < 0.5 ? -1 : 1;
            let to = e.lane + d;
            if (!S.closed && (to < 0 || to >= S.n)) to = e.lane - d;
            startFlip(e, wrapLane(to));
          }
          maybeShoot(e, D, dt);
        } else if (!e.flip) {
          // On the rim: flip along it toward the player and grab them
          if (e.lane === pl && player.alive) {
            e.grab += dt;
            if (e.grab > 0.2) { killPlayer('grab', e); return; }
          } else {
            e.grab = 0;

              const d = Math.sign(laneDiff(e.lane, pl));
              if (d) startFlip(e, wrapLane(e.lane + d));
            }
          }
        }
        break;
      case 'tanker':
        e.z -= D.spd * 0.75 * dt;
        maybeShoot(e, D, dt);
        if (e.z <= 0) { e.z = 0; e.dead = true; splitTanker(e); }
        break;
      case 'spiker':

          e.z += D.spd * 1.1 * dt;

        }
        break;
      case 'fuseball': {

        e.z += Math.sign(dz) * Math.min(Math.abs(dz), D.spd * 1.3 * dt);
        if (!e.flip && (e.ft -= dt) <= 0) {
          e.ft = rand(0.6, 1.6);
          let d = e.z < 0.1 ? Math.sign(laneDiff(e.lane, pl)) : (Math.random() < 0.5 ? -1 : 1);
          if (!d) d = 1;
          startFlip(e, wrapLane(e.lane + d));

        break;

}

function updEShots(dt) {
  const pl = pLane();
  for (const b of eshots) {
    b.z -= (0.5 + G.level * 0.015) * dt;
    b.r += dt * 8;
    if (b.z <= 0) {
      b.dead = true;
      if (b.lane === pl && player.alive) { killPlayer('shot'); return; }
    }
  }
  eshots = eshots.filter(b => !b.dead);
}

function spawn(dt) {
  if (queue <= 0) return;
  const D = diff();
  if ((spawnT -= dt) > 0 || enemies.length >= D.maxOnBoard) return;
  spawnT = D.spawnEvery * rand(0.6, 1.4);
  queue--;
  enemies.push(mkEnemy(pickType(), Math.floor(Math.random() * S.n), 1));
}

function startWarp() {
  G.state = 'warp'; G.stT = 0; warpV = 0.05; eshots = [];
  if (spikes.some(s => s > 0)) showMsg('AVOID SPIKES', 1.6);
  sfx.warp();
}
function updWarp(dt) {

  const sp = spikes[pLane()];

}

function superzap() {
  if (G.state !== 'play' || !player.alive) return;
  if (zapUses >= 2) { sfx.nope(); return; }
  const live = enemies.filter(e => !e.dead);
  if (zapUses === 0) {
    for (const e of live) hitEnemy(e, true);
    eshots = []; flash = 0.5; showMsg('SUPERZAPPER!', 0.8);
  } else if (live.length) {
    hitEnemy(live[Math.floor(Math.random() * live.length)], true); flash = 0.25;
  }

  sfx.zap();
}

  shots = [];

}

  const explodeAt = player.grabbed ? 1.0 : 0;

  if (!player.exploded && G.stT >= explodeAt) {

    const f = laneFrame(pLane(), Math.max(player.z, camZ + 0.01));
    burst(f.M[0], f.M[1], '#ffff40', 30, 260);
    burst(f.M[0], f.M[1], '#ffffff', 12, 140);

}

  enemies = []; eshots = []; shots = [];
  player.alive = true; player.z = 0; player.exploded = false; player.grabbed = null;
  camZ = 0; spawnT = 1.5;
  G.state = 'play'; G.stT = 0;

function burst(x, y, col, n, sp) {

    const a = Math.random() * Math.PI * 2, v = sp * rand(0.3, 1);
    const life = rand(0.35, 0.9);

function drawSpikes() {

}
function flipEnds(e) {

  const piv = dir > 0 ? B0 : A0, st = dir > 0 ? A0 : B0, en = dir > 0 ? B1 : A1;

}
function button(label, cx, cy, w, h, act, col = '#30ffff', size) {
  ctx.globalAlpha = 0.12; ctx.fillStyle = col; ctx.fillRect(cx - w / 2, cy - h / 2, w, h); ctx.globalAlpha = 1;
  glow(() => ctx.rect(cx - w / 2, cy - h / 2, w, h), col, 1.6);
  text(label, cx, cy + 1, size || Math.min(h * 0.45, 24), col, 'center', false);
  uiButtons.push({ x: cx - w / 2, y: cy - h / 2, w, h, act });
}

function drawTitle() {
  const m = Math.min(W, H), port = W <= H * 1.2;
  const help = touchUI
    ? 'Touch the tube where you want to go: you slide there and fire automatically. Or turn the SPIN dial like the arcade knob and hold FIRE. ZAP is your Superzapper (two charges per level).'
    : 'Left/Right, A/D or mouse wheel to spin. SPACE to fire. Z for Superzapper. P to pause. Or click and drag on the tube to aim and fire.';
  const bs = Math.max(40, m * 0.1), sm = Math.max(34, bs * 0.75), fs = Math.max(11, m * 0.027);
  const colW = port ? W - 32 : W * 0.44, mx = port ? W / 2 : W * 0.74, hx = port ? W / 2 : W * 0.28;
  const helpW = Math.min(colW, 560);
  const menuH = bs * 4.3 + sm / 2 + 14 + wrapText(help, 0, 0, helpW, fs, '', 1.35, true);
  const ts = port ? Math.min(W * 0.085, H * 0.065, 56) : Math.min(W * 0.06, H * 0.11, 56);

  // Header: title, subtitle and high score
  let y = H * 0.04 + ts * 0.65;
  text('TEMPEST', hx, y, ts * 1.3, '#ff4040'); y += ts * 1.15;
  text('TRIBUTE', hx, y, ts * 0.7, '#ffff40'); y += ts * 0.75;
  text("A tribute to Atari's 1981 arcade classic", hx, y, Math.max(10, ts * 0.27), '#30ffff', 'center', false); y += ts * 0.6;
  text('HIGH SCORE ' + G.hi, hx, y, Math.max(12, ts * 0.34), '#ff4040', 'center', false);
  const headBottom = y + ts * 0.45;
  const menuTop = port ? H - 12 - menuH : Math.max(12, (H - menuH) / 2);

  // Preview of the starting level's web, gently breathing
  const webBottom = port ? menuTop : H - 8;
  const R = Math.min(port ? W * 0.38 : W * 0.2, (webBottom - headBottom) * 0.42);
  if (R > 30) {
    const saved = { ox: L.ox, oy: L.oy, R: L.R };
    L.ox = hx; L.oy = (headBottom + webBottom) / 2; L.R = R;
    camZ = -0.15 + Math.sin(performance.now() / 1400) * 0.12;
    drawWeb(levelColor(G.level), 0.7);
    camZ = 0;
    Object.assign(L, saved);
  }

  // Menu: level picker, start, sound, back to hub, help
  y = menuTop + bs * 0.3;
  text('START LEVEL', mx, y, Math.max(12, bs * 0.3), '#30ffff', 'center', false);
  y += bs * 0.85;
  const ax = Math.min(bs * 1.9, colW / 2 - bs / 2);
  button('◀', mx - ax, y, bs, bs, () => changeSel(-1));
  button('▶', mx + ax, y, bs, bs, () => changeSel(1));
  text(String(START_LEVELS[G.sel]), mx, y, bs * 0.75, '#ffff40');
  y += bs * 0.8;
  text(shapeFor(START_LEVELS[G.sel]).name + ' WEB', mx, y, Math.max(11, bs * 0.26), levelColor(START_LEVELS[G.sel]), 'center', false);
  y += bs * 1.15;
  button('START', mx, y, Math.min(240, colW * 0.8), bs * 1.1, startGame, '#ffff40', Math.min(bs * 0.5, 28));
  y += bs * 1.2;
  const bx = Math.min(colW * 0.25, 105), bw = Math.min(170, colW * 0.46);
  button(soundOn ? 'SOUND: ON' : 'SOUND: OFF', mx - bx, y, bw, sm, toggleSound, '#30ffff', Math.max(11, sm * 0.36));
  button('◀ HUB', mx + bx, y, bw, sm, () => { location.href = 'index.html'; }, '#30ffff', Math.max(11, sm * 0.36));
  y += sm / 2 + 14 + fs * 0.5;
  wrapText(help, mx, y, helpW, fs, '#8fb8ff');
}
function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  const m = Math.min(W, H);
  text('PAUSED', W / 2, H * 0.36, Math.max(28, m * 0.09), '#ffff40');
  button('RESUME', W / 2, H * 0.52, Math.min(240, W * 0.6), 52, () => { G.paused = false; });
  button(soundOn ? 'SOUND: ON' : 'SOUND: OFF', W / 2, H * 0.52 + 66, Math.min(240, W * 0.6), 44, toggleSound);
  button('QUIT TO TITLE', W / 2, H * 0.52 + 124, Math.min(240, W * 0.6), 44, () => { saveHi(); toTitle(); }, '#ff4040');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  const m = Math.min(W, H);
  text('GAME OVER', W / 2, H * 0.38, Math.max(30, m * 0.1), '#ff4040');
  text('SCORE ' + G.score, W / 2, H * 0.38 + m * 0.11, Math.max(16, m * 0.05), '#ffff40');
  if (G.score >= G.hi && G.score > 0) text('NEW HIGH SCORE!', W / 2, H * 0.38 + m * 0.18, Math.max(14, m * 0.04), '#30ffff');
  if (G.stT > 1.2) button('CONTINUE', W / 2, H * 0.68, Math.min(240, W * 0.6), 52, toTitle, '#ffff40');
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  uiButtons = [];
  if (G.state === 'title') { drawTitle(); return; }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, flash)})`; ctx.fillRect(0, 0, W, H); }
  drawWeb(levelColor(G.level));
  drawSpikes();
  // Draw far things first so near enemies overlap them
  const order = enemies.slice().sort((a, b) => b.z - a.z);
  for (const e of order) drawEnemy(e);
  drawShots();
  if (!player.exploded && G.state !== 'gameover') drawClaw(pLane(), player.z, player.pos - pLane(), '#ffff40');
  drawParts();
  drawHUD();
  drawMsg();
  if (touchUI) drawControls();
  if (G.state === 'gameover') drawGameOver();
  if (G.paused) drawPauseOverlay();
}

// ── INPUT ──────────────────────────────────────────────────
function changeSel(d) {
  if (G.state !== 'title') return;
  G.sel = (G.sel + d + START_LEVELS.length) % START_LEVELS.length;
  G.level = START_LEVELS[G.sel]; useShape(shapeFor(G.level));
  sfx.click();
}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('tempest_sound', soundOn ? 'on' : 'off'); } catch (e) {}
  unlockAudio(); sfx.click();
}
function togglePause() {
  if (G.state === 'title' || G.state === 'gameover') return;
  G.paused = !G.paused; ptrs.clear(); aim = null;
}
function inGame() { return !G.paused && ['arrive', 'play', 'warp', 'dying'].includes(G.state); }
function laneAt(x, y) {
  let best = 0, bd = Infinity;
  const z = Math.max(0, camZ + 0.01);
  if (S.closed) {
    const a = Math.atan2(y - L.oy, x - L.ox);
    for (let l = 0; l < S.n; l++) {
      const m = laneMid(l, z);
      let d = Math.abs(Math.atan2(m[1] - L.oy, m[0] - L.ox) - a);
      if (d > Math.PI) d = 2 * Math.PI - d;
      if (d < bd) { bd = d; best = l; }
    }
  } else {
    for (let l = 0; l < S.n; l++) {
      const m = laneMid(l, z), d = Math.abs(m[0] - x);
      if (d < bd) { bd = d; best = l; }
    }
  }
  return best;
}
const near = (c, x, y, m) => c && Math.hypot(x - c.x, y - c.y) <= c.r * m;

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  if (e.pointerType === 'touch' && !touchUI) { touchUI = true; layout(); }
  const x = e.clientX, y = e.clientY;
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.act(); return; }
  }
  if (!inGame()) return;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (near(L.pause, x, y, 1.6)) { togglePause(); return; }
  if (touchUI) {
    if (near(L.dial, x, y, 1.5)) { ptrs.set(e.pointerId, { role: 'dial', a: Math.atan2(y - L.dial.y, x - L.dial.x) }); return; }
    if (near(L.fire, x, y, 1.35)) { ptrs.set(e.pointerId, { role: 'fire' }); return; }
    if (near(L.zap, x, y, 1.35)) { superzap(); ptrs.set(e.pointerId, { role: 'zap' }); return; }
  }
  if (x >= L.fx && x <= L.fx + L.fw && y >= L.fy && y <= L.fy + L.fh) {
    ptrs.set(e.pointerId, { role: 'aim' });
    aim = laneAt(x, y);
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  if (p.role === 'dial') {
    const a = Math.atan2(e.clientY - L.dial.y, e.clientX - L.dial.x);
    let da = a - p.a;
    while (da > Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    p.a = a; dialAngle += da;
    // One full turn of the dial = one full trip around the tube
    spin += da * S.n / (2 * Math.PI);
    aim = null;
  } else if (p.role === 'aim') aim = laneAt(e.clientX, e.clientY);
}, { passive: false });
function endPtr(e) {
  const p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (p && p.role === 'aim' && ![...ptrs.values()].some(q => q.role === 'aim')) aim = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (G.state === 'title') { changeSel(Math.sign(e.deltaY)); return; }
  if (inGame()) { spin += Math.sign(e.deltaY) * 0.6; aim = null; }
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

addEventListener('keydown', e => {
  unlockAudio();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    e.preventDefault();
    if (G.state === 'title') { if (!e.repeat) changeSel(-1); return; }
    if (!e.repeat && inGame()) { stepLane(-1); keyHold = 0; aim = null; }
    keys.left = true;
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    e.preventDefault();
    if (G.state === 'title') { if (!e.repeat) changeSel(1); return; }
    if (!e.repeat && inGame()) { stepLane(1); keyHold = 0; aim = null; }
    keys.right = true;
  } else if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (e.repeat) { keys.fire = true; return; }
    if (G.state === 'title') { startGame(); return; }
    if (G.state === 'gameover') { if (G.stT > 1.2) toTitle(); return; }
    if (G.paused) { G.paused = false; return; }
    keys.fire = true;
  } else if (k === 'z' || k === 'Z' || k === 'x' || k === 'X' || k === 'Shift') {
    if (!e.repeat) superzap();
  } else if (k === 'p' || k === 'P' || k === 'Escape') {
    togglePause();
  }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  else if (k === ' ' || k === 'Enter') keys.fire = false;
});
addEventListener('blur', () => { keys.left = keys.right = keys.fire = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && inGame()) { G.paused = true; ptrs.clear(); aim = null; }
});
addEventListener('resize', resize);

// ── MAIN LOOP ──────────────────────────────────────────────
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(tick);
}
resize();
toTitle();
requestAnimationFrame(tick);
</script>
</body>
</html>
